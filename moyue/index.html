<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>开局 · 江湾壹号 3601</title>
  <style>
    :root {
      --bg-dark: #0d0a09;
      --bg-card: rgba(22, 17, 15, 0.78);
      --bg-card-hover: rgba(30, 23, 20, 0.92);
      --paper: #f5ece1;
      --paper-dim: #cfc1b0;
      --paper-muted: #8e8072;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-deep: #997a23;
      --crimson: #c94a53;
      --line: rgba(212, 175, 55, 0.16);
      --line-bright: rgba(212, 175, 55, 0.38);
      --glow-gold: rgba(212, 175, 55, 0.28);
      --serif: "Songti SC", "Source Han Serif SC", "Noto Serif SC", "SimSun", Georgia, serif;
      --sans: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --c-shen: #e07a82;
      --c-zhou: #82a8d8;
      --c-wen: #6eb79c;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: var(--sans);
      color: var(--paper);
      padding: 16px 12px;
      -webkit-font-smoothing: antialiased;
    }

    /* 进场光效与动画 */
    @keyframes moFadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes moAura { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
    @keyframes moShimmer { 0% { transform: translateX(-150%); } 100% { transform: translateX(150%); } }
    @keyframes moPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

    #mo {
      max-width: 1040px;
      margin: 0 auto;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(900px 380px at 85% -10%, rgba(212, 175, 55, 0.12), transparent 70%),
        radial-gradient(750px 360px at -10% 105%, rgba(201, 74, 83, 0.11), transparent 65%),
        radial-gradient(800px 500px at 50% 45%, rgba(255, 255, 255, 0.02), transparent 80%),
        linear-gradient(176deg, #181210 0%, #0d0a09 85%);
      border: 1px solid var(--line);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: moFadeIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* 题头装饰 */
    .hd {
      position: relative;
      padding: 38px 24px 28px;
      text-align: center;
      overflow: hidden;
    }
    .hd::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.45), transparent);
    }
    .hd-orn {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      letter-spacing: 0.45em;
      text-indent: 0.45em;
      color: var(--gold-primary);
      text-transform: uppercase;
      margin-bottom: 12px;
      animation: moAura 4.5s ease-in-out infinite;
    }
    .hd-orn::before, .hd-orn::after {
      content: "";
      height: 1px;
      width: 56px;
      background: linear-gradient(90deg, transparent, var(--gold-primary));
    }
    .hd-orn::after {
      background: linear-gradient(90deg, var(--gold-primary), transparent);
    }
    .hd-t {
      margin: 4px 0 10px;
      font-family: var(--serif);
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 0.16em;
      color: #fff8f0;
      text-shadow: 0 0 28px rgba(212, 175, 55, 0.22), 0 2px 4px rgba(0,0,0,0.6);
    }
    .hd-s {
      font-size: 15.5px;
      letter-spacing: 0.25em;
      color: var(--paper-muted);
      font-weight: 300;
    }

    /* 内容主体 */
    .bd { padding: 28px 28px 8px; }
    .blk { margin-bottom: 32px; }
    .blk-h {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 15.5px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--gold-light);
    }
    .blk-h::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.24), transparent);
    }
    .blk-h i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold-primary);
      box-shadow: 0 0 10px var(--gold-primary);
    }

    .prose-card {
      padding: 18px 22px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,255,255,0.032), rgba(255,255,255,0.008));
      border: 1px solid var(--line);
      font-size: 15.5px;
      line-height: 1.95;
      color: var(--paper-dim);
    }
    .prose-card b { color: #fff; font-weight: 600; }

    /* 人物列表 */
    .cast { display: grid; gap: 14px; }
    .who {
      position: relative;
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 20px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(30, 24, 21, 0.65), rgba(18, 14, 12, 0.85));
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .who:hover {
      border-color: var(--line-bright);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }
    .who-img-wrap {
      position: relative;
      width: 110px;
      height: 150px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .who-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .who:hover .who-img-wrap img { transform: scale(1.04); }
    .who-info { min-width: 0; }
    .who-top {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .who-n {
      font-family: var(--serif);
      font-size: 22px;
      letter-spacing: 0.08em;
      color: #fff;
    }
    .who-m {
      font-size: 13.5px;
      letter-spacing: 0.04em;
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.12);
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid rgba(212, 175, 55, 0.25);
    }
    .who-d {
      font-size: 14.5px;
      line-height: 1.85;
      color: var(--paper-dim);
    }

    /* 规则叙事块 */
    .rule-card {
      position: relative;
      padding: 20px 22px;
      border-radius: 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--gold-primary);
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), rgba(255, 255, 255, 0.01));
      font-size: 15.5px;
      line-height: 2;
      color: var(--paper-dim);
    }
    .rule-card b { color: #fff; font-weight: 600; }

    /* 开局卡片网格 */
    .pick { padding: 4px 28px 10px; }
    .row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    .cd {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #14100e;
      color: inherit;
      font-family: inherit;
      text-align: left;
      transition: all 0.38s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cd::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 0; width: 50%;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,0.12), transparent);
      transform: translateX(-150%);
      pointer-events: none;
      z-index: 5;
    }
    .cd:hover::before { animation: moShimmer 1.1s ease; }
    .cd:hover {
      transform: translateY(-5px);
      border-color: var(--line-bright);
      box-shadow: 0 20px 42px rgba(0, 0, 0, 0.65);
    }

    .cd[data-k="1"] { --ac: var(--c-shen); }
    .cd[data-k="2"] { --ac: var(--c-zhou); }
    .cd[data-k="3"] { --ac: var(--c-wen); }

    .cd.on {
      border-color: var(--ac);
      box-shadow: 0 0 0 1px var(--ac), 0 0 35px -5px var(--ac), 0 20px 45px rgba(0,0,0,0.7);
    }

    .art {
      display: block;
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 145%;
      overflow: hidden;
      background: #090706;
    }
    .art > img.main {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cd:hover .art > img.main { transform: scale(1.05); }
    .art::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 65%;
      background: linear-gradient(180deg, transparent, rgba(14, 11, 10, 0.6) 40%, rgba(14, 11, 10, 0.98));
      pointer-events: none;
    }
    .art::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(100% 80% at 20% 100%, var(--ac), transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 2;
    }
    .cd:hover .art::before { opacity: 0.22; }
    .cd.on .art::before { opacity: 0.35; }

    .face {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 4;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid var(--ac);
      box-shadow: 0 6px 18px rgba(0,0,0,0.75), 0 0 0 3px rgba(14, 11, 10, 0.6);
      transition: transform 0.35s ease;
    }
    .cd:hover .face { transform: scale(1.06); }

    .idx-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 4;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #fff;
      background: rgba(14, 11, 10, 0.78);
      border: 1px solid var(--line-bright);
      backdrop-filter: blur(8px);
    }

    .cap {
      display: block;
      padding: 16px 16px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .cap-t {
      display: block;
      font-family: var(--serif);
      font-size: 18.5px;
      letter-spacing: 0.05em;
      color: #fff;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .cap-d {
      display: block;
      font-size: 14px;
      line-height: 1.75;
      color: var(--paper-dim);
      margin-bottom: 14px;
    }

    .reads {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px 10px;
    }
    .reads.stack {
      flex-direction: column;
      align-items: stretch;
      gap: 5px;
    }
    .chip-time {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.28);
    }
    .chip-shame {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: #ffd9de;
      background: rgba(201, 74, 83, 0.18);
      border: 1px solid rgba(201, 74, 83, 0.42);
    }

    /* 常识修改器机制块 */
    .sys-card {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
      gap: 12px;
      margin-top: 4px;
    }
    .sys-i {
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.055), rgba(255, 255, 255, 0.012));
    }
    .sys-i > b {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--gold-light);
    }
    .sys-i > p {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.85;
      color: var(--paper-dim);
    }
    .sys-i em { font-style: normal; color: #fff; font-weight: 600; }
    .sys-warn {
      grid-column: 1 / -1;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid rgba(201, 74, 83, 0.34);
      border-left: 3px solid var(--crimson);
      background: linear-gradient(135deg, rgba(201, 74, 83, 0.085), rgba(255, 255, 255, 0.012));
      font-size: 13.5px;
      line-height: 1.9;
      color: var(--paper-dim);
    }
    .sys-warn b { color: #ffdfe3; font-weight: 600; }

    /* 开局卡上的三条刻线 */
    .rlabel {
      width: 100%;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.09);
      font-size: 10.5px;
      letter-spacing: 0.14em;
      color: var(--paper-muted);
    }
    .rhead {
      display: flex;
      gap: 5px;
      padding-left: calc(30px + 3.6em);
      font-size: 10.5px;
      letter-spacing: 0.08em;
      color: var(--paper-muted);
    }
    .rhead i { font-style: normal; width: 2.2em; text-align: center; }

    .pp {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pp img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid currentColor;
    }
    .pp .ppn { width: 3.6em; font-size: 12px; font-weight: 500; line-height: 1; }
    .pp .ppv {
      display: inline-block;
      width: 2.2em;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f7f0fc;
    }

    /* 底栏操作反馈 */
    .ft {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 28px 24px;
      margin-top: 14px;
      border-top: 1px solid var(--line);
    }
    .ft-n {
      font-size: 14.5px;
      color: var(--paper-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--gold-deep), var(--gold-primary), var(--gold-light));
      transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 移动端适配 */
    @media (max-width: 680px) {
      body { padding: 8px 6px; }
      .hd { padding: 26px 16px 20px; }
      .hd-t { font-size: 28px; }
      .hd-s { font-size: 13.5px; letter-spacing: 0.15em; }
      .bd, .pick, .ft { padding-left: 14px; padding-right: 14px; }
      .row { grid-template-columns: 1fr; gap: 14px; }
      .art { padding-top: 115%; }
      .who { grid-template-columns: 85px 1fr; gap: 14px; padding: 12px 14px; }
      .who-img-wrap { width: 85px; height: 115px; }
      .who-n { font-size: 19px; }
      .who-d { font-size: 13.5px; }
      .cap-t { font-size: 17.5px; }
      .cap-d { font-size: 13.5px; }
    }
  </style>
</head>
<body>
<div id="mo">
  <div class="hd">
    <div class="hd-orn">序幕 · 认知改写</div>
    <div class="hd-t">江湾壹号 3601</div>
    <div class="hd-s">「她骂你一句，你就离改写她近一点」</div>
  </div>
  <div id="slot"></div>
</div>

<script>
(function(){
  var CDN = 'https://cdn.jsdelivr.net/gh/Tellccm/picx-images-hosting@master/moyue/';

  var 人物 = [
    {
      图: 'half-shenruowei.jpg',
      名: '沈若薇',
      身份: '三十四岁 · 住家保姆 · 你的母亲',
      说明: '清丽娇嫩如二十五六岁，却把这六年受的所有窝囊气全撒在你身上。在周岚面前，她被泼了茶也要鞠躬道歉、连声说「是我不好」；一转身回到后厨，摔盘、呵斥、剩饭打发，眼神像在看一件用坏了又不舍得扔的旧物。她对外人越卑微，回头对你越凶——这一点她自己心里清楚。'
    },
    {
      图: 'half-zhoulan.jpg',
      名: '周岚',
      身份: '三十四岁 · 周家千金 · 这栋房子的主人',
      说明: '深栗色高马尾，凤眼上挑，十公分细高跟走路没有声音。她不是恨你，她是当你不存在——使唤你的时候眼睛还留在酒杯上。踩头、泼茶、命你跪着擦她的鞋底，只是她一天里最轻的一项消遣。她三年没有过男人，这具看着矜贵的身躯，比她那张刻薄的嘴脆得多。'
    },
    {

      身份: '三十二岁 · 对门太太 · 独守空房',
      说明: '弱不禁风、轻声细语，左眼角一颗浅浅的泪痣。她是三个人里最「软」的一个，也是最坏的一个：真丝睡裙半褪着贴上来蹭，等你绷紧了、起了反应，就掩唇笑你「下人家的小杂种也配」，然后当着你的面摔门。丈夫一年回来两次，剩下三百多天，她有的是时间玩你。'
    }
  ];

  var 开局 = [
    {
      swipe: 1, k: '1', 序号: '其一',
      标题: '守着剩饭的那间后厨',
      一句话: '暴雨傍晚六点四十，你淋着雨从后门溜进厨房。她刚伺候完两位主人用膳，把一碟剩菜摔在中岛台上：「吃你的。吃完把两层楼的地全擦一遍。」',

    {
      swipe: 2, k: '2', 序号: '其二',
      标题: '那杯泼在地毯上的茶',
      一句话: '周末午后，你端着沏好的红茶躬身放下。她抿了一口就扬手连杯带水泼在你的鞋上，再把十公分的细高跟架上了你的膝盖：「跪下，用你的袖子擦干净。」',
      立绘: 'start-1-zhoulan.jpg',
      半身: 'half-zhoulan.jpg',
      看: { 时段: '下午', 辱: 40, 沈: [50, 42, 3], 周: [45, 40, 0], 温: [35, 52, 0] },
    },
    {
      swipe: 3, k: '3', 序号: '其三',
      标题: '门缝里的那点春光',
      一句话: '周六下午，她借口暖风机螺丝拧不动把你叫进套房。你踩着梯子仰头，她就贴着你的后背呵气如兰；察觉你绷紧了，又退开两步笑出声：「滚回你的保姆间洗把冷水脸。」',
      立绘: 'start-2-wenyining.jpg',
      半身: 'half-wenyining.jpg',
      看: { 时段: '下午', 辱: 45, 沈: [48, 44, 3], 周: [40, 38, 0], 温: [30, 58, 0] },
    }
  ];

  function topWin(){ try { if(window.top && window.top !== window) return window.top; }catch(e){} return window; }
  function TH(){
    var t = topWin();
    try { if(t && t.TavernHelper) return t.TavernHelper; }catch(e){}
    try { if(window.TavernHelper) return window.TavernHelper; }catch(e){}
    return null;
  }
  function call(n){
    var h = TH();
    if(h && typeof h[n] === 'function') return h[n].bind(h);
    var t = topWin();
    if(t && typeof t[n] === 'function') return t[n].bind(t);
    if(typeof window[n] === 'function') return window[n].bind(window);
    return null;
  }
  function 就绪(){ var t = topWin(); return !!(TH() || (t && t.SillyTavern)); }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // 这一页是运行时抓来的，酒馆的宏替换发生在消息文本阶段、作用不到它：
  // 所以自己问一次当前的 {{user}} 称呼，问不到就退回「你」。
  function 取用户名(){
    var M = '{' + '{user}}';
    try{
      var h = TH();
      if(h && typeof h.substitudeMacros === 'function'){
        var s1 = String(h.substitudeMacros(M) || '').trim();
        if(s1 && s1.indexOf('{') < 0) return s1;
      }
    }catch(e){}
    try{
      var t = topWin();
      if(t && typeof t.substituteParams === 'function'){
        var s2 = String(t.substituteParams(M) || '').trim();
        if(s2 && s2.indexOf('{') < 0) return s2;
      }
    }catch(e){}
    return '你';
  }
  function 修宏(){
    try{
      var M = '{' + '{user}}', 名 = 取用户名();
      if(!名) return;
      var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null), t;
      while((t = w.nextNode())){
        var v = t.nodeValue;
        if(!v || v.indexOf(M) < 0) continue;
        t.nodeValue = v.split(M).join(名);
      }
    }catch(e){}
  }

  function 画(){
    var slot = document.getElementById('slot');
    if(!slot) return;

    var 人 = 人物.map(function(p){
      return '<div class="who">'
        + '<div class="who-img-wrap"><img src="' + CDN + p.图 + '" alt="' + esc(p.名) + '"></div>'
        + '<div class="who-info">'
        + '<div class="who-top"><span class="who-n">' + esc(p.名) + '</span><span class="who-m">' + esc(p.身份) + '</span></div>'
        + '<div class="who-d">' + esc(p.说明) + '</div>'
        + '</div></div>';
    }).join('');

    function 人段(色, 图, 谁, 羞, 欲, 溺){
      return '<span class="pp" style="color:' + 色 + '">'
        + '<img src="' + CDN + 图 + '" alt="">'
        + '<span class="ppn">' + esc(谁) + '</span>'
        + '<span class="ppv">' + 羞 + '</span>'
        + '<span class="ppv">' + 欲 + '</span>'
        + '<span class="ppv">' + 溺 + '</span>'
        + '</span>';
    }

    var 卡 = 开局.map(function(o){
      var 看 = o.看;
      return '<button type="button" class="cd" data-k="' + o.k + '" data-swipe="' + o.swipe + '">'
        + '<span class="art">'
        + '<img class="main" src="' + CDN + o.立绘 + '" alt="' + esc(o.标题) + '">'
        + '<img class="face" src="' + CDN + o.半身 + '" alt="">'
        + '<span class="idx-badge">' + esc(o.序号) + '</span>'
        + '</span>'
        + '<span class="cap">'
        + '<span class="cap-t">' + esc(o.标题) + '</span>'
        + '<span class="cap-d">' + esc(o.一句话) + '</span>'
        + '<span class="reads">'
        + '<span class="chip-time">' + esc(看.时段) + '</span>'
        + '<span class="chip-shame">初始羞辱值 ' + 看.辱 + '</span>'
        + '</span>'
        + '<span class="rlabel">此局开场 · 羞耻 / 欲望 / 沉溺</span>'
        + '<span class="reads stack">'
        + '<span class="rhead"><i>羞</i><i>欲</i><i>溺</i></span>'
        + 人段('#e07a82', 'half-shenruowei.jpg', '沈若薇', 看.沈[0], 看.沈[1], 看.沈[2])
        + 人段('#82a8d8', 'half-zhoulan.jpg', '周岚', 看.周[0], 看.周[1], 看.周[2])
        + 人段('#6eb79c', 'half-wenyining.jpg', '温以宁', 看.温[0], 看.温[1], 看.温[2])
        + '</span>'
        + '</span></button>';
    }).join('');

    slot.innerHTML =
      '<div class="bd">'
      + '<div class="blk"><div class="blk-h"><i></i>你是谁</div>'
      + '<div class="prose-card">你是 <b>{{user}}</b>，初中生。从小学起就跟着母亲沈若薇住进江湾壹号 3601——楼梯下方那个不到 8 平米、终年不见光的保姆杂物间。'
      + '这栋房子有八间房，没有一间是你的。你在这里学会了不出声。<b>直到某一天你发现：那些挨过的骂、被踩过的头、被撩起来又丢下的每一次，都在你身上攒成了某种可以积起来的东西。</b></div></div>'
      + '<div class="blk"><div class="blk-h"><i></i>这栋房子里的三个人</div><div class="cast">' + 人 + '</div></div>'
      + '<div class="blk"><div class="blk-h"><i></i>常识修改器 · 她骂你一句，你就离改写她近一点</div>'
      + '<div class="sys-card">'
      + '<div class="sys-i"><b>受辱充能</b><p>母亲摔来的剩饭、周岚踩在你膝上的细高跟、温以宁撩完又摔上的那扇门——每一次都记进 <em>羞辱值 0~100</em>。</p></div>'
      + '<div class="sys-i"><b>满百解锁</b><p>羞辱值满 100 自动转为 <em>1 次注入机会</em>，可以累加储存。未满时按钮是灰的。</p></div>'
      + '<div class="sys-i"><b>单体注入</b><p>一次只能选<em>一个人</em>，写下<em>一条</em>常识。写下去的那一刻，那句话对她就是天经地义。</p></div>'
      + '<div class="sys-i"><b>随时开关</b><p>写进去的每一条都能随时停用、再随时打开。<em>关掉的那一秒，她会当场明白自己刚才在做什么。</em></p></div>'
      + '<div class="sys-i"><b>口吻不变</b><p>常识只改认知，不改脾气。她<em>照旧骂、照旧不耐烦</em>，只是身体会理所当然地照做——这才是最刺人的地方。</p></div>'
      + '<div class="sys-i"><b>旁观者自洽</b><p>别人看到会被自动合理化，当成「她家的规矩」。所以你可以<em>当着另一个人的面</em>用她。</p></div>'
      + '<div class="sys-warn"><b>但有一道铁律：</b>合理化只作用于「别人」，不作用于「自己」。<em>没被写入的人，绝不会跟着做。</em>你让周岚也来试试，她只会用最刻薄的话把你按回地上——想拿下她，得再攒一百分。</div>'
      + '</div></div>'
      + '</div>'
      + '<div class="pick"><div class="blk-h"><i></i>从哪一步开始挨</div>'
      + '<div class="row">' + 卡 + '</div></div>'
      + '<div class="ft"><span class="ft-n">点击一张卡片，那一局就会成为你的第 1 楼。</span><span class="bar"><i></i></span></div>';

    var 钮 = slot.querySelectorAll('.cd');
    for(var i = 0; i < 钮.length; i++){
      钮[i].addEventListener('click', function(){ 选(Number(this.getAttribute('data-swipe')), this); });
    }

    修宏();
  }

  function 选(swipe, 钮){
    if(!(swipe >= 1) || (钮 && 钮.classList.contains('on'))) return;
    var 条 = 开局.filter(function(o){ return o.swipe === swipe; })[0];
    if(!条) return;

    var 注 = document.querySelector('.ft-n');
    var 进 = document.querySelector('.bar > i');
    if(注) 注.textContent = '正在翻开「' + 条.标题 + '」……';
    if(进) 进.style.width = '65%';

    切开局(swipe).then(function(){
      var 全 = document.querySelectorAll('.cd');
      for(var i = 0; i < 全.length; i++) 全[i].classList.remove('on');
      if(钮) 钮.classList.add('on');
      if(进) 进.style.width = '100%';
      if(注) 注.textContent = '已成功翻至「' + 条.标题 + '」。';
    }, function(错){
      var 全 = document.querySelectorAll('.cd');
      for(var i = 0; i < 全.length; i++) 全[i].classList.remove('on');
      if(钮) 钮.classList.add('on');
      if(进) 进.style.width = '100%';
      if(注) 注.textContent = '已选定「' + 条.标题 + '」（若在酒馆中亦可左右滑动第1楼消息切换）。';
      try { console.warn('[开局前端] 切换反馈:', 错); }catch(e){}
    });
  }

  function 切开局(swipe){
    // 首选：TavernHelper 官方写法 setChatMessage(文本, 楼层, {swipe_id, refresh})
    var 单设 = call('setChatMessage'), 取 = call('getChatMessages');
    if(单设){
      try{
        var 流;
        if(取){
          流 = Promise.resolve(取('0', { include_swipes: true })).then(function(ms){
            var m = ms && ms[0];
            if(!m || !Array.isArray(m.swipes) || m.swipes[swipe] == null) throw new Error('所选开场不存在');
            return 单设(String(m.swipes[swipe]), 0, { swipe_id: swipe, refresh: 'display_and_render_current' });
          });
        } else {
          流 = Promise.resolve(单设(null, 0, { swipe_id: swipe, refresh: 'display_and_render_current' }));
        }
        return Promise.resolve(流);
      }catch(e){}
    }

    // 次选：批量接口
    var 多设 = call('setChatMessages');
    if(多设){
      try { return Promise.resolve(多设([{message_id:0, swipe_id:swipe}], {refresh:'affected'})); }catch(e){}
    }

    // 兜底：直接改聊天数据结构再重载
    try {
      var st = topWin().SillyTavern, chat = st && st.chat;
      if(chat && chat[0]){
        chat[0].swipe_id = swipe;
        var 尾 = chat[chat.length - 1];
        if(尾 && Array.isArray(尾.swipes) && 尾.swipes[swipe] != null) 尾.mes = 尾.swipes[swipe];
        var 载 = call('reloadCurrentChat') || call('reloadChat');
        if(载) 载();
        return Promise.resolve();
      }
    }catch(e){}

    return Promise.reject(new Error('当前预览环境'));
  }

  function boot(){
    if(就绪()){ 画(); return; }
    var n = 0, t = setInterval(function(){
      n++;
      if(就绪() || n > 25){ clearInterval(t); 画(); }
    }, 200);
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
