<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>开局 · 母上大人想要催眠我</title>
<style>
  :root{
    --ink:#0d0a09;
    --ink2:#171210;
    --line:rgba(214,190,158,.16);
    --line2:rgba(214,190,158,.30);
    --gold:#d8bd92;
    --gold2:#b5915f;
    --paper:#efe6da;
    --text:#e7ddd1;
    --dim:#a99c8c;
    --dim2:#7d7266;
    --rose:#c98a8a;
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC",Georgia,serif;
    --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:var(--sans);
    color:var(--text);
    padding:12px;
    -webkit-font-smoothing:antialiased;
  }
  #mo{
    max-width:900px;margin:0 auto;
    border-radius:16px;overflow:hidden;
    background:
      radial-gradient(700px 300px at 90% -10%, rgba(216,189,146,.10), transparent 62%),
      radial-gradient(560px 280px at 0% 106%, rgba(201,138,138,.09), transparent 60%),
      linear-gradient(172deg,#1a1411,#0d0a09 74%);
    border:1px solid var(--line);
    box-shadow:0 22px 60px rgba(0,0,0,.6);
  }

  /* ---- 题头 ---- */
  .hd{
    padding:30px 26px 24px;text-align:center;
    border-bottom:1px solid var(--line);
  }
  .hd-orn{
    display:flex;align-items:center;justify-content:center;gap:14px;
    color:var(--gold2);font-size:14px;letter-spacing:.5em;
  }
  .hd-orn::before,.hd-orn::after{
    content:"";height:1px;width:64px;
    background:linear-gradient(90deg,transparent,var(--line2));
  }
  .hd-orn::after{background:linear-gradient(90deg,var(--line2),transparent);}
  .hd-t{
    margin:15px 0 10px;
    font-family:var(--serif);
    font-size:38px;letter-spacing:.14em;color:var(--paper);
    font-weight:500;
  }
  .hd-s{font-size:15px;letter-spacing:.26em;color:var(--dim2);}

  /* ---- 正文块 ---- */
  .bd{padding:28px 26px 6px;}
  .blk{margin-bottom:28px;}
  .blk-h{
    display:flex;align-items:center;gap:11px;margin-bottom:15px;
    font-size:15px;letter-spacing:.24em;color:var(--gold);
  }
  .blk-h i{
    width:6px;height:6px;border-radius:50%;background:var(--gold2);
    box-shadow:0 0 8px rgba(216,189,146,.6);flex:0 0 auto;
  }
  .prose{font-size:16px;line-height:2.05;color:#cfc4b6;}
  .prose b{color:var(--paper);font-weight:600;}
  .prose .q{color:var(--gold);}

  /* ---- 人物 ---- */
  .cast{display:grid;gap:14px;}
  .who{
    display:grid;grid-template-columns:112px 1fr;gap:18px;
    padding:15px;border:1px solid var(--line);border-radius:13px;
    background:rgba(255,255,255,.022);
  }
  .who img{
    width:112px;height:160px;object-fit:cover;border-radius:9px;display:block;
    filter:saturate(.94) contrast(1.02);
  }
  .who-n{
    font-family:var(--serif);font-size:21px;letter-spacing:.08em;color:var(--paper);
    margin-bottom:4px;
  }
  .who-m{font-size:13.5px;letter-spacing:.06em;color:var(--gold2);margin-bottom:10px;}
  .who-d{font-size:15px;line-height:1.95;color:#bdb1a2;}

  .rule{
    padding:18px 20px;border-radius:13px;
    border:1px solid var(--line);
    border-left:2px solid var(--gold2);
    background:linear-gradient(180deg,rgba(216,189,146,.05),rgba(255,255,255,.015));
    font-size:15.5px;line-height:2;color:#c6bbac;
  }
  .rule b{color:var(--paper);font-weight:600;}

  /* ---- 开局 ---- */
  .pick{padding:2px 26px 4px;}
  .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
  .cd{
    position:relative;padding:0;overflow:hidden;cursor:pointer;
    border:1px solid var(--line);border-radius:14px;
    background:#120e0d;color:inherit;font-family:inherit;text-align:left;
    transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
  }
  .cd:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.5);}
  .cd.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(216,189,146,.35),0 12px 30px rgba(0,0,0,.52);}
  .cd.busy{opacity:.72;cursor:default;}

  .art{position:relative;aspect-ratio:2/3;overflow:hidden;background:#0b0808;}
  .art>img.main{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .5s ease;
  }
  .cd:hover .art>img.main{transform:scale(1.035);}
  .veil{
    position:absolute;inset:auto 0 0 0;height:58%;
    background:linear-gradient(180deg,transparent,rgba(13,10,9,.55) 46%,rgba(13,10,9,.95));
  }
  .face{
    position:absolute;left:12px;bottom:12px;
    width:60px;height:60px;border-radius:50%;object-fit:cover;display:block;
    border:1.5px solid rgba(216,189,146,.75);
    box-shadow:0 4px 12px rgba(0,0,0,.6);
  }
  .idx{
    position:absolute;top:9px;right:9px;
    padding:3px 12px;border-radius:999px;
    font-size:12px;letter-spacing:.16em;color:var(--paper);
    background:rgba(13,10,9,.72);border:1px solid var(--line2);
    backdrop-filter:blur(2px);
  }
  .cap{display:block;padding:15px 16px 17px;}
  .cap-t{display:block;font-family:var(--serif);font-size:18px;letter-spacing:.05em;color:var(--paper);margin-bottom:8px;}
  .cap-d{display:block;font-size:14px;line-height:1.8;color:var(--dim);}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;}
  .chip{
    padding:3px 11px;border-radius:999px;font-size:12.5px;letter-spacing:.04em;
    color:var(--gold);background:rgba(216,189,146,.09);border:1px solid var(--line);
  }

  /* ---- 页脚 ---- */
  .ft{
    display:flex;align-items:center;gap:12px;
    padding:18px 26px 22px;
    border-top:1px solid var(--line);
    margin-top:16px;
  }
  .ft-n{font-size:14px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .55s ease;}

  .load{padding:36px 20px;text-align:center;font-size:15px;color:var(--dim2);line-height:2;}

  @media (max-width:600px){
    body{padding:8px;}
    .hd{padding:22px 16px 18px;}
    .hd-t{font-size:28px;}
    .hd-s{font-size:13px;}
    .bd,.pick{padding-left:16px;padding-right:16px;}
    .ft{padding-left:16px;padding-right:16px;}
    .row{grid-template-columns:1fr;}
    .art{aspect-ratio:16/11;}
    .who{grid-template-columns:92px 1fr;gap:14px;}
    .who img{width:92px;height:132px;}
    .prose{font-size:15px;}
    .who-d{font-size:14px;}
    .cap-d{font-size:13.5px;}
  }
</style>
</head>
<body>
<div id="mo">
  <div class="hd">
    <div class="hd-orn">开局</div>
    <div class="hd-t">母上大人想要催眠我</div>
    <div class="hd-s">从哪一声敲门开始</div>
  </div>
  <div id="slot"><div class="load">正在翻开这一局……</div></div>
</div>

<script>
/* ============================================================================
 * 《母上大人想要催眠我》开局前端
 * 跑在消息楼层的 iframe 里，一切从 window.top 取，取不到再退回本窗口。
 *   读变量 TavernHelper.getVariables({type:'message',message_id:0})
 *   写变量 TavernHelper.replaceVariables(..., {type:'message',message_id:0})
 *   切开局 setChatMessages([{message_id:0, swipe_id:N}])
 * 六张图与本页同仓库，走 jsDelivr。
 * ==========================================================================*/
(function () {
  'use strict';

  var CDN = 'https://cdn.jsdelivr.net/gh/Tellccm/picx-images-hosting@master/moyue/';

  var 枕语 = [
    { 序号: 1, 第几天: 1, 身份: '已写', 内容: '今晚不要关门睡', 来源: '昨夜第一次动手，门确实没反锁' }
  ];

  var 开局 = [
    {
      swipe: 1,
      序号: '其一',
      标题: '守着开门声的那锅汤',
      一句话: '周五傍晚六点四十。她一个人在家，手机扣在灶台上，屏幕朝上——里面那句「来妈房间坐一会儿」打了又删，到这时还是一片空白。',
      立绘: 'start-0-shenruowei.jpg',
      半身: 'half-shenruowei.jpg',
      时段: '傍晚',
      羞耻: 70, 欲望: 62
    },
    {
      swipe: 2,
      序号: '其二',
      标题: '淋着雨闯进来的那个人',
      一句话: '雨夜九点半后。玄关的顶灯坏了一只，她湿着半边肩站在门口——而「若薇」正在浴室里，走廊上只剩你和这个她看大的孩子。',
      立绘: 'start-1-zhoulan.jpg',
      半身: 'half-zhoulan.jpg',
      时段: '夜晚',
      羞耻: 55, 欲望: 58
    },
    {
      swipe: 3,
      序号: '其三',
      标题: '敲错门的那个人',
      一句话: '周六下午两点半。沈若薇出门买菜了，门口站着对门的邻居——她说她家阳台的水龙头滑了丝，她只是想借一圈生料带。',
      立绘: 'start-2-wenyining.jpg',
      半身: 'half-wenyining.jpg',
      时段: '下午',
      羞耻: 60, 欲望: 50
    }
  ];

  var 人物 = [
    {
      图: 'half-shenruowei.jpg',
      名: '沈若薇',
      身份: '三十四岁 · 你的母亲 · 六年前守寡',
      说明: '墨黑的长直发垂到腰际，冷白得像能透光。说话轻软，句子短，想要什么的时候只说半句，等你来接。她手里那件能随意摆弄心智的东西，是她自己捡来的——而她的骨子里，是个胆小、守着妇道的传统女人。'
    },
    {
      图: 'half-zhoulan.jpg',
      名: '周岚',
      身份: '三十四岁 · 「岚亭」的老板 · 她十年的朋友',
      说明: '深栗色的长发梳成一条一丝不乱的高马尾，眼形细长、眼尾微挑，看人时眼皮半垂着。祖上留下三间铺面，她把一间改成只做熟客的美容会所，不缺钱，开店是为了有个地方待着。她看不上的人连损都不损；肯损你，说明你还够格。'
    },
    {
      图: 'half-wenyining.jpg',
      名: '温以宁',
      身份: '三十二岁 · 对门邻居 · 丈夫一年回来两次',
      说明: '淡杏色的棉麻长裙，深棕的低马尾用一只玳瑁抓夹松松挽着，薄得透光的冷白。见面只会笑着问一句「放学啦」，然后就没有别的话了。她这辈子都在等别人替她做决定；别人真做了，她会带着近乎自毁的感激顺从到底。'
    }
  ];

  /* ---------------- 取数层 ---------------- */
  function topWin(){ try{ if(window.top&&window.top!==window) return window.top; }catch(e){} return window; }
  function TH(){
    var t=topWin();
    try{ if(t&&t.TavernHelper) return t.TavernHelper; }catch(e){}
    try{ if(window.TavernHelper) return window.TavernHelper; }catch(e){}
    return null;
  }
  function call(n){
    var h=TH();
    if(h&&typeof h[n]==='function') return h[n].bind(h);
    var t=topWin();
    if(t&&typeof t[n]==='function') return t[n].bind(t);
    if(typeof window[n]==='function') return window[n].bind(window);
    return null;
  }
  function 就绪(){ var t=topWin(); return !!(TH()||(t&&t.SillyTavern)); }

  function esc(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function 画(){
    var slot=document.getElementById('slot');
    if(!slot) return;

    var 人 = 人物.map(function(p){
      return '<div class="who">'
        + '<img src="'+CDN+p.图+'" alt="">'
        + '<div>'
        + '<div class="who-n">'+esc(p.名)+'</div>'
        + '<div class="who-m">'+esc(p.身份)+'</div>'
        + '<div class="who-d">'+esc(p.说明)+'</div>'
        + '</div></div>';
    }).join('');

    var 卡 = 开局.map(function(o){
      return '<button type="button" class="cd" data-swipe="'+o.swipe+'">'
        + '<span class="art">'
        + '<img class="main" src="'+CDN+o.立绘+'" alt="">'
        + '<span class="veil"></span>'
        + '<img class="face" src="'+CDN+o.半身+'" alt="">'
        + '<span class="idx">'+esc(o.序号)+'</span>'
        + '</span>'
        + '<span class="cap">'
        + '<span class="cap-t">'+esc(o.标题)+'</span>'
        + '<span class="cap-d">'+esc(o.一句话)+'</span>'
        + '<span class="chips"><span class="chip">'+esc(o.时段)+'</span>'
        + '<span class="chip">羞耻 '+o.羞耻+'</span><span class="chip">欲望 '+o.欲望+'</span></span>'
        + '</span></button>';
    }).join('');

    slot.innerHTML =
      '<div class="bd">'
      + '<div class="blk"><div class="blk-h"><i></i>你是谁</div>'
      + '<div class="prose">你是<b>{{user}}</b>，初中生。母亲沈若薇三十四岁，六年前守寡，独自把你从八岁拉扯到十四岁。'
      + '她端庄、温顺、要强，把家里打理得没有一处可挑剔——直到三天前，一部没有图标、没有名字的手机软件住进了她的屏幕里。'
      + '它叫<b>「枕语」</b>。</div></div>'

      + '<div class="blk"><div class="blk-h"><i></i>这个家里的人</div><div class="cast">'+人+'</div></div>'

      + '<div class="blk"><div class="blk-h"><i></i>「枕语」</div>'
      + '<div class="rule">没有等级、没有额度、没有冷却——<b>她什么时候想写就什么时候写</b>。'
      + '写下的那句会在你身上生效：不是提线木偶式的操控，而是你会自己给这件事补一个天衣无缝的理由。'
      + '她手机里那份记录也摊在你眼前：她此刻想写的那句、今夜已经生效的那句、你开口要过而她还没答应的那句。</div></div>'
      + '</div>'

      + '<div class="pick"><div class="blk-h" style="margin-left:0"><i></i>从哪一声敲门开始</div>'
      + '<div class="row">'+卡+'</div></div>'

      + '<div class="ft"><span class="ft-n">选一张，这一局就从那里走。</span><span class="bar"><i></i></span></div>';

    var 钮 = slot.querySelectorAll('.cd');
    for(var i=0;i<钮.length;i++){
      钮[i].addEventListener('click', function(){ 选(Number(this.getAttribute('data-swipe')), this); });
    }
  }

  function 选(swipe, 钮){
    if(!(swipe>=1)||(钮&&钮.classList.contains('on'))) return;
    var 条 = 开局.filter(function(o){return o.swipe===swipe;})[0];
    if(!条) return;

    var 注 = document.querySelector('.ft-n');
    var 进 = document.querySelector('.bar > i');
    if(注) 注.textContent = '正在翻开「'+条.标题+'」……';
    if(进) 进.style.width = '55%';

    切开局(swipe);
    写变量(条);

    var 全 = document.querySelectorAll('.cd');
    for(var i=0;i<全.length;i++){ 全[i].classList.remove('on'); 全[i].classList.remove('busy'); }
    if(钮){ 钮.classList.add('on'); }

    if(进) 进.style.width = '100%';
    if(注) 注.textContent = '已从「'+条.标题+'」开始。';
  }

  function 切开局(swipe){
    var 设 = call('setChatMessages');
    if(设){
      try{ 设([{message_id:0, swipe_id:swipe}], {refresh:'affected'}); return; }catch(e){}
    }
    try{
      var st = topWin().SillyTavern, chat = st && st.chat;
      if(chat && chat[0]){
        chat[0].swipe_id = swipe;
        var 尾 = chat[chat.length-1];
        if(尾 && Array.isArray(尾.swipes) && 尾.swipes[swipe]!=null) 尾.mes = 尾.swipes[swipe];
        var 载 = call('reloadCurrentChat') || call('reloadChat');
        if(载) 载();
      }
    }catch(e){}
  }

  function 写变量(条){
    var 写 = call('replaceVariables');
    if(!写) return;
    var 值 = {
      催眠: {
        深度: 1,
        枕语: 枕语.concat([{ 序号: 2, 第几天: 1, 身份: '草稿', 内容: '来妈房间坐一会儿', 来源: '白天反复打字又删掉，一直没写下去' }]),
        玩家指令: '',
        允许越权: false,
        越界记录: { 房门不落锁: { 次数: 1, 最近: '昨晚第一次生效' } }
      },
      沈若薇: { 阶段: '阶段1·温情日常', 羞耻: 条.羞耻, 欲望: 条.欲望, 沉溺: 5 },
      人物: { 周岚: { 沉溺: 0 }, 温以宁: { 沉溺: 0 } },
      时间: { 第几天: 1, 时段: 条.时段 }
    };
    var 读 = call('getVariables'), 当前 = {};
    try{ if(读) 当前 = 读({type:'message', message_id:0}) || {}; }catch(e){}
    当前.stat_data = 值;
    try{ 写(当前, {type:'message', message_id:0}); }
    catch(e){ try{ 写({stat_data:值}, {type:'message', message_id:0}); }catch(e2){} }
  }

  function boot(){
    if(就绪()){ 画(); return; }
    var n=0, t=setInterval(function(){
      n++;
      if(就绪()||n>40){ clearInterval(t); 画(); }
    }, 250);
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
