<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>开局 · 妈只是在疼你</title>
  <style>
    :root {
      --bg-dark: #0d0a09;
      --bg-card: rgba(22, 17, 15, 0.78);
      --bg-card-hover: rgba(30, 23, 20, 0.92);
      --paper: #f5ece1;
      --paper-dim: #cfc1b0;
      --paper-muted: #8e8072;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-deep: #997a23;
      --crimson: #c94a53;
      --line: rgba(212, 175, 55, 0.16);
      --line-bright: rgba(212, 175, 55, 0.38);
      --glow-gold: rgba(212, 175, 55, 0.28);
      --serif: "Songti SC", "Source Han Serif SC", "Noto Serif SC", "SimSun", Georgia, serif;
      --sans: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --c-shen: #e07a82;
      --c-zhou: #82a8d8;
      --c-wen: #6eb79c;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: var(--sans);
      color: var(--paper);
      padding: 16px 12px;
      -webkit-font-smoothing: antialiased;
    }

    /* 进场光效与动画 */
    @keyframes moFadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes moAura { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
    @keyframes moShimmer { 0% { transform: translateX(-150%); } 100% { transform: translateX(150%); } }
    @keyframes moPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

    #mo {
      max-width: 1040px;
      margin: 0 auto;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(900px 380px at 85% -10%, rgba(212, 175, 55, 0.12), transparent 70%),
        radial-gradient(750px 360px at -10% 105%, rgba(201, 74, 83, 0.11), transparent 65%),
        radial-gradient(800px 500px at 50% 45%, rgba(255, 255, 255, 0.02), transparent 80%),
        linear-gradient(176deg, #181210 0%, #0d0a09 85%);
      border: 1px solid var(--line);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: moFadeIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* 题头装饰 */
    .hd {
      position: relative;
      padding: 38px 24px 28px;
      text-align: center;
      overflow: hidden;
    }
    .hd::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.45), transparent);
    }
    .hd-orn {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      letter-spacing: 0.45em;
      text-indent: 0.45em;
      color: var(--gold-primary);
      text-transform: uppercase;
      margin-bottom: 12px;
      animation: moAura 4.5s ease-in-out infinite;
    }
    .hd-orn::before, .hd-orn::after {
      content: "";
      height: 1px;
      width: 56px;
      background: linear-gradient(90deg, transparent, var(--gold-primary));
    }
    .hd-orn::after {
      background: linear-gradient(90deg, var(--gold-primary), transparent);
    }
    .hd-t {
      margin: 4px 0 10px;
      font-family: var(--serif);
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 0.16em;
      color: #fff8f0;
      text-shadow: 0 0 28px rgba(212, 175, 55, 0.22), 0 2px 4px rgba(0,0,0,0.6);
    }
    .hd-s {
      font-size: 15.5px;
      letter-spacing: 0.25em;
      color: var(--paper-muted);
      font-weight: 300;
    }

    /* 内容主体 */
    .bd { padding: 28px 28px 8px; }
    .blk { margin-bottom: 32px; }
    .blk-h {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 15.5px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--gold-light);
    }
    .blk-h::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.24), transparent);
    }
    .blk-h i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold-primary);
      box-shadow: 0 0 10px var(--gold-primary);
    }

    .prose-card {
      padding: 18px 22px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,255,255,0.032), rgba(255,255,255,0.008));
      border: 1px solid var(--line);
      font-size: 15.5px;
      line-height: 1.95;
      color: var(--paper-dim);
    }
    .prose-card b { color: #fff; font-weight: 600; }

    /* 人物列表 */
    .cast { display: grid; gap: 14px; }
    .who {
      position: relative;
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 20px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(30, 24, 21, 0.65), rgba(18, 14, 12, 0.85));
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .who:hover {
      border-color: var(--line-bright);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }
    .who-img-wrap {
      position: relative;
      width: 110px;
      height: 150px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .who-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }
    .who:hover .who-img-wrap img { transform: scale(1.04); }
    .who-info { min-width: 0; }
    .who-top {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .who-n {
      font-family: var(--serif);
      font-size: 22px;
      letter-spacing: 0.08em;
      color: #fff;
    }
    .who-m {
      font-size: 13.5px;
      letter-spacing: 0.04em;
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.12);
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid rgba(212, 175, 55, 0.25);
    }
    .who-d {
      font-size: 14.5px;
      line-height: 1.85;
      color: var(--paper-dim);
    }

    /* 规则叙事块 */
    .rule-card {
      position: relative;
      padding: 20px 22px;
      border-radius: 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--gold-primary);
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), rgba(255, 255, 255, 0.01));
      font-size: 15.5px;
      line-height: 2;
      color: var(--paper-dim);
    }
    .rule-card b { color: #fff; font-weight: 600; }

    /* 开局卡片网格 */
    .pick { padding: 4px 28px 10px; }
    .row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    .cd {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #14100e;
      color: inherit;
      font-family: inherit;
      text-align: left;
      transition: all 0.38s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cd::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 0; width: 50%;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,0.12), transparent);
      transform: translateX(-150%);
      pointer-events: none;
      z-index: 5;
    }
    .cd:hover::before { animation: moShimmer 1.1s ease; }
    .cd:hover {
      transform: translateY(-5px);
      border-color: var(--line-bright);
      box-shadow: 0 20px 42px rgba(0, 0, 0, 0.65);
    }

    .cd[data-k="1"] { --ac: var(--c-shen); }
    .cd[data-k="2"] { --ac: var(--c-zhou); }
    .cd[data-k="3"] { --ac: var(--c-wen); }

    .cd.on {
      border-color: var(--ac);
      box-shadow: 0 0 0 1px var(--ac), 0 0 35px -5px var(--ac), 0 20px 45px rgba(0,0,0,0.7);
    }

    .art {
      display: block;
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 145%;
      overflow: hidden;
      background: #090706;
    }
    .art > img.main {
      position: absolute;
      left: 0; top: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cd:hover .art > img.main { transform: scale(1.05); }
    .art::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 65%;
      background: linear-gradient(180deg, transparent, rgba(14, 11, 10, 0.6) 40%, rgba(14, 11, 10, 0.98));
      pointer-events: none;
    }
    .art::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(100% 80% at 20% 100%, var(--ac), transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 2;
    }
    .cd:hover .art::before { opacity: 0.22; }
    .cd.on .art::before { opacity: 0.35; }

    .face {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 4;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid var(--ac);
      box-shadow: 0 6px 18px rgba(0,0,0,0.75), 0 0 0 3px rgba(14, 11, 10, 0.6);
      transition: transform 0.35s ease;
    }
    .cd:hover .face { transform: scale(1.06); }

    .idx-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 4;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #fff;
      background: rgba(14, 11, 10, 0.78);
      border: 1px solid var(--line-bright);
      backdrop-filter: blur(8px);
    }

    .cap {
      display: block;
      padding: 16px 16px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .cap-t {
      display: block;
      font-family: var(--serif);
      font-size: 18.5px;
      letter-spacing: 0.05em;
      color: #fff;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .cap-d {
      display: block;
      font-size: 14px;
      line-height: 1.75;
      color: var(--paper-dim);
      margin-bottom: 14px;
    }

    .reads {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px 10px;
    }
    .chip-time {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.28);
    }
    .rhead {
      display: flex;
      gap: 6px;
      margin-left: auto;
      font-size: 10.5px;
      color: var(--paper-muted);
    }
    .rhead i { font-style: normal; width: 2.2em; text-align: center; }

    .pp {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pp img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid currentColor;
    }
    .pp .ppn { font-size: 12px; font-weight: 500; line-height: 1; }
    .pp .ppv {
      display: inline-block;
      width: 2.2em;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f7f0fc;
    }

    /* 底栏操作反馈 */
    .ft {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 28px 24px;
      margin-top: 14px;
      border-top: 1px solid var(--line);
    }
    .ft-n {
      font-size: 14.5px;
      color: var(--paper-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--gold-deep), var(--gold-primary), var(--gold-light));
      transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 移动端适配 */
    @media (max-width: 680px) {
      body { padding: 8px 6px; }
      .hd { padding: 26px 16px 20px; }
      .hd-t { font-size: 28px; }
      .hd-s { font-size: 13.5px; letter-spacing: 0.15em; }
      .bd, .pick, .ft { padding-left: 14px; padding-right: 14px; }
      .row { grid-template-columns: 1fr; gap: 14px; }
      .art { padding-top: 115%; }
      .who { grid-template-columns: 85px 1fr; gap: 14px; padding: 12px 14px; }
      .who-img-wrap { width: 85px; height: 115px; }
      .who-n { font-size: 19px; }
      .who-d { font-size: 13.5px; }
      .cap-t { font-size: 17.5px; }
      .cap-d { font-size: 13.5px; }
    }
  </style>
</head>
<body>
<div id="mo">
  <div class="hd">
    <div class="hd-orn">序幕 · 一声开门</div>
    <div class="hd-t">妈只是在疼你</div>
    <div class="hd-s">「门没锁……要是晚上心慌，就来妈房间坐坐」</div>
  </div>
  <div id="slot"></div>
</div>

<script>
(function(){
  var CDN = 'https://cdn.jsdelivr.net/gh/Tellccm/picx-images-hosting@master/moyue/';

  var 人物 = [
    {
      图: 'half-shenruowei.jpg',
      名: '沈若薇',
      身份: '三十四岁 · 人妻母亲 · 亡夫离世六年',
      说明: '清纯温婉、极度娇嫩的黑长直母亲。容貌清丽如二十五六岁，在外是体面持家的少妇，内里却饱受六年独居的空虚煎熬与对{{user}}的禁忌依恋。她把台阶一层层铺好，自己也在极度羞耻与步步逾矩中越陷越深。'
    },
    {
      图: 'half-zhoulan.jpg',
      名: '周岚',
      身份: '三十四岁 · 闺蜜 · 美容会所老板',
      说明: '离异三年，深栗色高马尾，眼神细长微挑。嘴硬心软、独立傲慢，开着只做熟客的高级美容会所。把沈家当成唯一不用端着的避风港；她三年没有过男人，这具矜贵身躯比那张刻薄的嘴脆弱得多。'
    },
    {
      图: 'half-wenyining.jpg',
      名: '温以宁',
      身份: '三十二岁 · 对门邻居 · 独守空房',
      说明: '温软如江南水乡，深棕低马尾系着玳瑁发夹，薄得透光的冷白雪肤。丈夫长年在海外工程，整座大房子里只有她一人。习惯了卑微讨好与顺从，一次误跌入少年怀抱，便贪恋上那点久违的男子体温。'
    }
  ];

  var 开局 = [
    {
      swipe: 1, k: '1', 序号: '其一',
      标题: '守着开门声的那锅汤',
      一句话: '周五傍晚六点四十，砂锅在灶台上煨着甜玉米排骨汤。她散下一头乌黑长发，手机扣在大理石台面上，光标还闪烁着半截草稿……',
      立绘: 'start-0-shenruowei.jpg',
      半身: 'half-shenruowei.jpg',
      看: { 时段: '傍晚', 沈: [40, 62, 5], 周: [25, 45, 0], 温: [45, 58, 0] },
    },
    {
      swipe: 2, k: '2', 序号: '其二',
      标题: '淋着雨闯进来的那个人',
      一句话: '暴雨夜九点半，周岚用备用钥匙推门而入，湿透的风衣滑落在沙发。沙发深处，沈若薇丢下的薄粉真丝睡裙与亮着的手机格外刺眼……',
      立绘: 'start-1-zhoulan.jpg',
      半身: 'half-zhoulan.jpg',
      看: { 时段: '夜里', 沈: [33, 52, 3], 周: [20, 50, 0], 温: [45, 58, 0] },
    },
    {
      swipe: 3, k: '3', 序号: '其三',
      标题: '敲错门的那个人',
      一句话: '周六午后，沈若薇出门买菜。对门的温以宁抱着沉重管钳借生料带，慌乱中在光洁瓷砖上失衡仰倒，结结实实跌进你的怀抱……',
      立绘: 'start-2-wenyining.jpg',
      半身: 'half-wenyining.jpg',
      看: { 时段: '下午', 沈: [26, 48, 3], 周: [25, 45, 0], 温: [44, 64, 0] },
    }
  ];

  function topWin(){ try { if(window.top && window.top !== window) return window.top; }catch(e){} return window; }
  function TH(){
    var t = topWin();
    try { if(t && t.TavernHelper) return t.TavernHelper; }catch(e){}
    try { if(window.TavernHelper) return window.TavernHelper; }catch(e){}
    return null;
  }
  function call(n){
    var h = TH();
    if(h && typeof h[n] === 'function') return h[n].bind(h);
    var t = topWin();
    if(t && typeof t[n] === 'function') return t[n].bind(t);
    if(typeof window[n] === 'function') return window[n].bind(window);
    return null;
  }
  function 就绪(){ var t = topWin(); return !!(TH() || (t && t.SillyTavern)); }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // 这一页是运行时抓来的，酒馆的宏替换发生在消息文本阶段、作用不到它：
  // 所以自己问一次当前的 {{user}} 称呼，问不到就退回「你」。
  function 取用户名(){
    var M = '{' + '{user}}';
    try{
      var h = TH();
      if(h && typeof h.substitudeMacros === 'function'){
        var s1 = String(h.substitudeMacros(M) || '').trim();
        if(s1 && s1.indexOf('{') < 0) return s1;
      }
    }catch(e){}
    try{
      var t = topWin();
      if(t && typeof t.substituteParams === 'function'){
        var s2 = String(t.substituteParams(M) || '').trim();
        if(s2 && s2.indexOf('{') < 0) return s2;
      }
    }catch(e){}
    return '你';
  }
  function 修宏(){
    try{
      var M = '{' + '{user}}', 名 = 取用户名();
      if(!名) return;
      var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null), t;
      while((t = w.nextNode())){
        var v = t.nodeValue;
        if(!v || v.indexOf(M) < 0) continue;
        t.nodeValue = v.split(M).join(名);
      }
    }catch(e){}
  }

  function 画(){
    var slot = document.getElementById('slot');
    if(!slot) return;

    var 人 = 人物.map(function(p){
      return '<div class="who">'
        + '<div class="who-img-wrap"><img src="' + CDN + p.图 + '" alt="' + esc(p.名) + '"></div>'
        + '<div class="who-info">'
        + '<div class="who-top"><span class="who-n">' + esc(p.名) + '</span><span class="who-m">' + esc(p.身份) + '</span></div>'
        + '<div class="who-d">' + esc(p.说明) + '</div>'
        + '</div></div>';
    }).join('');

    function 人段(色, 图, 谁, 羞, 欲){
      return '<span class="pp" style="color:' + 色 + '">'
        + '<img src="' + CDN + 图 + '" alt="">'
        + '<span class="ppn">' + esc(谁) + '</span>'
        + '<span class="ppv">' + 羞 + '</span>'
        + '<span class="ppv">' + 欲 + '</span>'
        + '</span>';
    }

    var 卡 = 开局.map(function(o){
      var 看 = o.看;
      return '<button type="button" class="cd" data-k="' + o.k + '" data-swipe="' + o.swipe + '">'
        + '<span class="art">'
        + '<img class="main" src="' + CDN + o.立绘 + '" alt="' + esc(o.标题) + '">'
        + '<img class="face" src="' + CDN + o.半身 + '" alt="">'
        + '<span class="idx-badge">' + esc(o.序号) + '</span>'
        + '</span>'
        + '<span class="cap">'
        + '<span class="cap-t">' + esc(o.标题) + '</span>'
        + '<span class="cap-d">' + esc(o.一句话) + '</span>'
        + '<span class="reads">'
        + '<span class="chip-time">' + esc(看.时段) + '</span>'
        + '<span class="rhead"><i>羞耻</i><i>欲望</i></span>'
        + 人段('#e07a82', 'half-shenruowei.jpg', '沈', 看.沈[0], 看.沈[1])
        + 人段('#82a8d8', 'half-zhoulan.jpg', '周', 看.周[0], 看.周[1])
        + 人段('#6eb79c', 'half-wenyining.jpg', '温', 看.温[0], 看.温[1])
        + '</span>'
        + '</span></button>';
    }).join('');

    slot.innerHTML =
      '<div class="bd">'
      + '<div class="blk"><div class="blk-h"><i></i>你是谁</div>'
      + '<div class="prose-card">你是 <b>{{user}}</b>，初中生。身量纤秀、五官清秀可爱。母亲沈若薇三十四岁，六年前守寡，独自把你抚养长大。'
      + '她端庄、温顺又极有分寸，把这个家照料得无微不至。可她那件在衣柜深处藏了整整一周的新睡衣，和这一周里年轻娇艳了许多的样子，正在夜深人静中悄然崩解所有伦常防线……</div></div>'
      + '<div class="blk"><div class="blk-h"><i></i>这个家里与身边的人</div><div class="cast">' + 人 + '</div></div>'
      + '<div class="blk"><div class="blk-h"><i></i>心境法则 · 一层层铺好的台阶</div>'
      + '<div class="rule-card">她记得你所有的琐碎喜好——怕烫、腰不好、不喜辛辣。<b>她比你自己更懂得如何让你心软</b>，'
      + '也清楚该在何时端来一碗热汤、递上一句欲言又止的关切。'
      + '她从不强加于你：她只是一层层把台阶铺好，铺到你抬脚就走得下去的地方——然后站在旁边，等你自己迈那一步。</div></div>'
      + '</div>'
      + '<div class="pick"><div class="blk-h"><i></i>从哪一声敲门开始</div>'
      + '<div class="row">' + 卡 + '</div></div>'
      + '<div class="ft"><span class="ft-n">点击一张卡片，便能从该视角展开故事。</span><span class="bar"><i></i></span></div>';

    var 钮 = slot.querySelectorAll('.cd');
    for(var i = 0; i < 钮.length; i++){
      钮[i].addEventListener('click', function(){ 选(Number(this.getAttribute('data-swipe')), this); });
    }

    修宏();
  }

  function 选(swipe, 钮){
    if(!(swipe >= 1) || (钮 && 钮.classList.contains('on'))) return;
    var 条 = 开局.filter(function(o){ return o.swipe === swipe; })[0];
    if(!条) return;

    var 注 = document.querySelector('.ft-n');
    var 进 = document.querySelector('.bar > i');
    if(注) 注.textContent = '正在翻开「' + 条.标题 + '」……';
    if(进) 进.style.width = '65%';

    切开局(swipe).then(function(){
      var 全 = document.querySelectorAll('.cd');
      for(var i = 0; i < 全.length; i++) 全[i].classList.remove('on');
      if(钮) 钮.classList.add('on');
      if(进) 进.style.width = '100%';
      if(注) 注.textContent = '已成功翻至「' + 条.标题 + '」。';
    }, function(错){
      var 全 = document.querySelectorAll('.cd');
      for(var i = 0; i < 全.length; i++) 全[i].classList.remove('on');
      if(钮) 钮.classList.add('on');
      if(进) 进.style.width = '100%';
      if(注) 注.textContent = '已选定「' + 条.标题 + '」（若在酒馆中亦可左右滑动第1楼消息切换）。';
      try { console.warn('[开局前端] 切换反馈:', 错); }catch(e){}
    });
  }

  function 切开局(swipe){
    var 设 = call('setChatMessages');
    if(设){
      try { return Promise.resolve(设([{message_id:0, swipe_id:swipe}], {refresh:'affected'})); }catch(e){}
    }
    try {
      var st = topWin().SillyTavern, chat = st && st.chat;
      if(chat && chat[0]){
        chat[0].swipe_id = swipe;
        var 尾 = chat[chat.length - 1];
        if(尾 && Array.isArray(尾.swipes) && 尾.swipes[swipe] != null) 尾.mes = 尾.swipes[swipe];
        var 载 = call('reloadCurrentChat') || call('reloadChat');
        if(载) 载();
        return Promise.resolve();
      }
    }catch(e){}
    return Promise.reject(new Error('当前预览环境'));
  }

  function boot(){
    if(就绪()){ 画(); return; }
    var n = 0, t = setInterval(function(){
      n++;
      if(就绪() || n > 25){ clearInterval(t); 画(); }
    }, 200);
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
