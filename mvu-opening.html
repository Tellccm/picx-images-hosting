<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>开局选择 · 黄游式流程（优化版）</title>
<style>
  :root{
    --bg1:#17110f; --bg2:#241813; --ink:#f3e9dc; --ink2:#cbb9a2; --ink3:#8f7a64;
    --accent:#e07a7f; --accent2:#d8b48a; --ok:#dcc08a; --no:#d09090; --line:rgba(255,255,255,.12);
    --serif:"Songti SC","STSong","SimSun",serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  html,body{ margin:0; padding:0; background:transparent; }
  body{ font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; }

  .wrap{ position:relative; width:100%; height:680px; max-width:940px; margin:0 auto;
    padding:22px 30px 20px; display:flex; flex-direction:column; overflow:hidden;
    background:
      radial-gradient(1200px 600px at 78% -8%, rgba(224,122,127,.18), transparent 60%),
      radial-gradient(900px 520px at 8% 110%, rgba(216,180,138,.12), transparent 55%),
      linear-gradient(160deg, var(--bg2), var(--bg1) 55%, #120d0b);
    border-radius:14px; box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 24px 60px -24px rgba(0,0,0,.7); }
  .wrap::after{ content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:44px 44px; }

  /* 顶部：印章 + 标题 + 步骤 */
  .topline{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .seal{ flex:none; width:34px; height:34px; background:linear-gradient(150deg,#c74452,#8f1f2d);
    color:#ffe9e2; font-family:var(--serif); font-size:15px; display:flex; align-items:center; justify-content:center;
    transform:rotate(-6deg); border-radius:4px; box-shadow:0 2px 10px rgba(143,31,45,.5), inset 0 0 0 1px rgba(255,255,255,.28);
    text-shadow:0 1px 2px rgba(0,0,0,.4); user-select:none; }
  .logo{ font-family:var(--serif); font-size:16px; letter-spacing:.3em; color:var(--ink);
    text-shadow:0 0 24px rgba(224,122,127,.35); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .logo b{ color:var(--accent); font-weight:700; }
  .steps{ margin-left:auto; display:flex; align-items:center; }
  .stepdot{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-family:var(--serif); color:var(--ink3); border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.02); transition:all .4s ease; }
  .stepdot.on{ color:#2a1c16; background:linear-gradient(180deg,#f2cdb0,#d8a07a); border-color:transparent;
    box-shadow:0 0 14px rgba(224,122,127,.5); }
  .stepdot.done{ color:var(--accent2); border-color:rgba(216,180,138,.55); }
  .stseg{ width:18px; height:1px; background:rgba(255,255,255,.18); margin:0 4px; }
  .stseg.done{ background:rgba(216,180,138,.6); }
  .topline::after{ content:""; position:absolute; left:0; right:0; top:46px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(216,180,138,.35), transparent); }
  .stcap{ margin-left:auto; font-size:9px; letter-spacing:.3em; color:var(--ink3); white-space:nowrap; }

  .screens{ position:relative; flex:1; margin-top:12px; }
  .scr{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    opacity:0; transform:translateY(26px) scale(.985); filter:blur(8px); pointer-events:none;
    transition:opacity .5s cubic-bezier(.2,.7,.2,1), transform .5s cubic-bezier(.2,.7,.2,1), filter .5s ease; }
  .scr.in{ opacity:1; transform:none; filter:none; pointer-events:auto; }
  .scr.back{ transform:translateY(-22px) scale(.985); }
  /* 入场错峰 */
  @keyframes vu{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:none;} }
  .scr.in>*{ animation:vu .55s cubic-bezier(.2,.7,.2,1) both; }
  .scr.in>*:nth-child(1){ animation-delay:.04s; } .scr.in>*:nth-child(2){ animation-delay:.10s; }
  .scr.in>*:nth-child(3){ animation-delay:.16s; } .scr.in>*:nth-child(4){ animation-delay:.22s; }
  .scr.in>*:nth-child(5){ animation-delay:.28s; } .scr.in>*:nth-child(6){ animation-delay:.34s; }
  .scr.in .pair>*{ animation:vu .5s cubic-bezier(.2,.7,.2,1) both; }
  .scr.in .pair>*:nth-child(1){ animation-delay:.14s; } .scr.in .pair>*:nth-child(2){ animation-delay:.22s; }
  .scr.in .chiprow>*{ animation:vu .4s ease both; }

  .big{ font-family:var(--serif); font-size:34px; letter-spacing:.3em; line-height:1.7; text-align:center;
    color:var(--ink); text-shadow:0 2px 30px rgba(0,0,0,.5); }
  .big small{ display:block; font-family:"PingFang SC",sans-serif; font-size:12px; letter-spacing:.6em;
    color:var(--accent2); margin-bottom:14px; }
  .big small::before, .big small::after{ content:"❖"; font-size:8px; margin:0 10px; color:rgba(216,180,138,.6); }
  .big .hl{ color:var(--accent); }
  .cta{ text-align:center; margin-top:32px; }
  .startbtn{ font-family:var(--serif); font-size:15px; letter-spacing:.5em; color:#2a1c16;
    background:linear-gradient(180deg,#f2cdb0,#d8a07a); border:1px solid rgba(255,255,255,.25);
    padding:13px 44px 13px 52px; border-radius:999px; cursor:pointer;
    box-shadow:0 10px 34px -10px rgba(224,122,127,.55), inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .25s ease, box-shadow .25s ease; }
  .startbtn:hover{ transform:translateY(-2px) scale(1.03); box-shadow:0 16px 44px -10px rgba(224,122,127,.7); }

  .h2{ font-family:var(--serif); font-size:19px; letter-spacing:.5em; color:var(--accent2); margin:0 0 20px; text-align:center; }
  .h2::before, .h2::after{ content:"❖"; font-size:9px; color:rgba(216,180,138,.55); margin:0 12px; vertical-align:2px; }

  .field{ margin:0 auto 16px; max-width:520px; }
  .field label{ display:block; font-size:9px; letter-spacing:.42em; color:var(--ink3); margin-bottom:6px; }
  .inp{ width:100%; background:transparent; border:none; border-bottom:1px solid rgba(255,255,255,.28);
    color:var(--ink); font-size:16px; padding:6px 4px; font-family:var(--serif); letter-spacing:.12em; outline:none; }
  .inp:focus{ border-color:var(--accent); box-shadow:0 6px 18px -12px rgba(224,122,127,.8); }
  .inp.ph{ color:var(--ink3); }

  .pair{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:0 auto; max-width:760px; }
  .girl{ position:relative; border:1px solid var(--line); border-radius:10px; padding:16px 16px 14px; cursor:pointer;
    background:linear-gradient(165deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    transition:all .35s ease; overflow:hidden; }
  .girl::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg,var(--accent),var(--accent2)); opacity:0; transition:opacity .3s; }
  .girl:hover{ transform:translateY(-4px); border-color:rgba(224,122,127,.5); }
  .girl.on{ border-color:var(--accent);
    background:linear-gradient(165deg, rgba(224,122,127,.14), rgba(255,255,255,.02));
    box-shadow:0 14px 40px -18px rgba(224,122,127,.6); }
  .girl.on::before{ opacity:1; }
  .girl .nm{ font-family:var(--serif); font-size:16px; letter-spacing:.16em; color:var(--ink); margin-bottom:8px; }
  .girl.on .nm{ color:var(--accent); }
  .girl .desc{ font-size:11px; line-height:1.85; color:var(--ink2); }
  .girl .tag{ display:inline-block; margin-top:9px; font-size:9px; letter-spacing:.3em; color:var(--accent2);
    border:1px solid rgba(216,180,138,.4); padding:2px 10px; border-radius:999px; }
  .sel-mark{ position:absolute; right:12px; top:10px; width:17px; height:17px; border-radius:50%;
    border:1px solid var(--line); color:transparent; font-size:10px; display:flex; align-items:center; justify-content:center;
    transition:all .3s; }
  .girl.on .sel-mark{ background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 12px rgba(224,122,127,.8); }

  .chiprow{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:6px 0 14px; }
  .chip{ cursor:pointer; border:1px solid var(--line); border-radius:999px; padding:6px 16px; font-size:12px;
    letter-spacing:.08em; color:var(--ink2); transition:all .25s ease; background:rgba(255,255,255,.02); }
  .chip:hover{ border-color:rgba(224,122,127,.6); }
  .chip.on{ color:#fff; border-color:var(--accent);
    background:linear-gradient(180deg, rgba(224,122,127,.35), rgba(224,122,127,.12));
    box-shadow:0 0 18px -4px rgba(224,122,127,.5); }
  .hintline{ text-align:center; font-size:10px; letter-spacing:.2em; color:var(--ink3); margin-bottom:6px; }

  /* 行为徽章板 */
  .stinfo{ max-width:600px; margin:0 auto 12px; border:1px solid var(--line); border-radius:12px;
    padding:10px 14px 11px; background:rgba(0,0,0,.18); }
  .si-row{ display:flex; align-items:flex-start; gap:10px; padding:3px 0; }
  .si-row + .si-row{ border-top:1px dashed rgba(255,255,255,.09); margin-top:4px; padding-top:7px; }
  .si-row .lab{ flex:none; width:52px; font-size:10px; letter-spacing:.34em; color:var(--ink3); padding-top:4px; }
  .si-row .bds{ display:flex; flex-wrap:wrap; gap:6px; }
  .bd{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:2px 10px; font-size:10.5px;
    letter-spacing:.05em; background:rgba(255,255,255,.03); border:1px solid var(--line); }
  .bd.ok{ color:var(--ok); border-color:rgba(220,192,138,.4); }
  .bd.no{ color:var(--no); border-color:rgba(208,144,144,.35); }
  .bd.none{ color:var(--ink3); }

  .scorebox{ max-width:560px; margin:0 auto 2px; }
  .scorehead{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .scorehead label{ font-size:9px; letter-spacing:.42em; color:var(--ink3); }
  .scorehead em{ font-style:normal; color:var(--accent2); font-weight:600; font-size:13px;
    font-family:var(--serif); letter-spacing:.08em; }
  .scorebox input[type=range]{ width:100%; accent-color:var(--accent); height:22px; cursor:pointer; }
  .scorecap{ text-align:center; font-size:9px; letter-spacing:.2em; color:var(--ink3); margin-top:2px; }
  .stagebar{ text-align:center; font-size:11px; letter-spacing:.06em; color:var(--accent2); margin-top:10px; min-height:16px; }

  /* 实时组合条 */
  .live{ display:flex; align-items:center; gap:10px; margin:10px 0 2px; padding:7px 14px;
    border:1px solid rgba(216,180,138,.28); border-radius:999px;
    background:linear-gradient(90deg, rgba(216,180,138,.10), transparent 60%);
    font-size:11.5px; color:var(--ink2); letter-spacing:.05em; }
  .live::before{ content:"◆"; color:var(--accent); font-size:9px; }
  .live b{ color:var(--accent2); font-weight:600; margin:0 3px; }

  /* 确认卡 */
  .sum{ max-width:560px; margin:0 auto; border:1px solid var(--line); border-radius:10px;
    background:rgba(0,0,0,.18); padding:16px 20px; font-size:13px; line-height:2.1; letter-spacing:.06em; }
  .sum .r{ display:flex; justify-content:space-between; gap:16px; border-bottom:1px dashed rgba(255,255,255,.12); }
  .sum .r:last-child{ border-bottom:none; }
  .sum .k{ color:var(--ink3); letter-spacing:.3em; font-size:11px; flex:none; }
  .sum b{ color:var(--ink); font-family:var(--serif); letter-spacing:.06em; text-align:right; }

  /* 底部导航 */
  .nav{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .navbtn{ font-family:var(--serif); letter-spacing:.3em; color:var(--ink2); background:none; border:none; cursor:pointer;
    font-size:13px; padding:8px 12px; border-radius:8px; transition:color .2s; }
  .navbtn:hover{ color:var(--accent); }
  .navbtn.next{ color:var(--accent2); font-size:14px; }
  .navbtn:disabled{ opacity:.25; pointer-events:none; }
  .navbtn::before{ content:"◀ "; font-size:11px; } .navbtn.next::before{ content:""; }
  .navbtn.next::after{ content:" ▶"; font-size:11px; }

  /* 提示/错误条（兜底 C12） */
  .note{ min-height:16px; margin-top:6px; text-align:center; font-size:10px; letter-spacing:.08em; color:var(--no); }
  .hidden{ display:none !important; }

  /* 二次确认浮层 */
  .ov{ position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:20px;
    background:rgba(10,6,5,.66); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .ov.open{ display:flex; }
  .ovbox{ width:min(560px,94vw); border:1px solid rgba(216,180,138,.4); border-radius:14px; padding:22px 24px;
    background:linear-gradient(165deg, #2a1f18, #1a120e); box-shadow:0 30px 80px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.4);
    animation:vu .35s ease both; }
  .ov h3{ font-family:var(--serif); letter-spacing:.4em; text-align:center; color:var(--accent2); margin:0 0 14px; font-size:16px; }
  .ov .sum{ font-size:12.5px; }
  .ov-actions{ display:flex; gap:10px; justify-content:center; margin-top:18px; }
  .ov .small{ font-size:10px; color:var(--ink3); letter-spacing:.06em; margin-top:14px; text-align:center; min-height:14px; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink2); }
  .btn-ghost:hover{ border-color:var(--ink3); color:var(--ink); }

  @media (max-width:760px){
    .wrap{ height:auto; overflow:visible; padding:16px 16px 18px; }
    body{ overflow:auto; }
    .screens{ position:relative; height:auto; }
    .scr{ position:relative; inset:auto; opacity:1; transform:none; filter:none; display:none; pointer-events:none; margin:4px 0; }
    .scr.in{ display:flex; pointer-events:auto; }
    .logo{ font-size:12px; letter-spacing:.16em; }
    .seal{ width:28px; height:28px; font-size:12px; }
    .stepdot{ width:18px; height:18px; font-size:9px; } .stseg{ width:8px; }
    .stcap{ display:none; }
    .big{ font-size:26px; }
    .pair{ grid-template-columns:1fr; max-width:520px; }
    .h2{ font-size:16px; }
    .field{ max-width:100%; }
    .scorebox,.stinfo,.sum{ max-width:100%; }
    .scr.in>*{ animation:none; }
  }
  @media (max-width:480px){
    .big{ font-size:20px; letter-spacing:.18em; }
    .startbtn{ padding:11px 26px; font-size:13px; }
    .chip{ padding:5px 11px; font-size:11px; }
    .logo b{ display:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <span class="seal">開</span>
    <div class="logo">什么？！又考好了？<b>天呐…又要做那种事了</b></div>
    <div class="steps" id="steps"></div>
    <div class="stcap" id="stcap"></div>
  </div>

  <div class="screens">
    <section class="scr in">
      <div class="big"><small>—— 開 局 選 択 ——</small>即将开始<br>一段<span class="hl"> 属于你们 </span>的故事</div>
      <div class="cta"><button class="startbtn" id="begin">开 始</button></div>
    </section>

    <section class="scr">
      <h2 class="h2">基 础 设 定</h2>
      <div class="field"><label>姓 名</label><input class="inp" id="f-name" placeholder="儿子的名字"></div>
      <div class="field"><label>年 龄</label><input class="inp" id="f-age" placeholder="如 17 岁"></div>
      <div class="field"><label>外 貌 · 性 格</label><input class="inp" id="f-look" placeholder="外貌特征、性格倾向…"></div>
    </section>

    <section class="scr">
      <h2 class="h2">母 亲 风 格</h2>
      <div class="pair" id="m-pair"></div>
    </section>

    <section class="scr">
      <h2 class="h2">角 色 与 阶 段</h2>
      <div class="hintline">加入角色（可都不选）</div>
      <div class="chiprow"><span class="chip" id="c-bro">弟弟</span><span class="chip" id="c-dad">爸爸</span></div>
      <div class="hintline">初始阶段 · 审核机制锁定成绩区间</div>
      <div class="chiprow" id="stage-chips"></div>
      <div class="stinfo" id="st-info"></div>
      <div class="scorebox">
        <div class="scorehead"><label>初始总成绩</label><em id="f-score-num">600 / 750</em></div>
        <input type="range" id="f-score" min="600" max="750" step="1" value="600">
        <div class="scorecap" id="f-score-cap"></div>
      </div>
    </section>

    <section class="scr">
      <h2 class="h2">确 认 开 局</h2>
      <div class="sum" id="sum"></div>
      <div class="cta"><button class="startbtn" id="go">进 入 本 开 局</button></div>
    </section>
  </div>

  <div class="live hidden" id="live"></div>
  <div class="nav">
    <button class="navbtn" id="back">戻る</button>
    <button class="navbtn next" id="next">次へ</button>
  </div>
  <div class="note" id="note"></div>
</div>

<div class="ov" id="ov">
  <div class="ovbox">
    <h3>— 確 認 開 始 —</h3>
    <div class="sum" id="ov-sum"></div>
    <div class="ov-actions">
      <button class="startbtn btn-ghost" id="ov-no">再 想 想</button>
      <button class="startbtn" id="ov-yes">开 始 游 戏</button>
    </div>
    <div class="small" id="ov-msg"></div>
  </div>
</div>

<script>
/* ============ 桥（TavernHelper）：切换消息 0 的开场白 swipe ============ */
(function (global) {
  'use strict';
  function scope(name) {
    var candidates = [global];
    try { if (global.parent && global.parent !== global) { candidates.push(global.parent); } } catch (_) {}
    try { if (global.top && candidates.indexOf(global.top) === -1) { candidates.push(global.top); } } catch (_) {}
    for (var i = 0; i < candidates.length; i++) {
      try { if (candidates[i] && candidates[i][name] !== undefined) { return candidates[i][name]; } } catch (_) {}
    }
    return undefined;
  }
  function helperCall(name) {
    var h = scope('TavernHelper');
    if (h && typeof h[name] === 'function') { return h[name].bind(h); }
    var d = scope(name);
    return typeof d === 'function' ? d : null;
  }
  async function selectGreeting(swipeId) {
    var index = Number(swipeId);
    if (!Number.isInteger(index) || index < 1) { throw new Error('开场编号无效'); }
    var getMessages = helperCall('getChatMessages');
    if (!getMessages) { throw new Error('当前环境不支持读取开场白（无 getChatMessages）'); }
    var messages = await getMessages(0, { include_swipes: true });
    var first = messages && messages[0];
    if (!first || !Array.isArray(first.swipes) || first.swipes[index] == null) {
      throw new Error('所选开场不存在（槽位 ' + index + '）');
    }
    // 优先：酒馆助手风格 API setChatMessages([{message_id,swipe_id}])
    var setMessages = helperCall('setChatMessages');
    if (setMessages) { return setMessages([{ message_id: 0, swipe_id: index }]); }
    // 次选：skill 风格 setChatMessage(text,0,{swipe_id,refresh})
    var setMessage = helperCall('setChatMessage');
    if (setMessage) { return setMessage(String(first.swipes[index]), 0, { swipe_id: index, refresh: 'display_and_render_current' }); }
    throw new Error('当前环境不支持切换开场（找不到 setChatMessage/setChatMessages）');
  }
  global.MyCardBridgeV1 = Object.freeze({ version: 1, selectGreeting: selectGreeting });
})(globalThis);
</script>

<script>
/* ============ 集中配置（C11） ============ */
var MOMS = {
  A: {
    nm: '温柔腼腆 · 内心抗拒母亲',
    tag: '细 腻 · 克 制',
    desc: '美咲子的温柔总慢了半拍：半夜推门见你还醒着，红着脸把你按回被窝，轻声哄着“别熬了呀，妈心疼。”她记得你所有忌口，却从不敢多碰你一下——掖被角的指尖悬在半空又悄悄收回。守夜后她趴在床边睡着，手还搭在你手背上；醒来却红着脸别开头：“…妈只是顺手照顾你。”嘴上守着界线，眼神却骗不了人。她的心软与你的抗拒，在同一间屋檐下反复拉扯，谁都不敢先迈出那一步呢。'
  },
  B: {
    nm: '毒蛇傲娇母亲',
    tag: '毒 舌 · 口 嫌 体 正 直',
    desc: '美咲子嘴上从不饶人，笑都带着刺：“别用那种眼神看我，恶心死了”“哭什么，废物一个，也配当我的儿子？”——就算被你逼到墙角、不得不伸手帮你纾解，她也一边伺候一边骂：“手别抖…呵，就这么点出息？”眉头皱得能夹死蚊子，心底也满满是嫌弃，嫌弃你、嫌弃自己这双手，却还是会把动作做完，再冷着脸甩下一句“滚去洗”。毒舌与嫌恶之下，藏着一点她死也不肯承认的在意。'
  }
};
var STAGES = [
  { key:'s1', short:'阶段一 · 手交', n:'阶段一 · 手交期', min:0,   max:299,
    allow:['手交'], forbid:['口交','吸奶','脱衣','看光','插入','不隔着衣服摸奶'] },
  { key:'s2', short:'阶段二 · 口交', n:'阶段二 · 口交期', min:300, max:449,
    allow:['手交','口交','摸奶'], forbid:['乳交','看光','脱衣','不隔着衣服摸奶','插入'] },
  { key:'s3', short:'阶段三 · 乳交', n:'阶段三 · 乳交期', min:450, max:599,
    allow:['手交','口交','吸奶','看光','不隔着衣服摸奶'], forbid:['实质性插入'] },
  { key:'s4', short:'阶段四 · 完全接纳', n:'阶段四 · 完全接纳期', min:600, max:750,
    allow:['全面接纳（无限制）'], forbid:[] }
];
var SLOTS = { A:{ none:1, bro:3, dad:4, both:5 }, B:{ none:2, bro:6, dad:7, both:8 } };
var TITLES = ['开局选择','基础设定','母亲风格','角色与阶段','确认开局'];
var MEM_KEY = 'openingFlow_v1';

function byId(x){ return document.getElementById(x); }
function clamp(n,a,b){ return Math.min(Math.max(n,a),b); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function setNote(m){ byId('note').textContent = m || ''; }
function notify(msg, isErr){
  var w = window, d = 0;
  while (w && d < 12) {
    try { if (w.toastr) { (isErr ? w.toastr.error : w.toastr.success)(msg, '开局选择'); return; } } catch (e) {}
    if (w === w.parent) { break; }
    w = w.parent; d++;
  }
  try { console[(isErr ? 'error' : 'log')]('[开局] ' + msg); } catch (e) {}
}

/* ============ 渲染母亲卡（同一模板，保证排版一致） ============ */
function renderMoms(){
  var pair = byId('m-pair'); pair.innerHTML = '';
  ['A','B'].forEach(function(k){
    var g = document.createElement('div');
    g.className = 'girl' + (k === state.mom ? ' on' : '');
    g.dataset.m = k;
    g.innerHTML = '<span class="sel-mark">✓</span>' +
      '<div class="nm">' + esc(MOMS[k].nm) + '</div>' +
      '<div class="desc">' + esc(MOMS[k].desc) + '</div>' +
      '<span class="tag">' + esc(MOMS[k].tag) + '</span>';
    g.addEventListener('click', function(){
      state.mom = k;
      document.querySelectorAll('.girl').forEach(function(x){ x.classList.toggle('on', x.dataset.m === k); });
      save(); refreshLive();
    });
    pair.appendChild(g);
  });
}

/* ============ 阶段 chips 渲染 ============ */
function renderChips(){
  var box = byId('stage-chips'); box.innerHTML = '';
  STAGES.forEach(function(s){
    var c = document.createElement('span');
    c.className = 'chip' + (s.key === state.st ? ' on' : '');
    c.dataset.st = s.key;
    c.textContent = s.short;
    c.addEventListener('click', function(){ setStage(s.key, true); save(); });
    box.appendChild(c);
  });
}

/* ============ 记忆（A2） ============ */
var state = { name:'', age:'', look:'', mom:'A', bro:false, dad:false, st:'s4', score:600 };
function save(){
  state.name = byId('f-name').value; state.age = byId('f-age').value; state.look = byId('f-look').value;
  state.bro = byId('c-bro').classList.contains('on');
  state.dad = byId('c-dad').classList.contains('on');
  state.score = Number(byId('f-score').value);
  try { localStorage.setItem(MEM_KEY, JSON.stringify(state)); } catch(e){}
}
function restore(){
  var raw = null;
  try { raw = JSON.parse(localStorage.getItem(MEM_KEY) || 'null'); } catch(e){}
  if (!raw) { return; }
  if (typeof raw.name === 'string') { state.name = raw.name; }
  if (typeof raw.age === 'string') { state.age = raw.age; }
  if (typeof raw.look === 'string') { state.look = raw.look; }
  if (raw.mom === 'A' || raw.mom === 'B') { state.mom = raw.mom; }
  state.bro = !!raw.bro; state.dad = !!raw.dad;
  var stValid = STAGES.some(function(s){ return s.key === raw.st; });
  if (stValid) { state.st = raw.st; }
  var sc = clamp(Number(raw.score) || 0, 0, 750);
  var stk = STAGES.find(function(s){ return s.key === state.st; });
  state.score = clamp(sc, stk.min, stk.max);
  byId('f-name').value = state.name; byId('f-age').value = state.age; byId('f-look').value = state.look;
  document.querySelectorAll('.girl').forEach(function(x){ x.classList.toggle('on', x.dataset.m === state.mom); });
  byId('c-bro').classList.toggle('on', state.bro);
  byId('c-dad').classList.toggle('on', state.dad);
  document.querySelectorAll('.chip[data-st]').forEach(function(x){ x.classList.toggle('on', x.dataset.st === state.st); });
}

function stageInfo(k){ return STAGES.find(function(s){ return s.key === k; }); }

/* ============ 阶段与分数（A3：点选默认吸附到该阶段下限） ============ */
function setStage(k, snap){
  var info = stageInfo(k);
  state.st = k;
  document.querySelectorAll('.chip[data-st]').forEach(function(x){ x.classList.toggle('on', x.dataset.st === k); });
  var sld = byId('f-score');
  sld.min = info.min; sld.max = info.max;
  var target = snap ? info.min : clamp(Number(sld.value) || info.min, info.min, info.max);
  if (snap) { setNote('已按「' + info.n + '」最低门槛设为 ' + info.min + ' 分，可再拖动微调'); }
  sld.value = target;
  state.score = target;
  paintScore();
  paintBoard(info);
  refreshLive();
}
function paintScore(){
  var v = Number(byId('f-score').value);
  byId('f-score-num').textContent = v + ' / 750';
  byId('f-score-cap').textContent = '可滑范围：' + byId('f-score').min + ' – ' + byId('f-score').max + ' 分';
}
function paintBoard(info){
  var ok = info.allow.map(function(x){ return '<span class="bd ok">✦ ' + esc(x) + '</span>'; }).join('');
  var no = info.forbid.length
    ? info.forbid.map(function(x){ return '<span class="bd no">✕ ' + esc(x) + '</span>'; }).join('')
    : '<span class="bd none">— 无 —</span>';
  byId('st-info').innerHTML =
    '<div class="si-row"><span class="lab">可 以</span><span class="bds">' + ok + '</span></div>' +
    '<div class="si-row"><span class="lab">不可以</span><span class="bds">' + no + '</span></div>';
}

/* ============ 实时组合条（A4） ============ */
function extraShort(){
  if (state.bro && state.dad) { return '弟弟 + 爸爸'; }
  if (state.bro) { return '弟弟'; }
  if (state.dad) { return '爸爸'; }
  return '仅母子';
}
function extraKey(){ return (state.bro&&state.dad)?'both':state.bro?'bro':state.dad?'dad':'none'; }
function comboHead(){ return MOMS[state.mom].nm + ' · ' + extraShort() + ' · ' + stageInfo(state.st).n; }
function slotOf(){ return SLOTS[state.mom][extraKey()]; }
function refreshLive(){
  var score = Number(byId('f-score').value);
  var el = byId('live');
  el.classList.remove('hidden');
  el.innerHTML = '当前组合：<b>' + esc(MOMS[state.mom].nm) + '</b> · ' + esc(extraShort()) +
    ' · <b>' + esc(stageInfo(state.st).n) + '</b> · 成绩 <b>' + score + '</b>（槽位 ' + slotOf() + '）';
}

/* ============ 流程导航 ============ */
var idx = 0;
var scr = document.querySelectorAll('.scr');
function stepsDraw(){
  var el = byId('steps'); el.innerHTML = '';
  for (var i = 0; i < scr.length; i++){
    var d = document.createElement('div');
    d.className = 'stepdot' + (i === idx ? ' on' : i < idx ? ' done' : '');
    d.textContent = String(i + 1);
    el.appendChild(d);
    if (i < scr.length - 1){
      var seg = document.createElement('div');
      seg.className = 'stseg' + (i < idx ? ' done' : '');
      el.appendChild(seg);
    }
  }
  byId('stcap').textContent = 'STEP ' + (idx + 1) + ' / ' + scr.length + ' · ' + TITLES[idx];
  byId('back').disabled = (idx === 0);
  byId('next').style.display = (idx === 0 || idx === scr.length - 1) ? 'none' : '';
  byId('live').classList.toggle('hidden', idx === 0 || idx === scr.length - 1);
  if (idx === scr.length - 1) { renderSum(); }
}
function go(n){
  if (n < 0 || n >= scr.length || n === idx) { return; }
  scr[idx].classList.remove('in'); scr[idx].classList.add('back');
  idx = n;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    for (var i = 0; i < scr.length; i++){ scr[i].classList.toggle('in', i === idx); scr[i].classList.remove('back'); }
    stepsDraw();
  }); });
}

function renderSum(){
  var s = byId('sum');
  var score = Number(byId('f-score').value);
  s.innerHTML =
    '<div class="r"><span class="k">姓名</span><b>' + esc(byId('f-name').value || '待填') + '</b></div>' +
    '<div class="r"><span class="k">年龄</span><b>' + esc(byId('f-age').value || '待填') + '</b></div>' +
    '<div class="r"><span class="k">母亲风格</span><b>' + esc(MOMS[state.mom].nm) + '</b></div>' +
    '<div class="r"><span class="k">加入角色</span><b>' + esc(extraShort()) + '</b></div>' +
    '<div class="r"><span class="k">初始阶段</span><b>' + esc(stageInfo(state.st).n) + '</b></div>' +
    '<div class="r"><span class="k">初始成绩</span><b>' + score + ' / 750</b></div>' +
    '<div class="r"><span class="k">对应槽位</span><b>槽位 ' + slotOf() + '</b></div>';
}

/* ---------- 变量同步（跳转后写楼层 user 姓名/总成绩，含防覆盖重试） ---------- */
function findWin(pred){
  var w = window, depth = 0;
  while (w && depth < 12) {
    try { if (pred(w)) { return w; } } catch (e) {}
    if (w === w.parent) { break; }
    w = w.parent; depth++;
  }
  return null;
}
function gl(name){
  var w = findWin(function (x) { try { return typeof x[name] !== 'undefined'; } catch (e) { return false; } });
  return w ? w[name] : undefined;
}
function patchMvu(name, score, slot){
  var M = gl('Mvu');
  if (!M) { return; }
  var lastWrite = 0;
  function writeOnce(){
    var now = Date.now();
    if (now - lastWrite < 800) { return; }
    lastWrite = now;
    ['latest', 0].forEach(function (mid) {
      try {
        var d = M.getMvuData({ type: 'message', message_id: mid });
        if (d && d.stat_data && d.stat_data.user) {
          var u = d.stat_data.user;
          if (name) { u['姓名'] = name; }
          u['总成绩值'] = clamp(Math.round(score) || 230, 0, 750);
          M.replaceMvuData(d, { type: 'message', message_id: mid }).then(function () {
            try {
              var chk = M.getMvuData({ type: 'message', message_id: mid });
              var cv = chk && chk.stat_data && chk.stat_data.user ? chk.stat_data.user['总成绩值'] : null;
              console.info('[开局] 已写入 楼层', mid, '总成绩=', cv, '(目标', score + ')');
            } catch (e) {}
          }).catch(function () {});
        }
      } catch (e) {}
    });
  }
  writeOnce();
  /* 楼层 schema 初始化在切换后可能才跑并覆盖默认值，故延时+事件伴随反复写回 */
  var attempts = 0;
  function reapply(){
    writeOnce();
    if (++attempts < 8) { setTimeout(reapply, 600); }
  }
  setTimeout(function () { reapply(); }, 600);
  setTimeout(function () { reapply(); }, 1600);
  try {
    var pw = window.parent || window;
    if (pw && pw.addEventListener) { pw.addEventListener('mag_variable_update_ended', writeOnce); }
  } catch (e) {}
  /* 终验：等写入稳定后回读并提示结果（成功走 toastr，失败报差异） */
  var guard = 0;
  var finalTimer = setInterval(function () {
    guard++;
    var finalVal = null;
    try {
      var d0 = M.getMvuData({ type: 'message', message_id: 0 });
      if (d0 && d0.stat_data && d0.stat_data.user) { finalVal = d0.stat_data.user['总成绩值']; }
    } catch (e) {}
    if (finalVal !== null) {
      clearInterval(finalTimer);
      var target = clamp(Math.round(score) || 230, 0, 750);
      if (Number(finalVal) !== target) {
        notify('⚠ 成绩写入不稳定：目标 ' + target + '，状态栏显示 ' + finalVal, true);
      } else {
        notify('✓ 已确认状态栏成绩 = ' + finalVal);
      }
    } else if (guard > 12) { clearInterval(finalTimer); }
  }, 900);
}

/* ============ 二次确认浮层（A5） ============ */
function openOv(){
  var s = byId('ov-sum');
  var score = Number(byId('f-score').value);
  s.innerHTML =
    '<div class="r"><span class="k">母亲风格</span><b>' + esc(MOMS[state.mom].nm) + '</b></div>' +
    '<div class="r"><span class="k">加入角色</span><b>' + esc(extraShort()) + '</b></div>' +
    '<div class="r"><span class="k">初始阶段</span><b>' + esc(stageInfo(state.st).n) + '</b></div>' +
    '<div class="r"><span class="k">初始成绩</span><b>' + score + ' / 750</b></div>';
  byId('ov-msg').textContent = '';
  byId('ov').classList.add('open');
}
function closeOv(){ byId('ov').classList.remove('open'); }
function finish(){
  var slot = slotOf();
  var msg = '';
  try {
    var bridge = globalThis.MyCardBridgeV1 || {};
    if (typeof bridge.selectGreeting === 'function') {
      bridge.selectGreeting(slot)
        .then(function(){
          notify('✓ 已切换到槽位 ' + slot + ' 的开场白（正在同步成绩，稍后状态栏更新）');
          byId('ov-msg').textContent = '✓ 已切换到槽位 ' + slot + ' 的开场白';
          setTimeout(closeOv, 1200);
          try { patchMvu(byId('f-name').value.trim(), Number(byId('f-score').value), slot); } catch (e) {}
        })
        .catch(function(e){
          var em = e && e.message ? e.message : '切换失败';
          byId('ov-msg').textContent = '⚠ ' + em;
          notify('⚠ ' + em, true);
        });
      return;
    }
  } catch(e){}
  /* 预览 / 无桥兜底（C12） */
  msg = '预览模式：确认将进入「' + comboHead() + '」对应槽位 ' + slot + '（接入酒馆后自动跳转并同步变量）';
  byId('ov-msg').textContent = msg;
  setTimeout(closeOv, 1600);
}

/* ============ 事件绑定与启动 ============ */
(function bind(){
  ['f-name','f-age','f-look'].forEach(function(id){
    byId(id).addEventListener('input', function(){ if (this.value) { this.classList.remove('ph'); } save(); });
  });
  byId('c-bro').addEventListener('click', function(){ state.bro = !state.bro; this.classList.toggle('on', state.bro); save(); refreshLive(); });
  byId('c-dad').addEventListener('click', function(){ state.dad = !state.dad; this.classList.toggle('on', state.dad); save(); refreshLive(); });
  var fscore = byId('f-score');
  fscore.addEventListener('input', function(){
    paintScore(); refreshLive();
  });
  fscore.addEventListener('change', function(){ save(); setNote(''); });

  byId('begin').addEventListener('click', function(){ go(1); });
  byId('back').addEventListener('click', function(){ go(Math.max(0, idx - 1)); });
  byId('next').addEventListener('click', function(){ go(idx + 1); });
  byId('go').addEventListener('click', function(){ save(); openOv(); });
  byId('ov-no').addEventListener('click', closeOv);
  byId('ov-yes').addEventListener('click', finish);

  renderMoms();
  renderChips();
  restore();
  /* 按恢复后的状态渲染各控件 */
  document.querySelectorAll('.girl').forEach(function(x){ x.classList.toggle('on', x.dataset.m === state.mom); });
  byId('c-bro').classList.toggle('on', state.bro);
  byId('c-dad').classList.toggle('on', state.dad);
  setStage(state.st, false);
  stepsDraw();
})();
</script>
