<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>开局选择 · 母型×角色×阶段</title>
<style>
html, body{ margin:0; padding:0; }
body{ font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif; -webkit-font-smoothing:antialiased; }

.op-panel{
  box-sizing:border-box; width:100%;
  --bg:#fbf8f2; --bg2:#f5efe4; --ln:#e3d9c6; --ink:#40382c; --ink2:#6f6350; --ink3:#9c8f7a;
  --mom:#a03a44; --you:#2e5f5f; --gold:#b98f4a;
  background:var(--bg); color:var(--ink);
  border:1px solid var(--ln); border-radius:12px;
  padding:14px 16px 14px;
  box-shadow:0 1px 0 rgba(64,56,44,.04) inset, 0 6px 18px -14px rgba(64,50,30,.35);
  font-size:12px; line-height:1.6;
}
.op-panel *, .op-panel *::before, .op-panel *::after{ box-sizing:border-box; }
.sec-title{ display:flex; align-items:center; gap:7px; margin:0 0 9px; font-size:12px; font-weight:700;
  letter-spacing:.24em; color:var(--ink); }
.sec-title::before{ content:""; flex:none; width:4px; height:12px; border-radius:2px; background:var(--mom); }
.op-sub{ font-size:9.5px; letter-spacing:.2em; color:var(--ink3); }

/* 基础自定义 */
.op-base{ background:var(--bg2); border:1px solid var(--ln); border-radius:8px; padding:10px 11px; margin-bottom:13px; }
.op-row{ margin-bottom:7px; }
.op-row label{ display:block; margin-bottom:2px; font-size:10px; letter-spacing:.14em; color:var(--ink3); }
.op-row label b{ width:64px; font-weight:700; color:var(--ink2); letter-spacing:.1em; }
.op-input{ width:100%; border:1px solid var(--ln); border-radius:6px; background:#fffdf8; color:var(--ink);
  padding:5px 8px; font-size:12px; font-family:inherit; outline:none; }
.op-input:focus{ border-color:var(--mom); }
textarea.op-input{ resize:vertical; min-height:38px; line-height:1.55; }
.op-inline{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.op-range{ display:flex; align-items:center; gap:8px; }
.op-range input[type=range]{ flex:1; accent-color:var(--you); }
.op-range em{ flex:none; width:96px; font-style:normal; text-align:right; font-size:10.5px;
  color:var(--ink2); font-weight:600; font-variant-numeric:tabular-nums; }
.op-score-hint{ display:block; font-size:9.5px; color:var(--ink3); letter-spacing:.04em; margin-top:1px; }

/* 阶段 chips */
.op-stages{ display:flex; gap:6px; flex-wrap:wrap; margin:5px 0 3px; }
.op-stage{ position:relative; cursor:pointer; }
.op-stage input{ position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); }
.op-stage-box{ display:inline-block; background:#fffdf8; border:1px solid var(--ln); border-radius:999px;
  padding:3px 12px; font-size:11px; color:var(--ink2); letter-spacing:.06em; }
.op-stage input:checked + .op-stage-box{ border-color:var(--mom); color:var(--mom); box-shadow:0 0 0 1px var(--mom); }
.op-stage-desc{ display:block; font-size:9.5px; line-height:1.55; color:var(--ink3); letter-spacing:.03em; margin-bottom:2px; }

/* 母型选择（二选一） */
.op-moms{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:9px; }
.op-mom{ position:relative; cursor:pointer; }
.op-mom input{ position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); }
.op-mom-box{ display:block; background:var(--bg2); border:1px solid var(--ln); border-radius:8px; padding:9px 11px 8px; }
.op-mom-name{ display:block; font-size:12.5px; font-weight:700; color:var(--mom); letter-spacing:.04em; margin-bottom:4px; }
.op-mom-box .op-mom-name::before{ content:""; display:inline-block; width:6px; height:6px; margin-right:6px;
  border-radius:50%; border:2px solid var(--ink3); vertical-align:1px; }
.op-mom input:checked + .op-mom-box{ border-color:var(--mom); box-shadow:0 0 0 1px var(--mom); background:#fffdfa; }
.op-mom input:checked + .op-mom-box .op-mom-name::before{ background:var(--mom); border-color:var(--mom); }
.op-mom-desc{ display:block; font-size:10.5px; line-height:1.6; color:var(--ink2); }

/* 附加角色 */
.op-extras{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.op-extra{ cursor:pointer; }
.op-extra input{ position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); }
.op-extra-box{ display:flex; align-items:center; gap:7px; background:var(--bg2); border:1px solid var(--ln);
  border-radius:999px; padding:4px 13px; font-size:11px; color:var(--ink2); letter-spacing:.08em; }
.op-extra-box::before{ content:""; width:12px; height:12px; border-radius:4px; border:1px solid var(--ink3); background:#fffdf8; }
.op-extra input:checked + .op-extra-box{ border-color:var(--you); color:var(--you); }
.op-extra input:checked + .op-extra-box::before{ background:var(--you); border-color:var(--you); }

/* 汇总与开始 */
.op-go{ background:var(--bg2); border:1px solid var(--ln); border-radius:8px; padding:9px 11px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.op-go-name{ flex:1; min-width:180px; font-size:12.5px; font-weight:700; color:var(--ink); letter-spacing:.06em; }
.op-go-name small{ display:block; font-size:9.5px; font-weight:400; color:var(--ink3); letter-spacing:.12em; margin-top:1px; }
.btn{ display:inline-block; border:1px solid var(--ln); background:#fffdf8; color:var(--ink);
  border-radius:999px; padding:6px 18px; font-size:12px; letter-spacing:.12em; cursor:pointer; }
.btn:hover{ border-color:var(--mom); color:var(--mom); }
.btn.primary{ background:var(--mom); border-color:var(--mom); color:#fff; }
.btn.primary:hover{ opacity:.9; }
.op-log{ margin-top:8px; font-size:10.5px; color:var(--mom); min-height:14px; white-space:pre-wrap; }
.op-tip{ margin-top:8px; font-size:10px; color:var(--ink3); letter-spacing:.05em; line-height:1.6; }
@media (max-width:560px){ .op-moms{ grid-template-columns:1fr; } .op-inline{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="op-panel">
  <!-- ===== 前置基础自定义 ===== -->
  <p class="sec-title">基础设定</p>
  <div class="op-base">
    <div class="op-inline">
      <div class="op-row"><label><b>姓名</b></label><input class="op-input" id="op-name" placeholder="儿子的名字"></div>
      <div class="op-row"><label><b>年龄</b></label><input class="op-input" id="op-age" placeholder="如 17 岁"></div>
    </div>
    <div class="op-row"><label><b>外貌性格</b></label><textarea class="op-input" id="op-look" placeholder="外貌特征、性格倾向…"></textarea></div>

    <!-- 初始阶段（审核机制：按阶段限制分数区间与行为） -->
    <div class="op-row">
      <label><b>初始阶段</b><span style="font-weight:400">选择后初始总成绩自动限定在该阶段区间，避免开局就超出阶段允许的行为。</span></label>
      <span class="op-stages" id="op-stages">
        <label class="op-stage"><input type="radio" name="op-stage" value="s1" checked><span class="op-stage-box">阶段一 · 手交</span></label>
        <label class="op-stage"><input type="radio" name="op-stage" value="s2"><span class="op-stage-box">阶段二 · 口交</span></label>
        <label class="op-stage"><input type="radio" name="op-stage" value="s3"><span class="op-stage-box">阶段三 · 乳交</span></label>
        <label class="op-stage"><input type="radio" name="op-stage" value="s4"><span class="op-stage-box">阶段四 · 完全接纳</span></label>
      </span>
      <span class="op-stage-desc" id="op-stage-desc"></span>
    </div>
    <div class="op-row">
      <label><b>初始总成绩</b></label>
      <span class="op-range"><input type="range" id="op-score" min="0" max="299" value="230"><em id="op-score-num">230</em></span>
      <span class="op-score-hint" id="op-score-hint"></span>
    </div>
    <div class="op-row">
      <label><b>初始精力</b></label>
      <span class="op-range"><input type="range" id="op-energy" min="0" max="100" value="100"><em id="op-energy-num">100</em></span>
    </div>
  </div>

  <!-- ===== 母型二选一 ===== -->
  <p class="sec-title">母亲风格 <span class="op-sub">（必选其一）</span></p>
  <div class="op-moms" id="op-moms">
    <label class="op-mom">
      <input type="radio" name="op-mom" value="A" checked>
      <span class="op-mom-box">
        <span class="op-mom-name">温柔腼腆 · 内心抗拒母亲</span>
        <span class="op-mom-desc">少年温柔腼腆、心事深藏，被升学压力与失眠压得喘不过气；母亲美咲子心疼他，笨拙而羞怯地靠近——可这份暧昧总在母子名分前戛然而止。她想温柔，却不敢越界；他依赖，却本能抗拒。一对母子在温情、心软与克制之间反复拉扯的细腻开局。</span>
      </span>
    </label>
    <label class="op-mom">
      <input type="radio" name="op-mom" value="B">
      <span class="op-mom-box">
        <span class="op-mom-name">毒蛇傲娇母亲</span>
        <span class="op-mom-desc">母亲美咲子收敛起所有温柔，用毒舌、轻蔑与高傲武装自己——嘴上刻薄嫌弃，眼神却总在他低落的角落停驻；每当他真的受伤退缩，她又会别扭地递上台阶，借口一套接一套，打死不肯承认心软。针锋相对、口嫌体正直的傲娇母子开局。</span>
      </span>
    </label>
  </div>

  <!-- ===== 附加角色（可多选/不选） ===== -->
  <p class="sec-title">加入角色 <span class="op-sub">（可都不选）</span></p>
  <div class="op-extras">
    <label class="op-extra">
      <input type="checkbox" id="op-bro">
      <span class="op-extra-box">弟弟</span>
    </label>
    <label class="op-extra">
      <input type="checkbox" id="op-dad">
      <span class="op-extra-box">爸爸</span>
    </label>
  </div>

  <!-- ===== 确认区 ===== -->
  <div class="op-go">
    <span class="op-go-name" id="op-summary"></span>
    <button class="btn primary" id="op-start">进入本开局</button>
  </div>
  <div class="op-log" id="op-log"></div>
  <div class="op-tip">跳转到本卡对应组合的 alternate_greetings 槽位（共 8 个，已按 母型×弟弟×爸爸 排好）。姓名/总成绩/精力会同步进楼层变量；初始总成绩按所选阶段限定，使开局行为与审核阶段一致；年龄与外貌性格请在你填写对应开场白文案时融入。</div>
</div>

<script>
/* ============================================================
   桥（TavernHelper）：切换消息 0 的开场白 swipe
   ============================================================ */
(function (global) {
  'use strict';
  function scope(name) {
    var candidates = [global];
    try { if (global.parent && global.parent !== global) { candidates.push(global.parent); } } catch (_) {}
    try { if (global.top && candidates.indexOf(global.top) === -1) { candidates.push(global.top); } } catch (_) {}
    for (var i = 0; i < candidates.length; i++) { try { if (candidates[i] && candidates[i][name] !== undefined) { return candidates[i][name]; } } catch (_) {} }
    return undefined;
  }
  function helperCall(name) {
    var h = scope('TavernHelper');
    if (h && typeof h[name] === 'function') { return h[name].bind(h); }
    var d = scope(name);
    return typeof d === 'function' ? d : null;
  }
  async function selectGreeting(swipeId) {
    var index = Number(swipeId);
    if (!Number.isInteger(index) || index < 1) { throw new Error('开场编号无效'); }
    var getMessages = helperCall('getChatMessages');
    var setMessage  = helperCall('setChatMessage');
    if (!getMessages || !setMessage) { throw new Error('当前环境不支持切换开场（无 TavernHelper）'); }
    var messages = await getMessages('0', { include_swipes: true });
    var first = messages && messages[0];
    if (!first || !Array.isArray(first.swipes) || first.swipes[index] == null) { throw new Error('所选开场不存在（槽位 ' + index + '）'); }
    return setMessage(String(first.swipes[index]), 0, { swipe_id: index, refresh: 'display_and_render_current' });
  }
  global.MyCardBridgeV1 = Object.freeze({ version: 1, selectGreeting: selectGreeting });
})(globalThis);

/* ============================================================
   槽位映射 + 阶段区间（审核机制）
   ============================================================ */
(function () {
  'use strict';
  var SLOTS = {
    A: { none: 1, bro: 3, dad: 4, both: 5 },
    B: { none: 2, bro: 6, dad: 7, both: 8 }
  };
  var MOM_LABEL = { A: '温柔腼腆 · 内心抗拒母亲', B: '毒蛇傲娇母亲' };
  var EXTRA_LABEL = { none: '仅母子', bro: '+弟弟', dad: '+爸爸', both: '+弟弟+爸爸' };

  /* 阶段边界（依据卡内审核机制：<300 手交 / 300-450 口交 / 450-600 乳交 / >=600 接纳） */
  var STAGES = {
    s1: { min: 0,   max: 299, name: '阶段一 · 手交期',
      desc: '允许：手交；禁止：口交、乳交、吸奶、看光、脱衣、隔衣摸奶、插入。分数区间 0–299。' },
    s2: { min: 300, max: 449, name: '阶段二 · 口交期',
      desc: '允许：手交、口交、摸奶；禁止：乳交、看光、脱衣、隔衣摸奶、插入。分数区间 300–449。' },
    s3: { min: 450, max: 599, name: '阶段三 · 乳交期',
      desc: '允许：手交、口交、吸奶、看光、隔衣摸奶；禁止：实质插入。分数区间 450–599。' },
    s4: { min: 600, max: 750, name: '阶段四 · 完全接纳期',
      desc: '全面接纳，无禁止。分数区间 600–750。' }
  };

  function $id(x) { return document.getElementById(x); }
  function clamp(n, a, b) { return Math.min(Math.max(n, a), b); }
  function setLog(m) { var el = $id('op-log'); if (el) { el.textContent = m; } }
  function currentStage() {
    var els = document.querySelectorAll('input[name=op-stage]');
    for (var i = 0; i < els.length; i++) { if (els[i].checked) { return els[i].value; } }
    return 's1';
  }
  function currentMom() {
    var els = document.querySelectorAll('input[name=op-mom]');
    for (var i = 0; i < els.length; i++) { if (els[i].checked) { return els[i].value; } }
    return 'A';
  }
  function currentExtra() {
    var bro = $id('op-bro').checked, dad = $id('op-dad').checked;
    if (bro && dad) { return 'both'; }
    if (bro) { return 'bro'; }
    if (dad) { return 'dad'; }
    return 'none';
  }
  function slotOf() { return SLOTS[currentMom()][currentExtra()]; }

  function refreshStage() {
    var key = currentStage();
    var st = STAGES[key];
    var sld = $id('op-score');
    sld.min = st.min;
    sld.max = st.max;
    var v = clamp(Number(sld.value) || st.min, st.min, st.max);
    if (st.key === undefined) { /* keep */ }
    /* 若分数原本低于该阶段下限，则抬到下界（保证能触发该阶段行为） */
    sld.value = v;
    $id('op-score-num').textContent = v + ' 分';
    $id('op-stage-desc').textContent = st.name + '：' + st.desc;
    $id('op-score-hint').textContent = '初始总成绩已被限定在 ' + st.name + ' 区间 ' + st.min + '–' + st.max + '，开局即按该阶段审核。';
  }
  function refreshSummary() {
    var st = STAGES[currentStage()];
    var s = MOM_LABEL[currentMom()] + ' · ' + EXTRA_LABEL[currentExtra()] + ' · ' + st.name;
    $id('op-summary').innerHTML = s + '<small>槽位 ' + slotOf() + ' · 初始总成绩 ' + $id('op-score').value + ' 分</small>';
  }

  /* ---------- MVU 变量（姓名/总成绩/精力） ---------- */
  function findWin(pred) {
    var w = window, depth = 0;
    while (w && depth < 12) {
      try { if (pred(w)) { return w; } } catch (e) {}
      if (w === w.parent) { break; }
      w = w.parent; depth++;
    }
    return null;
  }
  function gl(name) {
    var w = findWin(function (x) { try { return typeof x[name] !== 'undefined'; } catch (e) { return false; } });
    return w ? w[name] : undefined;
  }
  function waitMvu(cb, tries) {
    var M = gl('Mvu');
    if (M) { try { cb(M); return; } catch (e) { setLog('变量写入失败：' + e.message); return; } }
    if (tries > 0) { setTimeout(function () { waitMvu(cb, tries - 1); }, 500); }
  }
  function patchVars(name, score, energy) {
    waitMvu(function (M) {
      var mids = ['latest', 0];
      var done = 0;
      mids.forEach(function (mid) {
        try {
          var data = M.getMvuData({ type: 'message', message_id: mid });
          if (data && data.stat_data && data.stat_data.user) {
            var user = data.stat_data.user;
            if (name) { user['姓名'] = name; }
            user['总成绩值'] = clamp(Math.round(score) || 230, 0, 750);
            user['精力值'] = clamp(Math.round(energy) || 100, 0, 100);
            M.replaceMvuData(data, { type: 'message', message_id: mid }).then(function () {
              done++;
              if (done >= 2) {
                try { window.dispatchEvent(new Event('mag_variable_update_ended')); } catch (e) {}
                try { if (window.parent) { window.parent.dispatchEvent(new Event('mag_variable_update_ended')); } } catch (e) {}
              }
            }).catch(function () { done++; });
          } else { done++; }
        } catch (e) { done++; }
      });
    }, 12);
  }

  /* ---------- 开始 ---------- */
  async function start() {
    var slot = slotOf();
    var name = $id('op-name').value.trim();
    var score = Number($id('op-score').value);
    var energy = Number($id('op-energy').value);
    var st = STAGES[currentStage()];
    setLog('正在进入「' + MOM_LABEL[currentMom()] + ' · ' + EXTRA_LABEL[currentExtra()] + ' · ' + st.name + '」（槽位 ' + slot + '，初始总成绩 ' + score + '）…');
    try {
      var bridge = globalThis.MyCardBridgeV1 || {};
      if (typeof bridge.selectGreeting !== 'function') { throw new Error('开局桥接尚未就绪'); }
      await bridge.selectGreeting(slot);
      setLog('✓ 已切换到对应开场白，正在同步基础设定…');
      setTimeout(function () {
        patchVars(name, score, energy);
        setLog('✓ 完成：' + MOM_LABEL[currentMom()] + EXTRA_LABEL[currentExtra()] + ' · ' + st.name + '（槽位 ' + slot + '，成绩 ' + score + '）');
      }, 700);
    } catch (err) {
      setLog('⚠ ' + (err && err.message ? err.message : '切换失败'));
    }
  }

  function bind() {
    var eb = $id('op-energy'), sb = $id('op-score');
    if (eb) { eb.addEventListener('input', function () { $id('op-energy-num').textContent = eb.value; }); }
    if (sb) { sb.addEventListener('input', function () { $id('op-score-num').textContent = sb.value + ' 分'; refreshSummary(); }); }
    document.querySelectorAll('input[name=op-stage]').forEach(function (el) {
      el.addEventListener('change', function () { refreshStage(); refreshSummary(); });
    });
    document.querySelectorAll('input[name=op-mom], #op-bro, #op-dad').forEach(function (el) {
      el.addEventListener('change', refreshSummary);
    });
    var btn = $id('op-start');
    if (btn) { btn.addEventListener('click', start); }
    refreshStage();
    refreshSummary();
  }
  function boot() {
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', bind); }
    else { bind(); }
  }
  boot();
})();
</script>
</body>
</html>
