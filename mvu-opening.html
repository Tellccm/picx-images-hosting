<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开局选择 · 纯文档流版（不裁剪）</title>
<style>
  :root{
    --bg1:#17110f; --bg2:#241813; --ink:#f3e9dc; --ink2:#cbb9a2; --ink3:#8f7a64;
    --accent:#e07a7f; --accent2:#d8b48a; --ok:#dcc08a; --no:#d09090; --line:rgba(255,255,255,.12);
    --serif:"Songti SC","STSong","SimSun",serif;
  }
  *{ box-sizing:border-box; }
  /* 纯文档流：body 不锁高、不隐藏溢出，内容多高就多高，超出由父级(聊天区)滚动 */
  html,body{ margin:0; padding:0; background:transparent; }
  body{ font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; }

  .wrap{ position:relative; width:100%; max-width:740px; margin:0 auto; padding:20px 22px 26px;
    overflow:visible;
    background:
      radial-gradient(1200px 600px at 78% -8%, rgba(224,122,127,.18), transparent 60%),
      radial-gradient(900px 520px at 8% 110%, rgba(216,180,138,.12), transparent 55%),
      linear-gradient(160deg, var(--bg2), var(--bg1) 55%, #120d0b);
    border-radius:14px; box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 24px 60px -24px rgba(0,0,0,.7); }
  .wrap::after{ content:""; position:absolute; inset:0; pointer-events:none; opacity:.5; border-radius:14px;
    background-image:linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:44px 44px; }

  /* 顶部：印章 + 标题 + 步骤 */
  .topline{ position:relative; z-index:2; display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .seal{ flex:none; width:34px; height:34px; background:linear-gradient(150deg,#c74452,#8f1f2d);
    color:#ffe9e2; font-family:var(--serif); font-size:15px; display:flex; align-items:center; justify-content:center;
    transform:rotate(-6deg); border-radius:4px; box-shadow:0 2px 10px rgba(143,31,45,.5), inset 0 0 0 1px rgba(255,255,255,.28);
    text-shadow:0 1px 2px rgba(0,0,0,.4); user-select:none; }
  .logo{ font-family:var(--serif); font-size:16px; letter-spacing:.3em; color:var(--ink);
    text-shadow:0 0 24px rgba(224,122,127,.35); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .logo b{ color:var(--accent); font-weight:700; }
  .steps{ margin-left:auto; display:flex; align-items:center; }
  .stepdot{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-family:var(--serif); color:var(--ink3); border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.02); transition:all .4s ease; }
  .stepdot.on{ color:#2a1c16; background:linear-gradient(180deg,#f2cdb0,#d8a07a); border-color:transparent;
    box-shadow:0 0 14px rgba(224,122,127,.5); }
  .stepdot.done{ color:var(--accent2); border-color:rgba(216,180,138,.55); }
  .stseg{ width:18px; height:1px; background:rgba(255,255,255,.18); margin:0 4px; }
  .stseg.done{ background:rgba(216,180,138,.6); }
  .stcap{ margin-left:auto; font-size:9px; letter-spacing:.3em; color:var(--ink3); white-space:nowrap; }

  .screens{ position:relative; z-index:2; margin-top:16px; }
  /* 分屏：只有当前屏参与布局(.in)，其余 display:none → 纯文档流，不裁剪 */
  .scr{ display:none; animation:vu .45s ease both; }
  .scr.in{ display:block; }
  @keyframes vu{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:none;} }
  .scr.in>*{ animation:vu .45s cubic-bezier(.2,.7,.2,1) both; }
  .scr.in>*:nth-child(1){ animation-delay:.02s; } .scr.in>*:nth-child(2){ animation-delay:.06s; }
  .scr.in>*:nth-child(3){ animation-delay:.10s; } .scr.in>*:nth-child(4){ animation-delay:.14s; }
  .scr.in>*:nth-child(5){ animation-delay:.18s; } .scr.in>*:nth-child(6){ animation-delay:.22s; }

  .big{ font-family:var(--serif); font-size:26px; letter-spacing:.16em; line-height:1.6; text-align:center;
    color:var(--ink); text-shadow:0 2px 30px rgba(0,0,0,.5); padding-top:14px; }
  .big small{ display:block; font-family:"PingFang SC",sans-serif; font-size:11px; letter-spacing:.5em;
    color:var(--accent2); margin-bottom:16px; }
  .big small::before, .big small::after{ content:"❖"; font-size:7px; margin:0 10px; color:rgba(216,180,138,.6); }
  .stageline{ text-align:center; margin-top:16px; font-family:var(--serif); font-size:16px;
    letter-spacing:.22em; color:var(--ink2); }
  .stageline .hl{ color:var(--accent); }
  .stageline .sep{ margin:0 10px; color:rgba(216,180,138,.45); font-size:12px; }
  .big .hl{ color:var(--accent); }
  .tagline{ text-align:center; margin-top:18px; font-size:11px; letter-spacing:.34em; color:var(--accent2);
    opacity:.85; text-shadow:0 0 16px rgba(224,122,127,.4); }
  .tagline::before,.tagline::after{ content:"❖"; font-size:7px; color:rgba(216,180,138,.55); margin:0 10px; vertical-align:2px; }
  .cta{ text-align:center; margin-top:28px; }
  .startbtn{ font-family:var(--serif); font-size:15px; letter-spacing:.5em; color:#2a1c16;
    background:linear-gradient(180deg,#f2cdb0,#d8a07a); border:1px solid rgba(255,255,255,.25);
    padding:13px 44px 13px 52px; border-radius:999px; cursor:pointer;
    box-shadow:0 10px 34px -10px rgba(224,122,127,.55), inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .25s ease, box-shadow .25s ease; }
  .startbtn:hover{ transform:translateY(-2px) scale(1.03); box-shadow:0 16px 44px -10px rgba(224,122,127,.7); }

  .h2{ font-family:var(--serif); font-size:19px; letter-spacing:.5em; color:var(--accent2); margin:0 0 20px; text-align:center; }
  .h2::before, .h2::after{ content:"❖"; font-size:9px; color:rgba(216,180,138,.55); margin:0 12px; vertical-align:2px; }

  .field{ margin:0 auto 18px; max-width:720px; }
  .field label{ display:block; font-size:10px; letter-spacing:.4em; color:var(--ink3); margin-bottom:7px; }
  .inp{ width:100%; background:transparent; border:none; border-bottom:1px solid rgba(255,255,255,.28);
    color:var(--ink); font-size:18px; padding:9px 6px; font-family:var(--serif); letter-spacing:.12em; outline:none; }
  .inp:focus{ border-color:var(--accent); box-shadow:0 6px 18px -12px rgba(224,122,127,.8); }
  .inp.ph{ color:var(--ink3); }

  .pair{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:0 auto; max-width:760px; }
  .girl{ position:relative; border:1px solid var(--line); border-radius:10px; padding:16px 16px 14px; cursor:pointer;
    background:linear-gradient(165deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    transition:all .35s ease; overflow:hidden; }
  .girl::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg,var(--accent),var(--accent2)); opacity:0; transition:opacity .3s; }
  .girl.on{ border-color:var(--accent);
    background:linear-gradient(165deg, rgba(224,122,127,.14), rgba(255,255,255,.02));
    box-shadow:0 14px 40px -18px rgba(224,122,127,.6); }
  .girl.on::before{ opacity:1; }
  .girl .nm{ font-family:var(--serif); font-size:16px; letter-spacing:.16em; color:var(--ink); margin-bottom:8px; }
  .girl.on .nm{ color:var(--accent); }
  .girl .desc{ font-size:11px; line-height:1.85; color:var(--ink2); }
  .girl .tag{ display:inline-block; margin-top:9px; font-size:9px; letter-spacing:.3em; color:var(--accent2);
    border:1px solid rgba(216,180,138,.4); padding:2px 10px; border-radius:999px; }
  .sel-mark{ position:absolute; right:12px; top:10px; width:17px; height:17px; border-radius:50%;
    border:1px solid var(--line); color:transparent; font-size:10px; display:flex; align-items:center; justify-content:center;
    transition:all .3s; }
  .girl.on .sel-mark{ background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 12px rgba(224,122,127,.8); }

  .chiprow{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:6px 0 14px; }
  .chip{ cursor:pointer; border:1px solid var(--line); border-radius:999px; padding:6px 16px; font-size:12px;
    letter-spacing:.08em; color:var(--ink2); transition:all .25s ease; background:rgba(255,255,255,.02); }
  .chip.on{ color:#fff; border-color:var(--accent);
    background:linear-gradient(180deg, rgba(224,122,127,.35), rgba(224,122,127,.12));
    box-shadow:0 0 18px -4px rgba(224,122,127,.5); }
  .hintline{ text-align:center; font-size:10px; letter-spacing:.2em; color:var(--ink3); margin-bottom:6px; }

  .stinfo{ max-width:600px; margin:0 auto 12px; border:1px solid var(--line); border-radius:12px;
    padding:10px 14px 11px; background:rgba(0,0,0,.18); }
  .si-row{ display:flex; align-items:flex-start; gap:10px; padding:3px 0; }
  .si-row + .si-row{ border-top:1px dashed rgba(255,255,255,.09); margin-top:4px; padding-top:7px; }
  .si-row .lab{ flex:none; width:52px; font-size:10px; letter-spacing:.34em; color:var(--ink3); padding-top:4px; }
  .si-row .bds{ display:flex; flex-wrap:wrap; gap:6px; }
  .bd{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:2px 10px; font-size:10.5px;
    letter-spacing:.05em; background:rgba(255,255,255,.03); border:1px solid var(--line); }
  .bd.ok{ color:var(--ok); border-color:rgba(220,192,138,.4); }
  .bd.no{ color:var(--no); border-color:rgba(208,144,144,.35); }
  .bd.none{ color:var(--ink3); }

  .scorebox{ max-width:720px; margin:0 auto 2px; }
  .scorehead{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .scorehead label{ font-size:9px; letter-spacing:.42em; color:var(--ink3); }
  .scorehead em{ font-style:normal; color:var(--accent2); font-weight:600; font-size:13px;
    font-family:var(--serif); letter-spacing:.08em; }
  .scorebox input[type=range]{ width:100%; accent-color:var(--accent); height:22px; cursor:pointer; }
  .scorecap{ text-align:center; font-size:9px; letter-spacing:.2em; color:var(--ink3); margin-top:2px; }

  /* 实时组合条（允许换行，避免被裁） */
  .live{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; row-gap:4px; margin:16px 0 2px; padding:8px 14px;
    border:1px solid rgba(216,180,138,.28); border-radius:999px;
    background:linear-gradient(90deg, rgba(216,180,138,.10), transparent 60%);
    font-size:11.5px; color:var(--ink2); letter-spacing:.05em; }
  .live::before{ content:"◆"; color:var(--accent); font-size:9px; }
  .live b{ color:var(--accent2); font-weight:600; margin:0 3px; }

  /* 确认卡 */
  .sum{ max-width:760px; margin:0 auto; border:1px solid var(--line); border-radius:12px;
    background:rgba(0,0,0,.18); padding:20px 26px; font-size:14px; line-height:2.2; letter-spacing:.06em; }
  .sum .r{ display:flex; justify-content:space-between; gap:16px; border-bottom:1px dashed rgba(255,255,255,.12); }
  .sum .r:last-child{ border-bottom:none; }
  .sum .k{ color:var(--ink3); letter-spacing:.3em; font-size:11px; flex:none; }
  .sum b{ color:var(--ink); font-family:var(--serif); letter-spacing:.06em; text-align:right; }

  /* 底部前进/后退（纯文档流内普通按钮） */
  .nav{ display:flex; align-items:center; justify-content:space-between; margin-top:20px; gap:12px; }
  .navbtn{ font-family:var(--serif); letter-spacing:.3em; color:var(--ink2); background:none;
    border:1px solid rgba(255,255,255,.14); cursor:pointer; font-size:13px; padding:8px 18px; border-radius:999px;
    transition:color .2s, border-color .2s, background .2s; }
  .navbtn:hover{ color:var(--accent); border-color:rgba(224,122,127,.6); }
  .navbtn.next{ color:var(--accent2); }
  .navbtn.hidden{ display:none !important; }

  .note{ min-height:16px; margin-top:8px; text-align:center; font-size:10px; letter-spacing:.08em; color:var(--no); }
  .hidden{ display:none !important; }

  /* 二次确认浮层（覆盖层，不参与文档流，不影响裁剪） */
  .ov{ position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:20px;
    background:rgba(10,6,5,.66); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .ov.open{ display:flex; }
  .ovbox{ width:min(560px,94vw); border:1px solid rgba(216,180,138,.4); border-radius:14px; padding:22px 24px;
    background:linear-gradient(165deg, #2a1f18, #1a120e); box-shadow:0 30px 80px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.4);
    animation:vu .35s ease both; }
  .ov h3{ font-family:var(--serif); letter-spacing:.4em; text-align:center; color:var(--accent2); margin:0 0 14px; font-size:16px; }
  .ov .sum{ font-size:12.5px; }
  .ov-actions{ display:flex; gap:10px; justify-content:center; margin-top:18px; }
  .ov .small{ font-size:10px; color:var(--ink3); letter-spacing:.06em; margin-top:14px; text-align:center; min-height:14px; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink2); }
  .btn-ghost:hover{ border-color:var(--ink3); color:var(--ink); }

  @media (max-width:760px){
    .wrap{ padding:16px 16px 20px; }
    .logo{ font-size:12px; letter-spacing:.16em; }
    .seal{ width:28px; height:28px; font-size:12px; }
    .stepdot{ width:18px; height:18px; font-size:9px; } .stseg{ width:8px; }
    .stcap{ display:none; }
    .big{ font-size:22px; }
    .stageline{ font-size:13px; letter-spacing:.14em; }
    .stageline .sep{ margin:0 6px; }
    .pair{ grid-template-columns:1fr; max-width:520px; }
    .h2{ font-size:16px; }
    .field{ max-width:100%; }
    .scorebox,.stinfo,.sum{ max-width:100%; }
    .scr.in>*{ animation:none; }
  }
  @media (max-width:480px){
    .big{ font-size:17px; letter-spacing:.12em; }
    .stageline{ font-size:11.5px; letter-spacing:.1em; }
    .startbtn{ padding:11px 26px; font-size:13px; }
    .chip{ padding:5px 11px; font-size:11px; }
    .logo b{ display:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <span class="seal">開</span>
    <div class="logo">什么？！又考好了？<b>天呐…又要做那种事了</b></div>
    <div class="steps" id="steps"></div>
    <div class="stcap" id="stcap"></div>
  </div>

  <div class="screens">
    <section class="scr in">
      <div class="big"><small>—— 開 局 選 択 ——</small>分数越高，能<span class="hl">索求</span>的就越深——</div>
      <div class="stageline">手交<span class="sep">·</span>口交<span class="sep">·</span>乳交<span class="sep">·</span><span class="hl">完全接纳</span></div>
      <div class="tagline">—— 只 要 成 绩 好 ， 就 能 跟 妈 妈 索 求 …… ——</div>
      <div class="cta"><button class="startbtn" id="begin">开 始</button></div>
    </section>

    <section class="scr">
      <h2 class="h2">基 础 设 定</h2>
      <div class="field"><label>姓 名</label><input class="inp" id="f-name" placeholder="儿子的名字"></div>
      <div class="field"><label>年 龄</label><input class="inp" id="f-age" placeholder="如 17 岁"></div>
      <div class="field"><label>外 貌 · 性 格</label><input class="inp" id="f-look" placeholder="外貌特征、性格倾向…"></div>
    </section>

    <section class="scr">
      <h2 class="h2">母 亲 风 格</h2>
      <div class="pair" id="m-pair"></div>
    </section>

    <section class="scr">
      <h2 class="h2">角 色 与 阶 段</h2>
      <div class="hintline">加入角色（可都不选）</div>
      <div class="chiprow"><span class="chip" id="c-bro">弟弟</span><span class="chip" id="c-dad">爸爸</span></div>
      <div class="hintline">初始阶段 · 审核机制锁定成绩区间</div>
      <div class="chiprow" id="stage-chips"></div>
      <div class="stinfo" id="st-info"></div>
      <div class="scorebox">
        <div class="scorehead"><label>初始总成绩</label><em id="f-score-num">600 / 750</em></div>
        <input type="range" id="f-score" min="600" max="750" step="1" value="600">
        <div class="scorecap" id="f-score-cap"></div>
      </div>
    </section>

    <section class="scr">
      <h2 class="h2">确 认 开 局</h2>
      <div class="sum" id="sum"></div>
      <div class="cta"><button class="startbtn" id="go">进 入 本 开 局</button></div>
    </section>
  </div>

  <div class="live hidden" id="live"></div>
  <div class="nav">
    <button class="navbtn" id="nav-prev">‹ 上一步</button>
    <button class="navbtn next" id="nav-next">下一步 ›</button>
  </div>
  <div class="note" id="note"></div>
</div>

<div class="ov" id="ov">
  <div class="ovbox">
    <h3>— 確 認 開 始 —</h3>
    <div class="sum" id="ov-sum"></div>
    <div class="ov-actions">
      <button class="startbtn btn-ghost" id="ov-no">再 想 想</button>
      <button class="startbtn" id="ov-yes">开 始 游 戏</button>
    </div>
    <div class="small" id="ov-msg"></div>
  </div>
</div>

<script>
/* ============ 桥（TavernHelper）：切换消息 0 的开场白 swipe ============ */
(function (global) {
  'use strict';
  function scope(name) {
    var candidates = [global];
    try { if (global.parent && global.parent !== global) { candidates.push(global.parent); } } catch (_) {}
    try { if (global.top && candidates.indexOf(global.top) === -1) { candidates.push(global.top); } } catch (_) {}
    for (var i = 0; i < candidates.length; i++) {
      try { if (candidates[i] && candidates[i][name] !== undefined) { return candidates[i][name]; } } catch (_) {}
    }
    return undefined;
  }
  function helperCall(name) {
    var h = scope('TavernHelper');
    if (h && typeof h[name] === 'function') { return h[name].bind(h); }
    var d = scope(name);
    return typeof d === 'function' ? d : null;
  }
  async function selectGreeting(swipeId) {
    var index = Number(swipeId);
    if (!Number.isInteger(index) || index < 1) { throw new Error('开场编号无效'); }
    var getMessages = helperCall('getChatMessages');
    if (!getMessages) { throw new Error('当前环境不支持读取开场白（无 getChatMessages）'); }
    var messages = await getMessages(0, { include_swipes: true });
    var first = messages && messages[0];
    if (!first || !Array.isArray(first.swipes) || first.swipes[index] == null) {
      throw new Error('所选开场不存在（槽位 ' + index + '）');
    }
    // 优先：酒馆助手风格 API setChatMessages([{message_id,swipe_id}])
    var setMessages = helperCall('setChatMessages');
    if (setMessages) { return setMessages([{ message_id: 0, swipe_id: index }]); }
    // 次选：skill 风格 setChatMessage(text,0,{swipe_id,refresh})
    var setMessage = helperCall('setChatMessage');
    if (setMessage) { return setMessage(String(first.swipes[index]), 0, { swipe_id: index, refresh: 'display_and_render_current' }); }
    throw new Error('当前环境不支持切换开场（找不到 setChatMessage/setChatMessages）');
  }
  async function switchWithText(swipeId, suffix) {
    var index = Number(swipeId);
    if (!Number.isInteger(index) || index < 1) { throw new Error('开场编号无效'); }
    var getMessages = helperCall('getChatMessages');
    if (!getMessages) { throw new Error('当前环境不支持读取开场白（无 getChatMessages）'); }
    var messages = await getMessages(0, { include_swipes: true });
    var first = messages && messages[0];
    if (!first || !Array.isArray(first.swipes) || first.swipes[index] == null) {
      throw new Error('所选开场不存在（槽位 ' + index + '）');
    }
    var setMessage = helperCall('setChatMessage');
    if (setMessage) {
      var text = String(first.swipes[index]);
      if (suffix) { text = text.replace(/\s*$/, '\n' + suffix); }
      try {
        await setMessage(text, 0, { swipe_id: index, refresh: 'display_and_render_current' });
        return { via: 'text' };
      } catch (e) {}
    }
    var setMessages = helperCall('setChatMessages');
    if (setMessages) { await setMessages([{ message_id: 0, swipe_id: index }]); return { via: 'switch' }; }
    throw new Error('当前环境不支持切换开场（找不到 setChatMessage/setChatMessages）');
  }
  global.MyCardBridgeV1 = Object.freeze({ version: 1, selectGreeting: selectGreeting, switchWithText: switchWithText });
})(globalThis);
</script>

<script>
/* ============ 集中配置（C11） ============ */
var MOMS = {
  A: {
    nm: '温柔腼腆 · 内心抗拒母亲',

/* ---------- 变量同步（跳转后写楼层 user 姓名/总成绩，含防覆盖重试） ---------- */
function findWin(pred){
  var w = window, depth = 0;
  while (w && depth < 12) {
    try { if (pred(w)) { return w; } } catch (e) {}
    if (w === w.parent) { break; }
    w = w.parent; depth++;
  }
  return null;
}
function gl(name){
  var w = findWin(function (x) { try { return typeof x[name] !== 'undefined'; } catch (e) { return false; } });
  return w ? w[name] : undefined;
}
function patchMvu(name, score, slot){
  var M = gl('Mvu');
  if (!M) { return; }
  var lastWrite = 0;
  function writeOnce(){
    var now = Date.now();
    if (now - lastWrite < 800) { return; }
    lastWrite = now;
    ['latest', 0].forEach(function (mid) {
      try {
        var d = M.getMvuData({ type: 'message', message_id: mid });
        if (d && d.stat_data && d.stat_data.user) {
          var u = d.stat_data.user;
          if (name) { u['姓名'] = name; }
          u['总成绩值'] = clamp(Math.round(score) || 230, 0, 750);
          try { if (!d.stat_data['考试']) { d.stat_data['考试'] = {}; } var ii = STAGES.findIndex(function (s) { return s.key === state.st; }); d.stat_data['考试']['已通过阶段数'] = ii < 0 ? 0 : ii; d.stat_data['考试']['状态'] = '禁用'; d.stat_data['考试']['目标阶段'] = ''; d.stat_data['考试']['失败标记天'] = 0; } catch (e) {}
          M.replaceMvuData(d, { type: 'message', message_id: mid }).then(function () {
            try {
              var chk = M.getMvuData({ type: 'message', message_id: mid });
              var cv = chk && chk.stat_data && chk.stat_data.user ? chk.stat_data.user['总成绩值'] : null;
              console.info('[开局] 已写入 楼层', mid, '总成绩=', cv, '(目标', score + ')');
            } catch (e) {}
          }).catch(function () {});
        }
      } catch (e) {}
    });
  }
  writeOnce();
  var attempts = 0;
  function reapply(){
    writeOnce();
    if (++attempts < 8) { setTimeout(reapply, 600); }
  }
  setTimeout(function () { reapply(); }, 600);
  setTimeout(function () { reapply(); }, 1600);
  try {
    var pw = window.parent || window;
    if (pw && pw.addEventListener) { pw.addEventListener('mag_variable_update_ended', writeOnce); }
  } catch (e) {}
  var guard = 0;
  var finalTimer = setInterval(function () {
    guard++;
    var finalVal = null;
    try {
      var d0 = M.getMvuData({ type: 'message', message_id: 0 });
      if (d0 && d0.stat_data && d0.stat_data.user) { finalVal = d0.stat_data.user['总成绩值']; }
    } catch (e) {}
    if (finalVal !== null) {
      clearInterval(finalTimer);
      var target = clamp(Math.round(score) || 230, 0, 750);
      if (Number(finalVal) !== target) {
        notify('⚠ 成绩写入不稳定：目标 ' + target + '，状态栏显示 ' + finalVal, true);
      } else {
        notify('✓ 已确认状态栏成绩 = ' + finalVal);
      }
    } else if (guard > 12) { clearInterval(finalTimer); }
  }, 900);
}

/* ---------- 主窗口变量写入/校验（不依赖楼层面板存活） ---------- */
function topWin(){ var w = window; while (w && w.parent && w.parent !== w) { w = w.parent; } return w; }
function applyMain(score, name){
  var M = gl('Mvu');
  var target = clamp(Math.round(score) || 230, 0, 750);
  var nameEsc = (name || '').replace(/['"\\]/g, '');
  var stIdx = (function () { var i = STAGES.findIndex(function (s) { return s.key === state.st; }); return i < 0 ? 0 : i; })();
  var mm = MOM_META[state.mom] || MOM_META.A;
  var mmName = mm.name.replace(/['"\\]/g, '');
  var mmType = mm.type.replace(/['"\\]/g, '');
  var mmVoice = mm.voice.replace(/['"\\]/g, '');
  var fbro = state.bro ? '有' : '无';
  var fdad = state.dad ? '有' : '无';
  var preCmd = "_.set('妈妈.姓名','" + mmName + "');_.set('妈妈.类型','" + mmType + "');_.set('妈妈.心里话','" + mmVoice + "');_.set('家庭人物.弟弟','" + fbro + "');_.set('家庭人物.爸爸','" + fdad + "');_.set('答题状态','禁用');_.set('user.精力值',100);_.set('user.智商值',1);_.set('user.D加成',0.2);_.set('user.零花钱',0);_.set('user.最后领取日',0);_.set('user.奖励次数',0);_.set('奖励.存储',[]);";
  /* 首选：走真实 MVU 管道（parseMessage→replaceMvuData），该层不会被渲染校验覆盖 */
  if (M && typeof M.parseMessage === 'function' && typeof M.getMvuData === 'function' && typeof M.replaceMvuData === 'function') {
    var cmd = preCmd + "_.set('user.总成绩值', " + target + ");" + (nameEsc ? "_.set('user.姓名', '" + nameEsc + "');" : "") + "_.set('考试.已通过阶段数', " + stIdx + ");_.set('考试.状态','禁用');_.set('考试.目标阶段','');_.set('考试.失败标记天',0);";
    ['latest', 0].forEach(function (mid) {
      try {
        var old = M.getMvuData({ type: 'message', message_id: mid });
        M.parseMessage(cmd, old).then(function (nw) {
          if (nw) { try { M.replaceMvuData(nw, { type: 'message', message_id: mid }); } catch (e) {} }
        }).catch(function () {});
      } catch (e) {}
    });
    return true;
  }
  /* 兜底：主窗口 updateVariablesWith */
  var top = topWin();
  var setter = top.updateVariablesWith || null;
  function mutate(v){
    v = v || {};
    var root = (v.stat_data && v.stat_data.user) ? v.stat_data : (v.user ? v : null);
    if (!root && v.stat_data) { root = v.stat_data; }
    if (root) { if (!root.user) { root.user = {}; } var u = root.user; if (nameEsc) { u['姓名'] = nameEsc; } u['总成绩值'] = target; }
    else { if (!v.stat_data) { v.stat_data = {}; } if (!v.stat_data.user) { v.stat_data.user = {}; } if (nameEsc) { v.stat_data.user['姓名'] = nameEsc; } v.stat_data.user['总成绩值'] = target; }
    try { var eo = v.stat_data ? v.stat_data : v; if (!eo['考试']) { eo['考试'] = {}; } eo['考试']['已通过阶段数'] = stIdx; eo['考试']['状态'] = '禁用'; eo['考试']['目标阶段'] = ''; eo['考试']['失败标记天'] = 0;
      eo['妈妈'] = { '姓名': mmName, '类型': mmType, '心里话': mmVoice };
      eo['家庭人物'] = { '弟弟': fbro, '爸爸': fdad };
      eo['答题状态'] = '禁用';
      if (eo['user']) { eo['user']['精力值'] = 100; eo['user']['智商值'] = 1; eo['user']['D加成'] = 0.2; eo['user']['零花钱'] = 0; eo['user']['最后领取日'] = 0; eo['user']['奖励次数'] = 0; }
      eo['奖励'] = { '存储': [] };
    } catch (e) {}
    return v;
  }
  if (setter) {
    try { setter(mutate, { type: 'message', message_id: 0 }); } catch (e) {}
    try { setter(mutate, { type: 'message', message_id: 'latest' }); } catch (e) {}
  }
  return !!setter;
}

    byId(id).addEventListener('input', function(){ if (this.value) { this.classList.remove('ph'); } save(); });
  });
  byId('c-bro').addEventListener('click', function(){ state.bro = !state.bro; this.classList.toggle('on', state.bro); save(); refreshLive(); });
  byId('c-dad').addEventListener('click', function(){ state.dad = !state.dad; this.classList.toggle('on', state.dad); save(); refreshLive(); });
  var fscore = byId('f-score');
  fscore.addEventListener('input', function(){ paintScore(); refreshLive(); });
  fscore.addEventListener('change', function(){ save(); setNote(''); });

  byId('begin').addEventListener('click', function(){ go(1); });
  byId('nav-prev').addEventListener('click', function(){ go(Math.max(0, idx - 1)); });
  byId('nav-next').addEventListener('click', function(){ go(idx + 1); });
  byId('go').addEventListener('click', function(){ save(); openOv(); });
  byId('ov-no').addEventListener('click', closeOv);
  byId('ov-yes').addEventListener('click', finish);

  renderMoms();
  renderChips();
  restore();
  document.querySelectorAll('.girl').forEach(function(x){ x.classList.toggle('on', x.dataset.m === state.mom); });
  byId('c-bro').classList.toggle('on', state.bro);
  byId('c-dad').classList.toggle('on', state.dad);
  setStage(state.st, false);
  stepsDraw();
})();
</script>
</body>
</html>
