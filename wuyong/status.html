.cmns-hud .metric-label{font-size:10.5px; color:var(--ink-2); letter-spacing:.1em; white-space:nowrap; cursor:help}

}

.cmns-hud .card.open::after{opacity:1}

`;

  /* ── 工具 ─────────────────────────────────────────────────────── */
  function num(v, d) { const n = Number(v); return Number.isFinite(n) ? n : d; }
  function clampPct(v) { return Math.max(0, Math.min(100, num(v, 0))); }
  function txt(v, d) { return v == null ? d : (typeof v === 'string' ? v : String(v)); }
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function storeKey(suffix) {
    let cid = '';
    try {
      cid = (window.SillyTavern && SillyTavern.getCurrentChatId)
        ? SillyTavern.getCurrentChatId() : '';
    } catch (e) {}
    return NS + ':' + suffix + ':' + (cid || 'default');
  }
  function readOpen() { try { return localStorage.getItem(storeKey('open')) !== '0'; } catch (e) { return true; } }
  function writeOpen(v) { try { localStorage.setItem(storeKey('open'), v ? '1' : '0'); } catch (e) {} }

  /* ── 数据读取（只读，不初始化、不修复） ───────────────────────── */
  function lastMesId() {
    try {
      if (typeof getLastMessageId === 'function') {
        const id = getLastMessageId();
        if (id != null && id !== '') return Number(id);
      }
    } catch (e) {}
    const all = DOC.querySelectorAll('#chat .mes');
    const last = all[all.length - 1];
    const m = last && (last.getAttribute('mesid') || last.getAttribute('data-mesid'));
    return m != null ? Number(m) : null;
  }

  function pickStat(obj) {
    if (!obj) return null;
    if (obj.stat_data && obj.stat_data['人物']) return obj.stat_data;
    if (obj['人物']) return obj;
    if (Array.isArray(obj)) {
      for (let i = obj.length - 1; i >= 0; i--) {
        const hit = pickStat(obj[i]);
        if (hit) return hit;
      }
    }
    return null;
  }

  function readState() {
    const id = lastMesId();
    const ids = [];
    if (id != null) ids.push(id);
    ids.push(0);
    const tries = [];
    ids.forEach(function (mid) {
      tries.push(function () {
        return typeof getVariables === 'function'
          ? getVariables({ type: 'message', message_id: mid }) : null;
      });
      tries.push(function () {
        return (window.Mvu && typeof Mvu.getMvuData === 'function')
          ? Mvu.getMvuData({ type: 'message', message_id: mid }) : null;
      });
    });
    tries.push(function () {
      return typeof getVariables === 'function' ? getVariables({ type: 'chat' }) : null;
    });
    tries.push(function () {
      return (window.Mvu && typeof Mvu.getMvuData === 'function') ? Mvu.getMvuData({ type: 'chat' }) : null;
    });
    for (const t of tries) {
      try { const hit = pickStat(t()); if (hit) return hit; } catch (e) {}
    }
    return null;
  }

  function signatureOf(data) {
    if (!data) return 'null';
    try { return JSON.stringify(data); } catch (e) { return String(Date.now()); }
  }

  /* ── 指令与发送 ───────────────────────────────────────────────── */
  function cmdInject(name, text) { return '[常识修改 ' + name + ': ' + text + ']'; }
  function cmdToggle(name, id) { return '[关闭常识 ' + name + ': ' + id + ']'; }
  function cmdRevoke(name, id) { return '[撤回常识 ' + name + ': ' + id + ']'; }

  function sendToTavern(cmd) {
    const ta = parent.document.querySelector('#send_textarea');
    if (!ta) return { ok: false, reason: 'no-input' };
    const current = String(ta.value || '').trim();
    const merged = current ? (current + '\n' + cmd) : cmd;
    try {
      const proto = window.HTMLTextAreaElement && window.HTMLTextAreaElement.prototype;
      const setter = proto && Object.getOwnPropertyDescriptor(proto, 'value').set;
      if (setter) setter.call(ta, merged); else ta.value = merged;
    } catch (e) { ta.value = merged; }
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    ta.focus();
    const btn = parent.document.querySelector('#send_but');
    if (!btn) return { ok: false, reason: 'no-send', cmd: cmd };
    btn.click();
    return { ok: true, keptExisting: !!current };
  }

  /* ── 渲染 ─────────────────────────────────────────────────────── */
  function makeBar(value) {
    const wrap = el('div', 'bar');
    const fill = el('i');
    fill.style.width = clampPct(value) + '%';
    wrap.appendChild(fill);
    wrap.setAttribute('role', 'progressbar');
    wrap.setAttribute('aria-valuemin', '0');
    wrap.setAttribute('aria-valuemax', '100');
    wrap.setAttribute('aria-valuenow', String(Math.round(clampPct(value))));
    return wrap;
  }

  function makeCard(name, axis, sys) {
    const card = el('div', 'card');
    card.setAttribute('aria-label', name + ' 状态')

    const img = el('img', 'ava');
    img.alt = name;
    img.loading = 'lazy';
    if (AVATAR[name]) img.src = AVATAR[name];
    img.addEventListener('click', function (ev) { ev.stopPropagation(); });
    card.appendChild(img);

    const who = el('div', 'who');
    who.appendChild(el('div', 'name', name));
    if (ROLE[name]) who.appendChild(el('div', 'role', ROLE[name]));

    const axes = el('div', 'axes');
    [['好感', num(axis && axis['好感度'], 0)],
     ['羞耻', num(axis && axis['羞耻'], 0)],
     ['欲望', num(axis && axis['欲望'], 0)]].forEach(function (r) {
      const row = el('div', 'axis');
      row.dataset.k = r[0];
      row.appendChild(el('span', 'axis-k', r[0]));
      row.appendChild(makeBar(r[1]));
      row.appendChild(el('span', 'axis-v', String(Math.round(clampPct(r[1])))));
      axes.appendChild(row);
    });
    who.appendChild(axes);
    card.appendChild(who);

    const voice = el('div', 'voice', txt(axis && axis['心声'], ''));
    card.appendChild(voice);

    /* ── 台账 ── */
    const log = (sys && sys['修改日志'] && Array.isArray(sys['修改日志'][name]))
      ? sys['修改日志'][name] : [];
    const live = log.filter(function (r) { return r && r['状态'] !== '已撤回'; });
    const active = live.filter(function (r) { return r['启用'] !== false && r['状态'] !== '已关闭'; });

    const box = el('div', 'inject');
    const meta = el('div', 'inject-meta');
    meta.appendChild(el('span', null, '生效 '));
    meta.appendChild(el('b', null, String(active.length)));
    meta.appendChild(el('span', null, ' 条 · 剩 '));
    meta.appendChild(el('b', null, String(Math.round(num(sys && sys['可用次数'], num(sys && sys['充能池'], 0))))));
    meta.appendChild(el('span', null, ' 次'));
    box.appendChild(meta);



    const hint = el('div', 'inject-hint');
    box.appendChild(hint);

    const ledger = el('div', 'ledger');
    if (!live.length) {
      ledger.appendChild(el('div', 'ledger-empty', '还没有常识灌进她脑子里。'));
    } else {
      live.slice(-6).forEach(function (r) {
        const rule = el('div', 'rule');
        const off = (r['启用'] === false || r['状态'] === '已关闭');
        rule.dataset.off = off ? '1' : '0';
        rule.appendChild(el('span', 'no', String(num(r['id'], 0))));
        const t = el('span', 'txt', txt(r['内容'], ''));
        t.title = txt(r['内容'], '');
        rule.appendChild(t);

        const bT = el('button', null, off ? '开' : '关');
        bT.type = 'button';
        bT.disabled = !active.length && off ? false : false;
        bT.addEventListener('click', function (ev) {
          ev.stopPropagation();
          act(cmdToggle(name, num(r['id'], 0)), bT, off ? '已请求开启…' : '已请求关闭…');
        });
        rule.appendChild(bT);

        const bR = el('button', null, '撤');
        bR.type = 'button';
        bR.addEventListener('click', function (ev) {
          ev.stopPropagation();
          act(cmdRevoke(name, num(r['id'], 0)), bR, '已请求撤回…');
        });
        rule.appendChild(bR);
        ledger.appendChild(rule);
      });
    }
    box.appendChild(ledger);
    card.appendChild(box);

    let busy = false;
    function act(cmd, button, okMsg) {
      if (busy) return;
      busy = true;
      button.disabled = true;
      const res = sendToTavern(cmd);
      if (!res.ok) {
        hint.className = 'inject-hint warn';
        hint.textContent = res.reason === 'no-input'
          ? '找不到聊天输入框，请手动发送：' + cmd
          : '找不到发送按钮，命令已填进输入框，请手动发送。';
        busy = false; button.disabled = false;
        return;
      }
      hint.className = 'inject-hint ok';
      hint.textContent = okMsg + (res.keptExisting ? '（你输入框原有的内容已保留在前面）' : '');
      setTimeout(function () { busy = false; button.disabled = false; }, 1200);
    }



    return card;
  }

  function injectBar() {
    const bar = el('div', 'inject-bar');
    const sel = el('select', 'inject-who');
    PERSONS.forEach(function (n) { const o = el('option', null, n); o.value = n; sel.appendChild(o); });
    const inp = el('input', 'inject-text');
    inp.type = 'text'; inp.maxLength = 80; inp.placeholder = '写一句认知指令（消耗 1 次充能注入）';
    const btn = el('button', 'inject-go', '注入常识');
    btn.type = 'button';
    const msg = el('div', 'inject-msg');
    btn.addEventListener('click', function () {
      const who = sel.value;
      const text = String(inp.value || '').trim();
      if (!text) { msg.className = 'inject-msg warn'; msg.textContent = '先写一句要她相信的话。'; return; }
      if (text.length > 80) { msg.className = 'inject-msg warn'; msg.textContent = '太长了，别超过 80 字。'; return; }
      const r = sendToTavern(cmdInject(who, text));
      if (!r.ok) { msg.className = 'inject-msg warn'; msg.textContent = '发送失败：' + r.reason; return; }
      inp.value = '';
      msg.className = 'inject-msg ok';
      msg.textContent = '已送出，等这一轮结算。';
    });
    bar.appendChild(sel); bar.appendChild(inp); bar.appendChild(btn); bar.appendChild(msg);
    return bar;
  }

  function build(data) {
    const root = el('div', NS);
    const sys = (data && data[SYS]) || {};

    const head = el('div', 'hud-head');
    head.tabIndex = 0;
    head.setAttribute('role', 'button');
    const titleWrap = el('div', 'hud-title');
    titleWrap.appendChild(el('span', 'cn', TITLE));
    titleWrap.appendChild(el('span', 'en', 'Common Sense'));
    head.appendChild(titleWrap);

    const metrics = el('div', 'hud-metrics');
    const shame = clampPct(sys['羞辱值']);

    const mShame = el('div', 'metric');
    const lblShame = el('span', 'metric-label', '羞辱');
    lblShame.title = '攒满 100 换 1 次注入机会（受辱充能模式）';
    mShame.appendChild(lblShame);
    mShame.appendChild(makeBar(shame));
    mShame.appendChild(el('span', 'metric-num', String(Math.round(shame))));
    metrics.appendChild(mShame);

    const mPool = el('div', 'metric');
    const lblPool = el('span', 'metric-label', '充能');
    lblPool.title = '已攒到的注入次数';
    mPool.appendChild(lblPool);
    const pips = el('div', 'pips');
    const pool = Math.max(0, Math.min(POOL_MAX, num(sys['充能池'], 0)));
    for (let i = 0; i < POOL_MAX; i++) pips.appendChild(el('span', i < pool ? 'pip on' : 'pip'));
    mPool.appendChild(pips);
    metrics.appendChild(mPool);

    const mToday = el('div', 'metric');
    const lblToday = el('span', 'metric-label', '今日');
    lblToday.title = '今天累计获得的羞辱值 / 每日上限';
    mToday.appendChild(lblToday);
    mToday.appendChild(el('span', 'metric-num',
      Math.round(num(sys['本日获取'], 0)) + '/' + Math.round(num(sys['本日上限'], 0))));
    metrics.appendChild(mToday);

    const mTime = el('div', 'metric');
    const lblTime = el('span', 'metric-label', '时间');
    mTime.appendChild(lblTime);
    const tm = (data && data['时间']) || {};
    mTime.appendChild(el('span', 'metric-num', (tm['日期'] || '—') + ' · ' + (tm['时段'] || '—')));
    metrics.appendChild(mTime);
    head.appendChild(metrics);

    const toggleLabel = el('span', 'hud-toggle', '收起');
    head.appendChild(toggleLabel);

    const body = el('div', 'hud-body');
    const cast = el('div', 'cast');
    const people = (data && data['人物']) || {};
    PERSONS.forEach(function (n) { cast.appendChild(makeCard(n, people[n], sys)); });
    body.appendChild(cast);
    body.appendChild(injectBar());

    const foot = el('div', 'hud-foot');
    foot.appendChild(el('span', null, '本轮注入 '));
    foot.appendChild(el('b', null, Math.round(num(sys['本轮已注入'], 0)) + '/' + Math.max(1, num(sys['单轮注入上限'], 1))));
    foot.appendChild(el('span', null, '可用次数 '));
    foot.appendChild(el('b', null, String(Math.round(num(sys['可用次数'], 0)))));
    body.appendChild(foot);

    root.appendChild(head);
    root.appendChild(body);

    let open = readOpen();
    body.hidden = !open;
    toggleLabel.textContent = open ? '收起' : '展开';
    head.setAttribute('aria-expanded', open ? 'true' : 'false');

    function flip() {
      open = !open;
      body.hidden = !open;
      toggleLabel.textContent = open ? '收起' : '展开';
      head.setAttribute('aria-expanded', open ? 'true' : 'false');
      writeOpen(open);
    }
    head.addEventListener('click', flip);
    head.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); flip(); }
    });
    return root;
  }

  function emptyState() {
    const box = el('div', NS);
    const note = el('div', 'hud-empty');
    note.appendChild(el('b', null, '状态未就位 · '));
    note.appendChild(DOC.createTextNode(
      '这一层还没有变量。发出第一条回复、或等模型写出变量更新块后，四人状态会出现在这里。'));
    box.appendChild(note);
    return box;
  }

  /* ── 文档：优先 jQuery body 的 ownerDocument（iframe 场景下指向父页面） ── */
  

function getMid(){try{if(typeof getCurrentMessageId==='function')return getCurrentMessageId()}catch(e){}try{var f=window.frameElement;if(f){var m=f.closest('.mes');if(m)return Number(m.getAttribute('mesid'))}}catch(e){}return null}
function readStat(id){
  try{var t=parent.TavernHelper||window.TavernHelper;if(t&&typeof t.getVariables==='function'){var v=t.getVariables({type:'message',message_id:id});if(v&&v.stat_data)return v.stat_data}}catch(e){}
  try{var M=parent.Mvu;if(M&&typeof M.getMvuData==='function'){var d=M.getMvuData({type:'message',message_id:id});if(d&&d.stat_data)return d.stat_data}}catch(e){}
  try{var c=parent.SillyTavern.getContext();var m=c.chat[id];var vv=m&&m.variables&&m.variables[m.swipe_id||0];if(vv&&vv.stat_data)return vv.stat_data}catch(e){}
  return null;
}
function render(){
  var mid=getMid();if(mid==null)return;
  var st=readStat(mid);if(!st)return;
  var old=document.querySelector('.cmns-hud');
  var node=build(st);
  if(old)old.replaceWith(node);else document.body.appendChild(node);
}
render();
setTimeout(render,600);setTimeout(render,1800);
try{var t=parent.TavernHelper;if(t&&t.eventOn){t.eventOn('mag_variable_update_ended',function(){setTimeout(render,120)});t.eventOn('mag_variable_initialized',function(){setTimeout(render,120)});}}catch(e){}
setInterval(render,3000);

})();
</script>
