  /* 同步写：多处镜像一起更新（旧值防反噬思路：只写目标路径） */

      if (win && win.Mvu) {

          var obj = null, cur = null;

            wrap[parts[i]] = obj;
            obj = wrap;
          }
          win.Mvu.update(obj);
        }
        // data 树
        if (win.Mvu.data) {
          var d = win.Mvu.data;
          for (var j = 0; j < parts.length - 1; j++) {
            if (!d[parts[j]] || typeof d[parts[j]] !== 'object') d[parts[j]] = {};
            d = d[parts[j]];
          }
          d[parts[parts.length - 1]] = value;
        }
        if (win.Mvu.data_service && win.Mvu.data_service.vars) {
          var v = win.Mvu.data_service.vars;
          for (var k = 0; k < parts.length - 1; k++) {
            if (!v[parts[k]] || typeof v[parts[k]] !== 'object') v[parts[k]] = {};
            v = v[parts[k]];
          }
          v[parts[parts.length - 1]] = value;
        }
        if (typeof win.Mvu.save === 'function') { try { win.Mvu.save(); } catch (e) {} }
      }
    } catch (e) {}
    try {

    } catch (e) {}

  function qHTML(q) {
    var L = ['A', 'B', 'C', 'D'];
    var out = [];
    for (var i = 0; i < q.opts.length; i++) {
      out.push('<button type="button" class="' + P + '-opt' +
        (SES.locked && i === q.correctIndex ? ' correct' : '') +
        (SES.locked && i === SES.pick ? ' wrong' : '') +
        '" data-a="opt" data-x="' + i + '" ' + (SES.locked ? 'disabled' : '') + '>' +
        '<span>' + L[i] + '. ' + esc(q.opts[i]) + '</span>' +
        (SES.locked && i === q.correctIndex ? '<span>✔</span>' : '') + '</button>');
    }
    return out.join('');
  }

  function pickQuestion(pool) {
    var list = [];
    for (var n = 0; n < pool.length; n++) {
      var raw = pool[n];
      var opts = [raw.c, raw.w[0], raw.w[1], raw.w[2]];
      var order = [0, 1, 2, 3];
      for (var m = order.length - 1; m > 0; m--) {
        var j = Math.floor(Math.random() * (m + 1));
        var t = order[m]; order[m] = order[j]; order[j] = t;
      }
      var ci = order.indexOf(0);
      list.push({
        s: raw.s, t: raw.t,
        opts: order.map(function (o) { return opts[o]; }),
        correctIndex: ci,
        ctext: String.fromCharCode(65 + ci) + '. ' + raw.c
      });
    }
    return list;
  }

  var QZ = { list: [], i: 0, answered: 0, correct: 0, wrong: 0, gain: 0, done: false, A: 1, D: 0.2, frozen: false };

  function clone(v) { return JSON.parse(JSON.stringify(v)); }
  function shuffleArray(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; }
    return r;
  }
  function setDeep(obj, parts, val) {
    if (!obj || !Array.isArray(parts) || !parts.length) return;
    var o = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      if (!o[parts[i]] || typeof o[parts[i]] !== 'object') o[parts[i]] = {};
      o = o[parts[i]];
    }
    o[parts[parts.length - 1]] = val;
  }
  function applyVar(parts, val) {
    writePath(parts, val);
    if (CACHE.raw) { setDeep(CACHE.raw, parts, val); CACHE.S = normalizeS(CACHE.raw); }
    else refresh(true);
  }
  function applyVars(list) { for (var i = 0; i < list.length; i++) applyVar(list[i][0], list[i][1]); }

  /* 做题入口判断：最新正文中妈妈是否邀请/要求做题 */
  function latestAiText() {
    var out = '';
    try {
      var ctx = (HOST.SillyTavern && HOST.SillyTavern.getContext) ? HOST.SillyTavern.getContext() : null;
      if (ctx && Array.isArray(ctx.chat) && ctx.chat.length) {
        for (var i = ctx.chat.length - 1; i >= 0; i--) {
          var m = ctx.chat[i];
          if (m && !m.is_user) { out = m.mes || (m.extra && m.extra.display_text) || ''; break; }
        }
      }
    } catch (e) {}
    if (!out) {
      try {
        var el = qs('#chat .mes:last-child .mes_text');
        if (el) out = el.textContent || '';
      } catch (e) {}
    }
    return out;
  }
  var INVITE_RE = /<学习脚本>|考考你|来做题|做几道题|陪你做题|辅导你|练习题|测验|抽你背|出几道题|问你几道|试卷/;
  function detectInvite() {
    try {
      var txt = latestAiText();
      if (!txt) return false;
      if (INVITE_RE.test(txt)) return true;
    } catch (e) {}
    return false;
  }
  function canQuizNow(S) { return (S.quizState === '允许' || !!S.invite); }
  function canExamNow(S) {
    if (S.examState !== '允许') return false;
    if (S.energy < CONF.examEnergy) return false;
    if (S.examFailDay === S.day) return false;
    return true;
  }

  /* ================= 做题会话 ================= */
  function startQuiz() {
    var S = getS();
    if (!canQuizNow(S)) { toast('妈妈还没有邀请你做题哦', 'warn'); return false; }
    if (S.energy <= 0) { toast('精力为 0，无法做题，先休息恢复吧', 'err'); return false; }
    QZ.list = shuffleArray(NORMAL_POOL).slice(0, CONF.quizPoolMax).map(function (r) { return pickOne(r); });
    QZ.i = 0; QZ.answered = 0; QZ.correct = 0; QZ.wrong = 0; QZ.gain = 0; QZ.done = false;
    QZ.A = S.iq; QZ.D = S.dVal;
    QZ.frozen = S.examState === '允许';
    SES.gain = 0; SES.correct = 0; SES.wrong = 0; SES.left = QZ.list.length; SES.rewards = [];
    return true;
  }
  function pickOne(raw) {
    var opts = [raw.c, raw.w[0], raw.w[1], raw.w[2]];
    var o = shuffleArray([0, 1, 2, 3]);
    return { s: raw.s, t: raw.t, opts: o.map(function (i) { return opts[i]; }), correctIndex: o.indexOf(0), ctext: String.fromCharCode(65 + o.indexOf(0)) + '. ' + raw.c };
  }

  function answerQuiz(idx) {
    if (SES.locked || QZ.done) return;
    var q = QZ.list[QZ.i];
    if (!q) return;
    SES.locked = true; SES.pick = idx;
    var S = getS();
    var right = idx === q.correctIndex;
    SES.feedOk = right;
    // 扣精力（对错都扣 10）
    var nrg = Math.max(0, S.energy - CONF.energyPerQ);
    applyVar(['user', '精力值'], nrg);
    QZ.answered++;
    if (right) {
      var add = round2(QZ.A + QZ.D);
      QZ.correct++; SES.correct = QZ.correct;
      if (!QZ.frozen) { QZ.gain = round2(QZ.gain + add); }
      SES.gain = round2(QZ.gain);
      SES.feedback = '回答正确 +' + add + ' 分';
      SES.feedOk = true;
    } else {
      QZ.wrong++; SES.wrong = QZ.wrong;
      SES.feedback = '回答错误';
      SES.feedOk = false;
    }
    SES.left = Math.max(0, Math.min(QZ.list.length - QZ.answered, Math.floor(nrg / CONF.energyPerQ)));
    if (nrg <= 0) {
      QZ.done = true;
      SES.left = 0;
    }
    renderAllBars();
    redrawView();
  }
  function quizNext() {
    if (QZ.i + 1 >= QZ.list.length) { QZ.done = true; redrawView(); return; }
    QZ.i++;
    SES.locked = false; SES.pick = -1; SES.feedback = '';
    var S = getS();
    SES.left = Math.max(0, Math.min(QZ.list.length - QZ.answered, Math.floor(S.energy / CONF.energyPerQ)));
    redrawView();
  }
  function quitQuiz() {
    QZ.done = true;
    SES.left = 0;
    if (QZ.answered === 0) { toast('一题都还没做，先做一道题才能结算奖励', 'warn'); SES.view = 'quiz'; if (!startQuiz()) { closeWin(); setView('hub'); } redrawView(); return; }
    redrawView();
  }
  // 结算时生成奖励券
  function buildRewards() {
    var S = getS();
    var p = S.examPassed;
    var stIdx = (S.examState === '允许') ? Math.max(0, Math.min(p, 3)) : Math.max(stageByScore(S.score), p);
    if (stIdx > 3) stIdx = 3;
    var pool = REWARD_TOKENS[stIdx].list;
    var stageLabel = STAGES[stIdx].name;
    var tokens = [];
    for (var i = 0; i < QZ.correct; i++) {
      var tk = pool[Math.floor(Math.random() * pool.length)];
      tokens.push({ name: tk.name, stage: stageLabel, guide: tk.guide });
    }
    SES.rewards = tokens;
    return tokens;
  }
  function settleView() {
    if (QZ.answered === 0) { toast('至少做完 1 道题才能结算', 'warn'); return; }
    if (!SES.rewards.length && QZ.correct > 0) buildRewards();
    SES.view = 'settle';
    redrawView();
  }
  // 当前得分（结算时应写入的总成绩增量；考试开放/临界点时冻结为 0）
  function realGain() { return QZ.frozen ? 0 : QZ.gain; }
  // 写入成绩：接近/越过亲密阶段临界点时封顶并自动开放考试
  function applyScoreGain() {
    var S = getS();
    var g = Math.round(realGain());
    if (g === 0) return;
    var p = S.examPassed;
    var b = p < 3 ? STAGE_BOUNDS[p] : 750;
    var ns = S.score + g;
    if (ns >= b) {
      ns = b;
      if (p < 3 && S.examState !== '允许' && S.examFailDay !== S.day) {
        boundCrossed = true;
        QZ.frozen = true;
        applyVar(['考试', '状态'], '允许');
        applyVar(['考试', '目标阶段'], STAGES[p + 1].name);
      }
    }
    applyVar(['user', '总成绩值'], ns);
  }
  // 心跳兜底：模型或他处让成绩越过临界点时，同样冻结并开放考试
  function autoExamGate() {
    var S = refresh(true);
    if (!S) return;
    var p = S.examPassed;
    if (p >= 3) return;
    var b = STAGE_BOUNDS[p];
    if (S.score >= b) {
      // 当天考试失败过 → 保持关闭，次日再自动开放
      if (S.examFailDay !== S.day && S.examState !== '允许') {
        applyVar(['考试', '状态'], '允许');
        applyVar(['考试', '目标阶段'], STAGES[p + 1].name);
      }
      if (S.score > b) applyVar(['user', '总成绩值'], b);
    }
  }
  function rewardLinesHtml(tokens) {
    var map = {};
    for (var i = 0; i < tokens.length; i++) map[tokens[i].name] = (map[tokens[i].name] || 0) + 1;
    var lines = [];
    var names = Object.keys(map);
    for (var j = 0; j < names.length; j++) lines.push('【' + names[j] + '】×' + map[names[j]] + '（' + tokens[0].stage + '）');
    return lines;
  }
  function cloneStorageAfterAdd() {
    var S = getS();
    var tokens = SES.rewards;
    var arr = clone(S.storage);
    for (var i = 0; i < tokens.length; i++) {
      var found = -1;
      for (var j = 0; j < arr.length; j++) if (arr[j].名称 === tokens[i].name && arr[j].阶段 === tokens[i].stage) { found = j; break; }
      if (found >= 0) arr[found].数量 += 1;
      else arr.push({ 名称: tokens[i].name, 阶段: tokens[i].stage, 提示: tokens[i].guide, 数量: 1 });
    }
    return { list: arr, total: arr.reduce(function (a2, it) { return a2 + it.数量; }, 0) };
  }
  function storageTotal(arr) { return arr.reduce(function (a2, it) { return a2 + it.数量; }, 0); }
  function doClaim() {
    applyScoreGain();
    var lines = [];
    lines.push('【学业答题结算 · 索取奖励】');
    lines.push('- 本轮作答 ' + QZ.answered + ' 题：答对 ' + QZ.correct + ' 题，答错 ' + QZ.wrong + ' 题');
    var toks = SES.rewards.length ? SES.rewards : (QZ.correct > 0 ? buildRewards() : []);
    if (toks.length) {
      lines.push('- 本轮奖励（' + toks[0].stage + '，共 ' + toks.length + ' 张）：');
      var rl = rewardLinesHtml(toks);
      for (var i = 0; i < rl.length; i++) lines.push('   ' + rl[i]);
    } else {
      lines.push('- 本轮没有答对题，没有奖励券。');
    }
    if (QZ.frozen && !boundCrossed) lines.push('（成绩还卡在临界点上，得先通过妈妈的晋升考试才能继续加分。）');
    if (boundCrossed) {
      lines.push('');
      lines.push('（成绩刚好卡到了临界点上，状态栏的考试入口亮了——妈妈似乎该给你来一场“小考”了。）');
      boundCrossed = false;
    }
    lines.push('');
    lines.push('（你把奖励清单递到妈妈面前，等她按约定兑现……）');
    sendToInput(lines.join('\n'), true);
    toast('📤 索取奖励已填入输入框并发送，等待妈妈兑现！');
    endSessionUI();
  }
  function doStore() {
    var next = cloneStorageAfterAdd();
    if (next.total > CONF.maxStorage) { toast('奖励袋已满（上限 ' + CONF.maxStorage + ' 张），先使用一些再存储', 'err'); return; }
    applyScoreGain();
    applyVar(['奖励', '存储'], next.list);
    applyVar(['user', '奖励次数'], next.total);
    var got = SES.rewards.length || QZ.correct;
    toast('🗂 已存入奖励袋 ' + got + ' 张（状态栏奖励次数已更新，可随时点券使用）');
    endSessionUI();
  }
  function endSessionUI() {
    SES.rewards = [];

    setView('hub');
    redrawView();
  }
  /* ================= 考试 ================= */
  function startExam() {
    var S = getS();
    if (!canExamNow(S)) { toast('考试入口当前未开放', 'warn'); return false; }
    EZ.list = shuffleArray(HARD_POOL).slice(0, CONF.examNeed);
    EZ.i = 0; EZ.answered = 0; EZ.correct = 0; EZ.wrong = 0; EZ.done = false;
    return true;
  }
  function answerExam(idx) {
    if (SES.locked || EZ.done) return;
    var q = EZ.list[EZ.i];
    if (!q) return;
    SES.locked = true; SES.pick = idx;
    var right = idx === q.correctIndex;
    SES.feedOk = right; SES.feedback = right ? '回答正确' : '回答错误';
    EZ.answered++;
    if (right) EZ.correct++; else EZ.wrong++;
    redrawView();
  }
  function examNext() {
    if (EZ.i + 1 >= EZ.list.length) { finishExam(); return; }
    EZ.i++; SES.locked = false; SES.pick = -1; SES.feedback = '';
    redrawView();
  }
  function finishExam() {
    if (EZ.done) return;
    EZ.done = true;
    // 交卷时扣除考试消耗的 30 精力（无论是否通过）
    applyVar(['user', '精力值'], Math.max(0, getS().energy - CONF.examEnergy));
    var S = getS();
    var pass = EZ.correct >= CONF.examPass;
    var lines = [];
    lines.push('【亲密阶段考试 · 交卷】');
    lines.push('- 题量 ' + CONF.examNeed + ' 题，答对 ' + EZ.correct + ' 题（及格线 ≥' + CONF.examPass + ' 题）');
    if (pass) {
      lines.push('- 结果：✅ 通过！下一亲密阶段「' + (S.examTarget || '已解锁') + '」正式开放，之后做题可领取该阶段奖励券。');
      lines.push('（你放下笔，把答题卡推给妈妈，等她确认结果——）');
    } else {
      lines.push('- 结果：❌ 未及格。今天没法再考了，明天才能重新挑战。');

    } else {

      applyVar(['考试', '失败标记天'], S.day);

    sendToInput(lines.join('\n'), true);
    toast(pass ? '🏆 考试通过，进入下一亲密阶段！' : '❌ 未及格，明日再来');
    renderAllBars();
    redrawView();
  }

  /* ================= 商城 ================= */
  function doClaimAllowance() {
    var S = getS();
    if (S.lastClaimDay >= S.day) { toast('今天已经领过了（按 时间.第几天 判定），明天再来', 'warn'); return; }
    var money = dailyAllowance(S.score);
    applyVar(['user', '零花钱'], S.coins + money);
    applyVar(['user', '最后领取日'], S.day);

  function buyItem(key) {
    var S = getS();
    var it = findShop(key);
    if (!it) return;
    var isIQ = it.desc.indexOf('A') >= 0;
    var cur = isIQ ? S.iq : S.dVal;
    var cap = isIQ ? 5 : 2;
    if (S.coins < it.price) { toast('零花钱不足', 'err'); return; }
    if (cur >= cap) { toast((isIQ ? '智商' : '作弊D') + '已到上限，无法继续提升', 'warn'); return; }
    var nv = round2(Math.min(cap, cur + it.gain));
    applyVar(['user', '零花钱'], S.coins - it.price);
    if (isIQ) applyVar(['user', '智商值'], nv); else applyVar(['user', 'D加成'], nv);
    renderAllBars();
    toast('购买成功：' + it.name + '（' + it.desc + '），状态栏已更新');
  }

  /* ================= 家庭人物 / 奖励使用 ================= */
  function setFamily(mode) {
    var S = getS();
    var bro = S.bro, dad = S.dad;
    if (mode === 'bro') bro = bro === '有' ? '无' : '有';
    else if (mode === 'dad') dad = dad === '有' ? '无' : '有';
    else { bro = '无'; dad = '无'; }
    applyVar(['家庭人物', '弟弟'], bro);
    applyVar(['家庭人物', '爸爸'], dad);
    toast('家庭人物：弟弟=' + bro + '，爸爸=' + dad);
    renderAllBars();
  }
  function useToken(idx) {
    var S = getS();
    if (!S.storage || idx < 0 || idx >= S.storage.length) return;
    var it = S.storage[idx];
    var arr = clone(S.storage);
    var found = -1;
    for (var j = 0; j < arr.length; j++) if (arr[j].名称 === it.名称 && arr[j].阶段 === it.阶段) { found = j; break; }
    if (found < 0) return;
    if (arr[found].数量 <= 1) arr.splice(found, 1); else arr[found].数量 -= 1;
    var total = storageTotal(arr);
    applyVar(['奖励', '存储'], arr);
    applyVar(['user', '奖励次数'], total);
    sendToInput('【奖励使用】' + it.提示, true);
    toast('已使用：' + it.名称 + '，使用引导已发送正文');
    renderAllBars();
  }

  function applyFoldState(el) {

  /* ================= 事件 ================= */
  function onClick(e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-a]') : null;
    if (!el) return;
    var a = el.getAttribute('data-a');
    var x = el.getAttribute('data-x');
    try {
      switch (a) {
        case 'menu': goMenu(); break;
        case 'famfold': {
          var slot = el.closest('.' + P + '-slot');
          if (slot) {
            var box = slot.querySelector('#' + P + '-fambox');
            var arr = slot.querySelector('#' + P + '-famarr');
            if (box) {
              var show = box.style.display !== 'block';
              box.style.display = show ? 'block' : 'none';
              slot.__fold = show;
              if (arr) arr.textContent = show ? '▼' : '▶';
            }
          }
          break;
        }
        case 'famset': setFamily(x); break;
        case 'usetoken': useToken(parseInt(x, 10)); break;
        case 'nav': navTo(x); break;
        case 'opt': {
          if (SES.view === 'quiz') answerQuiz(parseInt(x, 10));
          else if (SES.view === 'exam') answerExam(parseInt(x, 10));
          break;
        }
        case 'qz-next': quizNext(); break;
        case 'qz-quit': quitQuiz(); break;
        case 'qz-end': QZ.done = true; redrawView(); break;
        case 'qz-settle': settleView(); break;
        case 'qz-restart': {
          SES.rewards = []; buildRewardsLocalReset();
          if (startQuiz()) { setView('quiz'); redrawView(); }
          break;
        }
        case 'settle-claim': doClaim(); break;
        case 'settle-store': doStore(); break;
        case 'ex-next': examNext(); break;
        case 'ex-finish': finishExam(); break;
        case 'buy': buyItem(x); break;
        case 'claim': doClaimAllowance(); break;
      }
    } catch (err) { try { console.error('[hsv2]', err); } catch (e2) {} }
  }
  function buildRewardsLocalReset() { SES.rewards = []; QZ.list = []; }

  function syncTick() {
    refresh(true);
    autoExamGate();
    renderAllBars();
  }

  /* ================= 启动 ================= */
  function cleanup() {
    [ownDoc(), getDoc()].forEach(function (doc) {
      if (!doc) return;
      qa('#' + P + '-css, #' + P + '-ov', doc).forEach(function (el2) { el2 && el2.remove(); });
      qa('#st_quiz_v27-trigger, #st_quiz_v27-overlay, #st_quiz_v27-reward-modal, #st_quiz_v27-styles', doc).forEach(function (el3) { el3 && el3.remove(); });
    });
  }
  function initHooksObserver() {
    var applyNew = function () {
      var slots = allSlots();
      for (var i = 0; i < slots.length; i++) {
        if (!slots[i].__hsv2) { slots[i].__hsv2 = true; renderOne(slots[i]); }
      }
    };
    applyNew();
    try {
      var obs = new MutationObserver(function () {
        applyNew();
        scheduleSync();
      });
      var tgt = qs('#chat') || getDoc().body;
      if (tgt) obs.observe(tgt, { childList: true, subtree: true });
      if (ownDoc() !== getDoc() && ownDoc().body) {
        try { obs.observe(ownDoc().body, { childList: true, subtree: true }); } catch (e2) {}
      }
    } catch (e) {}
  }
  var syncTimer = null;
  function scheduleSync() {
    if (syncTimer) return;
    syncTimer = setTimeout(function () { syncTimer = null; syncTick(); }, 350);
  }
  function bindHostEvents() {
    var doc = getDoc();
    doc.addEventListener('click', onClick);
    try { if (ownDoc() !== doc) ownDoc().addEventListener('click', onClick); } catch (e) {}
    try {
      var hostWin = mvuWin() || HOST;
      var fire = function () { scheduleSync(); };
      if (typeof HOST.eventOn === 'function') {
        var hostWin2 = mvuWin() || HOST;
        if (hostWin2 && hostWin2.Mvu && hostWin2.Mvu.events && hostWin2.Mvu.events.VARIABLE_UPDATE_ENDED) {
          HOST.eventOn(hostWin2.Mvu.events.VARIABLE_UPDATE_ENDED, fire);
        }
        if (typeof HOST.tavern_events !== 'undefined') {
          if (HOST.tavern_events.MESSAGE_RECEIVED) HOST.eventOn(HOST.tavern_events.MESSAGE_RECEIVED, fire);
          if (HOST.tavern_events.CHAT_CHANGED) HOST.eventOn(HOST.tavern_events.CHAT_CHANGED, function () { refresh(true); });
          if (HOST.tavern_events.MESSAGE_SENT) HOST.eventOn(HOST.tavern_events.MESSAGE_SENT, fire);
        }
      }
    } catch (e) {}
    setInterval(function () { refresh(true); renderAllBars(); }, 2500);
    try { setTimeout(function () { scheduleSync(); }, 900); } catch (e) {}
    try {
      if (typeof waitGlobalInitialized === 'function') {
        var wp = waitGlobalInitialized('Mvu');
        if (wp && typeof wp.then === 'function') { wp.then(function () { scheduleSync(); }).catch(function () {}); }
      }
    } catch (e) {}
    try { window.addEventListener('VARIABLE_UPDATE_ENDED', function () { scheduleSync(); }); } catch (e) {}
    window.addEventListener('pagehide', function () { try { clearInterval(window.__hsv2iv); } catch (e) {} });
  }

  function boot() {
    var doc = getDoc();
    cleanup();
    doc.head.insertAdjacentHTML('beforeend', CSS);
    doc.body.insertAdjacentHTML('beforeend', winHtml());
    var closeBtn = qs('#' + P + '-close');
    var backBtn = qs('#' + P + '-back');
    if (closeBtn) closeBtn.addEventListener('click', function () { closeWin(); });
    if (backBtn) backBtn.addEventListener('click', function () { navTo('hub'); });
    refresh(true);
    initHooksObserver();
    bindHostEvents();
    console.log('✅ 状态栏v3 整合玩法已启动（做题/考试/商城/奖励袋）。');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

window.addEventListener('unhandledrejection', function (ev) { try { var r = document.getElementById('hsv2-root'); if (r && !r.__showErr) { r.__showErr = true; r.style.padding='12px'; r.style.background='#2a1a14'; r.style.color='#ffb4b4'; r.style.border='1px solid #ff7b7b'; r.style.borderRadius='10px'; r.style.fontSize='12px'; r.innerHTML = '⚠ 状态栏异步错误: ' + ((ev && ev.reason && (ev.reason.message || ev.reason)) || 'unknown'); } } catch (e) {} });
