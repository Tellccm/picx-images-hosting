<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>状态栏 · 我的家里妹有猫娘！</title>
<style>
:root{--ink:#4a373a;--muted:#8c6a70;--faint:#cbb0b5;--accent:#ff6b8b;--soft:#fff0f3;--line:#ffe0e6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);line-height:1.6;background:transparent;padding:2px}
.status{background:linear-gradient(135deg,rgba(255,244,247,.96),rgba(255,255,255,.97));border:1px solid var(--line);border-radius:16px;padding:10px 14px;max-width:680px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--accent);text-align:center;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;gap:9px}
.av{flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:20px}
.av img{width:100%;height:100%;object-fit:cover}
.mid{flex:1;min-width:0}
.nm{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.nm .tag{font-size:9.5px;color:var(--accent);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:0 5px;font-weight:500}
.lab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:5px}
.bar{height:6px;background:#ffe3e8;border-radius:6px;overflow:hidden;margin-top:2px}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ffb3c1);border-radius:6px;transition:width .3s}
.stat{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
.stat b{color:var(--accent);font-weight:700}
.th{font-size:10.5px;color:#e2587c;font-style:italic;background:rgba(255,143,163,.08);border-left:2px solid var(--accent);border-radius:6px;padding:3px 7px;margin-top:5px;line-height:1.45}
.ft{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11.5px;font-weight:700;color:#d94e6c;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.msg{text-align:center;font-size:12px;color:var(--faint);padding:6px 0}
</style>
</head>
<body>
<div class="status">
  <div class="msg" id="msg">正在读取状态……</div>
  <div id="panel" style="display:none">
    <div class="hd">📅 <span id="dtime">时间流逝中...</span></div>
    <div class="grid">
      <div class="card">
        <div class="av"><img src="https://$198 108 111 98 32 57 51 57 50 0/苏依依-头像.1hsytlz1xx.webp" alt=""></div>
        <div class="mid">
          <div class="nm">🌸 苏依依 <span class="tag">妹妹</span></div>
          <div class="lab"><span>开放度</span><span><b id="op">5</b>/100</span></div>
          <div class="bar"><div class="fill" id="opf" style="width:5%"></div></div>
          <div class="stat"><span>内射次数</span><b id="yc">0</b></div>
          <div class="th" id="yth">（依依正在想事情…）</div>
        </div>
      </div>
      <div class="card">
        <div class="av"><img src="https://$198 108 111 98 32 57 51 57 50 0/雪球-头像.67y7s0qobe.webp" alt=""></div>
        <div class="mid">
          <div class="nm">🐾 雪球 <span class="tag">猫娘</span></div>
          <div class="stat"><span>内射次数</span><b id="sc">0</b></div>
          <div class="th" id="sth">（雪球正在发呆…）</div>
        </div>
      </div>
    </div>
    <div class="ft">💖 全员累计内射 <b id="tc">0</b> 次 💖</div>
  </div>
</div>
<script>
(function () {
'use strict';
// ---------- 工具 ----------
function scope(name) {
  const candidates = [globalThis];
  try { if (globalThis.parent && globalThis.parent !== globalThis) candidates.push(globalThis.parent); } catch (_) {}
  try { if (globalThis.top && !candidates.includes(globalThis.top)) candidates.push(globalThis.top); } catch (_) {}
  for (const c of candidates) { try { if (c && c[name] !== undefined) return c[name]; } catch (_) {} }
  return undefined;
}
const $id = function (i) { return document.getElementById(i); };
function getPath(o, p) {
  if (!o || !p) return undefined;
  const s = String(p).replace(/\[(\d+)\]/g, '.$1').split('.');
  let v = o;
  for (const k of s) { if (v == null) return undefined; v = v[k]; }
  return v;
}
function toVal(v, fb) {
  if (v === undefined || v === null || v === '') return fb;
  if (Array.isArray(v)) v = v[0];
  if (typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') return v;
  return fb;
}
function setTxt(id, v, fb) { const n = $id(id); if (n) n.textContent = toVal(v, fb); }
function setMsg(txt, isErr) {
  const m = $id('msg');
  if (!m) return;
  m.style.display = 'block';
  m.textContent = txt;
  m.style.color = isErr ? '#d64545' : 'var(--faint)';
  const p = $id('panel'); if (p) p.style.display = 'none';
}
function showPanel() {
  const m = $id('msg'); if (m) m.style.display = 'none';
  const p = $id('panel'); if (p) p.style.display = 'block';
}

// ---------- 解析消息文本里的 {{setvar}} 注释（兜底数据源） ----------
function parseSetvars(text) {
  const out = {};
  if (!text) return out;
  const re = /\{\{\s*setvar\s+([^\s}]+)\s+"([^"]*)"\s*\}\}/g;
  let m;
  while ((m = re.exec(text)) !== null) { out[m[1]] = m[2]; }
  return out;
}

// ---------- 取数路径 ----------
// 目标：找到“当前显示的那条消息文本 + 它的变量”
async function getMessageContext() {
  const errs = [];
  // 路径 A：Mvu API（原卡同款）
  const Mvu = scope('Mvu');
  const gcmid = scope('getCurrentMessageId');
  if (Mvu && typeof Mvu.getMvuData === 'function' && gcmid) {
    try {
      const msgId = gcmid();
      const data = Mvu.getMvuData({ type: 'message', message_id: msgId });
      if (data && (data.stat_data || data.display_data)) {
        return { kind: 'mvu', data: data };
      }
    } catch (e) { errs.push('Mvu:' + e.message); }
  }
  // 路径 B：TavernHelper.getChatMessages 直接读 message.data（MVU 官方文档推荐读取法）
  const th = scope('TavernHelper');
  if (th && typeof th.getChatMessages === 'function') {
    try {
      const msgs = await th.getChatMessages('0', { include_swipes: true });
      const m0 = msgs && msgs[0];
      if (m0) {
        const d = m0.data || {};
        const sd = d.display_data || d.stat_data;
        if (sd) return { kind: 'message-data', data: { stat_data: d.stat_data, display_data: d.display_data } };
        // 数据不在 message.data：退回解析当前 swipe 文本
        const cur = (m0.swipes && Number.isInteger(m0.swipe_id) && m0.swipes[m0.swipe_id] != null)
          ? m0.swipes[m0.swipe_id] : m0.message;
        return { kind: 'text', text: cur || '' };
      }
    } catch (e) { errs.push('TH:' + e.message); }
  }
  return { kind: 'none', errs: errs };
}

// ---------- 渲染 ----------
function renderFromVars(sd) {
  const y = (sd && sd.yiyi) || {}, s = (sd && sd.snowball) || {}, g = (sd && sd.global) || {};
  const rawOp = getPath(y, 'openness');
  const opArr = Array.isArray(rawOp) ? rawOp : [rawOp];
  const op = Number(toVal(opArr[0], 5));
  const opv = Number.isFinite(op) ? Math.max(0, Math.min(100, op)) : 5;
  setTxt('op', opv, '5');
  const f = $id('opf'); if (f) f.style.width = opv + '%';
  const cv = function (obj, key, fb) { const v = getPath(obj, key); return toVal(Array.isArray(v) ? v[0] : v, fb); };
  setTxt('yc', cv(y, 'creampie_count', 0), 0);
  setTxt('sc', cv(s, 'creampie_count', 0), 0);
  setTxt('tc', cv(g, 'total_creampie', 0), 0);
  setTxt('dtime', cv(g, 'date_time', null), '时间流逝中...');
  setTxt('yth', cv(y, 'thought', null), '（依依正在想事情…）');
  setTxt('sth', cv(s, 'thought', null), '（雪球正在发呆…）');
  showPanel();
  return true;
}
function renderFromText(text) {
  const sv = parseSetvars(text);
  setTxt('op', 5, '5');
  const f = $id('opf'); if (f) f.style.width = '5%';
  setTxt('yc', 0, 0); setTxt('sc', 0, 0); setTxt('tc', 0, 0);
  setTxt('dtime', sv['global.date_time'] || null, '时间流逝中...');
  setTxt('yth', sv['yiyi.thought'] || null, '（依依正在想事情…）');
  setTxt('sth', sv['snowball.thought'] || null, '（雪球正在发呆…）');
  showPanel();
  return true;
}

// ---------- 主刷新 ----------
async function refresh() {
  try {
    const ctx = await getMessageContext();
    if (ctx.kind === 'mvu') {
      const sd = ctx.data.display_data || ctx.data.stat_data || {};
      if (!renderFromVars(sd)) setMsg('状态数据为空。', true);
      return;
    }
    if (ctx.kind === 'message-data') {
      const sd = ctx.data.display_data || ctx.data.stat_data || {};
      if (!renderFromVars(sd)) setMsg('状态数据为空。', true);
      return;
    }
    if (ctx.kind === 'text') {
      if (!renderFromText(ctx.text)) setMsg('开场文本为空。', true);
      return;
    }
    const why = (ctx.errs && ctx.errs.length) ? ctx.errs.join(' | ') : '未找到 Mvu / TavernHelper';
    setMsg('⚠️ ' + why + '（若在浏览器直接打开属正常，请在酒馆聊天中使用）', true);
  } catch (e) {
    setMsg('⚠️ 状态读取异常: ' + (e && e.message ? e.message : String(e)), true);
  }
}

async function boot() {
  // 最多等 15 秒让扩展就绪
  for (let i = 0; i < 60; i++) {
    if (scope('Mvu') || scope('TavernHelper')) break;
    await new Promise(r => setTimeout(r, 250));
  }
  await refresh();
  setInterval(refresh, 1500);
}
boot();
})();
</script>
</body>
</html>
