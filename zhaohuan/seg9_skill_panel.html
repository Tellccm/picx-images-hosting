<!-- ============================================================
     卡内前端 · 技能树生成面板（完整块）· 召唤纪版
     布局对齐参考截图：标题 / 输入框+生成按钮 / 两个开关行 / 说明 / 虚线占位区
     改造点：参考卡是"职业+转职"体系，本卡没有职业，改用本卡自己的轴：
             血统品阶（6档） + 契约形态（4类） + 自定义
     图标策略：无图标，全文字
     ============================================================ -->
<div id="zhaohuan-skill">
<style>
#zhaohuan-skill *{box-sizing:border-box;margin:0;padding:0}
#zhaohuan-skill{
  --line:#e2e5e2;--line2:#d5dad6;--ink:#2c3330;--ink2:#6d7671;--ink3:#98a09b;
  --accent:#2f6b4f;--accent2:#3d8a66;--warn:#b8860b;--danger:#c0392b;
  --bg:#f5f7f5;--card:#ffffff;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);width:100%;max-width:820px;margin:14px auto;padding:0 4px;line-height:1.6}
#zhaohuan-skill .zks-title{font-size:19px;font-weight:800;letter-spacing:.02em;margin:0 0 12px}
#zhaohuan-skill .zks-group{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:12px}
#zhaohuan-skill .zks-group-label{font-size:12.5px;color:var(--ink2);margin-bottom:9px;font-weight:600}
#zhaohuan-skill .zks-chips{display:flex;flex-wrap:wrap;gap:8px}
#zhaohuan-skill .zks-chip{
  border:1px solid var(--line2);background:var(--card);color:var(--ink);
  border-radius:7px;padding:6px 14px;font-size:13px;cursor:pointer;
  transition:all .15s;user-select:none;font-family:inherit}
#zhaohuan-skill .zks-chip:hover{border-color:var(--accent2);color:var(--accent)}
#zhaohuan-skill .zks-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#zhaohuan-skill .zks-chip.ghost{border-style:dashed;color:var(--ink2)}
#zhaohuan-skill .zks-chip.ghost:hover{border-color:var(--accent2);color:var(--accent)}
#zhaohuan-skill .zks-tree-title-row{font-size:15.5px;font-weight:800;margin-bottom:11px}
#zhaohuan-skill .zks-input-row{display:flex;gap:10px;align-items:stretch;margin-bottom:11px}
#zhaohuan-skill textarea#zks-style{
  flex:1;min-height:56px;resize:vertical;border:1px solid var(--line2);border-radius:9px;
  padding:10px 12px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--card);outline:none}
#zhaohuan-skill textarea#zks-style::placeholder{color:var(--ink3)}
#zhaohuan-skill textarea#zks-style:focus{border-color:var(--accent2)}
#zhaohuan-skill .zks-gen-btn{
  flex:0 0 132px;border:0;border-radius:9px;background:var(--accent);color:#fff;
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
#zhaohuan-skill .zks-gen-btn:hover:not(:disabled){background:var(--accent2)}
#zhaohuan-skill .zks-gen-btn:disabled{opacity:.55;cursor:not-allowed}
#zhaohuan-skill .zks-switch-row{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
#zhaohuan-skill .zks-switch{
  position:relative;flex:0 0 38px;height:20px;border-radius:99px;background:#cfd5d1;
  cursor:pointer;transition:background .18s}
#zhaohuan-skill .zks-switch.on{background:var(--accent)}
#zhaohuan-skill .zks-switch::after{
  content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
#zhaohuan-skill .zks-switch.on::after{transform:translateX(18px)}
#zhaohuan-skill .zks-switch-label{font-size:13px;font-weight:700}
#zhaohuan-skill .zks-switch-desc{font-size:12.5px;color:var(--ink2);font-weight:400}
#zhaohuan-skill .zks-note{display:flex;gap:8px;background:#fdfaf0;border:1px solid #f0e4c0;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#6b6154}
#zhaohuan-skill .zks-note-mark{flex:0 0 auto;color:var(--warn);font-weight:800}
#zhaohuan-skill .zks-note b{color:var(--danger);font-weight:700}
#zhaohuan-skill .zks-placeholder{
  border:1.5px dashed #cfd8d2;border-radius:11px;background:#fbfcfb;
  padding:52px 20px;text-align:center;color:var(--ink3)}
#zhaohuan-skill .zks-empty-subject{font-size:12.5px;color:var(--ink3);margin-bottom:8px}
#zhaohuan-skill .zks-empty-main{font-size:14.5px;color:var(--ink3)}
#zhaohuan-skill .zks-tree-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px}
#zhaohuan-skill .zks-tree-title{font-size:15px;font-weight:800}
#zhaohuan-skill .zks-tree-sub{font-size:12px;color:var(--ink2)}
#zhaohuan-skill .zks-sp{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
#zhaohuan-skill .zks-tier{margin-bottom:14px}
#zhaohuan-skill .zks-tier-label{font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:.14em;margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
#zhaohuan-skill .zks-nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:9px}
#zhaohuan-skill .zks-node{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:10px 11px}
#zhaohuan-skill .zks-node.on{border-color:var(--accent2);box-shadow:inset 0 0 0 1px rgba(61,138,102,.2)}
#zhaohuan-skill .zks-n-top{display:flex;align-items:baseline;gap:7px;margin-bottom:5px}
#zhaohuan-skill .zks-n-name{font-size:13.5px;font-weight:800}
#zhaohuan-skill .zks-n-type{font-size:11px;color:var(--ink2);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
#zhaohuan-skill .zks-n-desc{font-size:12px;color:var(--ink2);line-height:1.6;min-height:38px}
#zhaohuan-skill .zks-n-meta{font-size:11.5px;color:var(--ink3);margin-top:6px;font-variant-numeric:tabular-nums}
#zhaohuan-skill .zks-n-state{font-size:11.5px;font-weight:800;margin-top:5px;color:var(--ink3)}
#zhaohuan-skill .zks-node.on .zks-n-state{color:var(--accent)}
#zhaohuan-skill .zks-toast{
  position:fixed;left:50%;bottom:36px;transform:translateX(-50%);
  background:#fff;border:1px solid var(--line2);border-radius:8px;color:var(--ink);
  font-size:13px;padding:9px 18px;opacity:0;transition:opacity .22s;pointer-events:none;
  box-shadow:0 6px 22px rgba(0,0,0,.14);z-index:2147483600}
#zhaohuan-skill .zks-toast.on{opacity:1}
</style>

<div class="zks-title">召唤兽技能树</div>

<div class="zks-group">
  <div class="zks-group-label">血统品阶（决定阶段上限与分支数量）</div>
  <div class="zks-chips" id="zks-ranks">
    <button class="zks-chip" data-zks-rank="凡种">凡种</button>
    <button class="zks-chip" data-zks-rank="良种">良种</button>
    <button class="zks-chip" data-zks-rank="贵种">贵种</button>
    <button class="zks-chip" data-zks-rank="超凡种">超凡种</button>
    <button class="zks-chip" data-zks-rank="传说种">传说种</button>
    <button class="zks-chip" data-zks-rank="王种">王种</button>
  </div>
</div>

<div class="zks-group">
  <div class="zks-group-label">契约形态（决定技能倾向）</div>
  <div class="zks-chips" id="zks-forms">
    <button class="zks-chip" data-zks-form="共生">共生　随兽一同成长</button>
    <button class="zks-chip" data-zks-form="武装">武装　兽化为兵器</button>
    <button class="zks-chip" data-zks-form="领域">领域　展开影响范围</button>
    <button class="zks-chip" data-zks-form="替身">替身　承受与转移</button>
  </div>
  <div class="zks-chips" style="margin-top:9px">
    <button class="zks-chip ghost" data-zks-form="__auto__">按物种自动决定</button>
  </div>
</div>

<div class="zks-group">
  <div class="zks-tree-title-row" id="zks-title">未确定召唤兽 技能树</div>

  <div class="zks-input-row">
    <textarea id="zks-style" placeholder="可选：指定想要的技能或战斗风格…"></textarea>
    <button class="zks-gen-btn" id="zks-gen">生成技能树</button>
  </div>

  <div class="zks-switch-row" id="zks-sw-standard">
    <div class="zks-switch"></div>
    <div><span class="zks-switch-label">标准模式</span>
    <span class="zks-switch-desc">　不带预设和世界书，不会被预设干扰，但无法破限</span></div>
  </div>

  <div class="zks-switch-row" id="zks-sw-twostep">
    <div class="zks-switch on"></div>
    <div><span class="zks-switch-label">分两步生成</span>
    <span class="zks-switch-desc">　先生成技能树骨架，再补全每一级特殊效果，通常效果更好</span></div>
  </div>
</div>

<div class="zks-note">
  <span class="zks-note-mark">!</span>
  <div>请往机制和风味上描写，如果需要更多自由度，请明确指定需要更多的特殊技能数量，默认只有三个，其他都是伤害技能，<b>伤害数值没法改，并且不要生成被动，AI处理被动技能非常消极。技能树很长，最大回复长度至少要1.5W。</b></div>
</div>

<div class="zks-placeholder" id="zks-tree" style="margin-top:12px">
  <div class="zks-empty-subject">当前对象：未确定召唤兽</div>
  <div class="zks-empty-main">点击上方按钮，为该召唤兽生成专属技能树</div>
</div>

<div class="zks-toast" id="zks-toast"></div>
</div>
