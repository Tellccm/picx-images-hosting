        var vv = m && m.variables && m.variables[m.swipe_id || 0];
        if (vv && vv.stat_data) d = { stat_data: vv.stat_data };
      } catch (e) {}
    }
    return d && d.stat_data ? d.stat_data : null;
  }

  function build(data, theme) {
    var persons = data['人物'] || {};
    var when = data['时间'] || {};
    var dateText = [when['月'], when['日']].filter(Boolean).join('');
    var wd = weekdayOf(when['年'], when['月'], when['日']);
    if (wd) dateText = (dateText ? dateText + ' ' : '') + wd;
    var clock = [when['时刻'], when['时段']].filter(Boolean).join(' ');
    var meta = [dateText, clock, when['地点']].filter(Boolean).join(' · ');

    var out = '<div class="jg-hud" data-theme="' + esc(theme) + '">'
      + '<div class="jg-head"><div class="jg-title"><span class="jg-cn">家规</span>'
      + '<span class="jg-en">Family Rules</span><span class="jg-ver">v11</span></div>'
      + '<div class="jg-when"><i></i>' + esc(meta || '——') + '</div><div class="jg-dots">';
    THEMES.forEach(function (t) {
      out += '<button class="jg-dot' + (t.id === theme ? ' on' : '') + '" data-t="' + t.id + '" title="' + t.label + '"></button>';
    });
    out += '</div></div>';

    PERSONS.forEach(function (p) {
      var ax = persons[p.key] || {};
      var n = Number(ax['内射次数']);
      n = Number.isFinite(n) ? Math.max(0, Math.round(n)) : 0;
      var ctrl = clampNum(ax['索取值']);
      var ava = AVA[p.key] || { u: '', f: '' };
      out += '<div class="jg-p"><div class="jg-avawrap" style="--p:' + ctrl + ';--jg-ava-c:var(' + p.tone + ')">'
        + '<img class="jg-ava" alt="' + esc(p.key) + '" width="84" height="84" draggable="false" '
        + 'src="' + ava.f + '" data-hd="' + ava.u + '">'
        + '<span class="jg-badge">' + n + '</span></div>'
        + '<div class="jg-body"><div class="jg-prow">'
        + '<span class="jg-nm">' + esc(p.key) + '</span>'
        + '<span class="jg-rel">' + esc(p.sub) + '</span>'
        + '<span class="jg-stage">' + esc(stageOf(p, n)) + '</span></div>'
        + '<div class="jg-metrics">';
      AXES.forEach(function (a) {
        var v = clampNum(ax[a.key]);
        out += '<div class="jg-m"><span class="jg-k">' + esc(a.key) + '</span>'
          + '<span class="jg-bar"><span class="jg-fill" style="width:' + v + '%;background:var(' + a.v + ')"></span></span>'
          + '<span class="jg-v">' + v + '</span></div>';
      });
      out += '</div>';
      var heart = ax['心声'];
      if (heart && String(heart).trim()) out += '<div class="jg-note">「' + esc(heart) + '」</div>';
      out += '</div></div>';
    });

    out += '<div class="jg-foot"><span>玄关 · 客厅 · 主卧</span><span>'
      + esc(when['年'] ? when['年'] + ' 年' : '') + '</span></div></div>';
    return out;
  }

  function applyTheme(th) {
    if (!th) return;
    ls(LS_THEME, th);
    var huds = document.querySelectorAll('.jg-hud');
    for (var i = 0; i < huds.length; i++) {
      huds[i].setAttribute('data-theme', th);
      var dots = huds[i].querySelectorAll('.jg-dot');
      for (var j = 0; j < dots.length; j++) dots[j].classList.toggle('on', dots[j].getAttribute('data-t') === th);
    }
  }
  document.addEventListener('click', function (e) {
    var d = e.target && e.target.closest ? e.target.closest('.jg-dot') : null;
    if (!d) return;
    e.preventDefault();
    applyTheme(d.getAttribute('data-t'));
  }, true);

  function upgrade(rootEl) {
    var list = rootEl.querySelectorAll('img[data-hd]');
    Array.prototype.forEach.call(list, function (img) {
      var hd = img.getAttribute('data-hd');
      if (!hd || img.getAttribute('data-done') === '1') return;
      img.setAttribute('data-done', '1');
      var probe = new Image();
      probe.onload = function () { if (probe.naturalWidth > 0) img.src = hd; };
      probe.src = hd;
    });
  }

  function render() {
    var data = readStat();
    if (!data) { root.innerHTML = ''; return; }
    root.innerHTML = build(data, themeNow());
    upgrade(root);
    var imgs = root.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) imgs[i].draggable = false;
  }

  render();
  try {
    if (typeof eventOn === 'function' && typeof tavern_events !== 'undefined') {
      eventOn(tavern_events.MESSAGE_SWIPED, render);
      eventOn(tavern_events.MESSAGE_UPDATED, render);
      eventOn(tavern_events.GENERATION_ENDED, render);
    }
  } catch (e) {}
})();
</script>
</body></html>
